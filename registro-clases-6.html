<!DOCTYPE html>
<html lang="es">
<head>
<script>
  window.THEME_COLOR_PRESETS = {
    purple: { light:{primary:'#6C4EE3',primaryDark:'#5638C4',primaryLight:'#F1ECFC',primaryBorder:'rgba(108,78,227,0.3)'}, dark:{primary:'#A78BFA',primaryDark:'#C4B5FD',primaryLight:'rgba(167,139,250,0.16)',primaryBorder:'rgba(167,139,250,0.4)'} },
    blue:   { light:{primary:'#2C72C7',primaryDark:'#1F5A9E',primaryLight:'#E7F1FC',primaryBorder:'rgba(44,114,199,0.3)'}, dark:{primary:'#7AB8F5',primaryDark:'#A7D3FA',primaryLight:'rgba(122,184,245,0.16)',primaryBorder:'rgba(122,184,245,0.4)'} },
    green:  { light:{primary:'#1F9D64',primaryDark:'#187A4E',primaryLight:'#E6F8EF',primaryBorder:'rgba(31,157,100,0.3)'}, dark:{primary:'#4ADE94',primaryDark:'#86EFB8',primaryLight:'rgba(74,222,148,0.16)',primaryBorder:'rgba(74,222,148,0.4)'} },
    orange: { light:{primary:'#C6871A',primaryDark:'#9E6B14',primaryLight:'#FDF3DE',primaryBorder:'rgba(198,135,26,0.3)'}, dark:{primary:'#F0B429',primaryDark:'#F5C95C',primaryLight:'rgba(240,180,41,0.16)',primaryBorder:'rgba(240,180,41,0.4)'} },
    pink:   { light:{primary:'#C93E85',primaryDark:'#A32E6B',primaryLight:'#FCEAF3',primaryBorder:'rgba(201,62,133,0.3)'}, dark:{primary:'#F472B6',primaryDark:'#F9A8D4',primaryLight:'rgba(244,114,182,0.16)',primaryBorder:'rgba(244,114,182,0.4)'} },
    teal:   { light:{primary:'#1B8A8A',primaryDark:'#146868',primaryLight:'#E0F7F7',primaryBorder:'rgba(27,138,138,0.3)'}, dark:{primary:'#5CD6D6',primaryDark:'#8FE6E6',primaryLight:'rgba(92,214,214,0.16)',primaryBorder:'rgba(92,214,214,0.4)'} },
    red:    { light:{primary:'#C0392B',primaryDark:'#992E22',primaryLight:'#FCECEA',primaryBorder:'rgba(192,57,43,0.3)'}, dark:{primary:'#F1948A',primaryDark:'#F7BDB6',primaryLight:'rgba(241,148,138,0.16)',primaryBorder:'rgba(241,148,138,0.4)'} },
    indigo: { light:{primary:'#4453C4',primaryDark:'#33409E',primaryLight:'#E8EAFB',primaryBorder:'rgba(68,83,196,0.3)'}, dark:{primary:'#A5B4FC',primaryDark:'#C7D2FE',primaryLight:'rgba(165,180,252,0.16)',primaryBorder:'rgba(165,180,252,0.4)'} },
    gold:   { light:{primary:'#B8860B',primaryDark:'#8F6908',primaryLight:'#FBF3DC',primaryBorder:'rgba(184,134,11,0.3)'}, dark:{primary:'#FBBF24',primaryDark:'#FDD877',primaryLight:'rgba(251,191,36,0.16)',primaryBorder:'rgba(251,191,36,0.4)'} },
    cyan:   { light:{primary:'#1D8FB8',primaryDark:'#166F90',primaryLight:'#E0F4FB',primaryBorder:'rgba(29,143,184,0.3)'}, dark:{primary:'#67E8F9',primaryDark:'#A5F3FC',primaryLight:'rgba(103,232,249,0.16)',primaryBorder:'rgba(103,232,249,0.4)'} },
    lime:   { light:{primary:'#65A30D',primaryDark:'#4D7D0A',primaryLight:'#F0F5DC',primaryBorder:'rgba(101,163,13,0.3)'}, dark:{primary:'#A3E635',primaryDark:'#C2F065',primaryLight:'rgba(163,230,53,0.16)',primaryBorder:'rgba(163,230,53,0.4)'} },
    brown:  { light:{primary:'#A85A2E',primaryDark:'#824423',primaryLight:'#F5E6DC',primaryBorder:'rgba(168,90,46,0.3)'}, dark:{primary:'#E0A67D',primaryDark:'#EBC3A3',primaryLight:'rgba(224,166,125,0.16)',primaryBorder:'rgba(224,166,125,0.4)'} },
  };
  (function(){
    try{
      var t = localStorage.getItem('themePreference');
      if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
      var colorName = localStorage.getItem('themeColorName') || 'purple';
      var preset = window.THEME_COLOR_PRESETS[colorName] || window.THEME_COLOR_PRESETS.purple;
      var vars = (t === 'dark') ? preset.dark : preset.light;
      var root = document.documentElement.style;
      root.setProperty('--primary', vars.primary);
      root.setProperty('--primary-dark', vars.primaryDark);
      root.setProperty('--primary-light', vars.primaryLight);
      root.setProperty('--primary-border', vars.primaryBorder);
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Clases</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C4EE3">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --primary:#6C4EE3;
    --primary-dark:#5638C4;
    --primary-light:#F1ECFC;
    --primary-border:rgba(108,78,227,0.3);
    --bg:#F6F5FB;
    --card-bg:#FFFFFF;
    --text:#2B2A3D;
    --text-dim:#7C7A94;
    --border:#E9E6F5;
    --border-strong:#DAD4F0;
    --success:#22B573;
    --success-light:#E6F8EF;
    --success-border:rgba(34,181,115,0.35);
    --danger:#F0554A;
    --danger-light:#FDECEA;
    --danger-border:rgba(240,85,74,0.35);
    --shadow: 0 6px 20px rgba(76,60,150,0.08);
    --radius: 12px;
  }
  :root[data-theme="dark"]{
    --primary:#A78BFA;
    --primary-dark:#C4B5FD;
    --primary-light:rgba(167,139,250,0.16);
    --primary-border:rgba(167,139,250,0.4);
    --bg:#17141F;
    --card-bg:#221E2E;
    --text:#EDEAF5;
    --text-dim:#A79FC4;
    --border:#332C47;
    --border-strong:#453A5E;
    --success:#34D399;
    --success-light:rgba(52,211,153,0.16);
    --success-border:rgba(52,211,153,0.4);
    --danger:#F87171;
    --danger-light:rgba(248,113,113,0.16);
    --danger-border:rgba(248,113,113,0.4);
    --shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app-font{ font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  h1, h2, .heading-font{ font-family:'Poppins', 'Inter', sans-serif; }
  header{
    background:var(--card-bg);
    color:var(--text);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:1px solid var(--border);
    box-shadow: 0 2px 10px rgba(76,60,150,0.05);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.1px;
    color:var(--primary-dark);
  }
  header .subtitle{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    color:var(--text-dim);
    margin-top:2px;
    letter-spacing:0.1px;
  }
  #icon-actions-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Inter', sans-serif;
    flex-wrap:wrap;
  }
  #selector-bar{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:10px 24px;
    font-family:'Inter', sans-serif;
  }
  .selector-group{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .selector-label{
    font-size:0.72rem;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-right:2px;
  }
  select, input, textarea, button{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
  }
  select#groupSelect{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--card-bg);
    color:var(--text);
    min-width:180px;
  }
  nav.tabs{
    display:flex;
    gap:0;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:0 16px;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Inter', sans-serif;
    background:none;
    border:none;
    padding:14px 18px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:0.92rem;
    font-weight:600;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    letter-spacing:0.1px;
  }
  nav.tabs button.active{
    color:var(--primary);
    border-bottom:3px solid var(--primary);
    font-weight:700;
  }
  nav.subtabs{
    background:var(--bg);
    padding:0 16px;
  }
  nav.subtabs button{
    font-size:0.84rem;
    padding:10px 14px;
  }
  main{
    max-width:980px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .card h2{
    margin-top:0;
    font-size:1.08rem;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.1px;
    padding-bottom:12px;
    margin-bottom:14px;
    border-bottom:2px solid var(--primary-light);
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  label{
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    color:var(--text-dim);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input[type=text], input[type=date], input[type=time], input[type=number], textarea, select{
    padding:9px 10px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    background:var(--card-bg);
    color:var(--text);
    width:100%;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
  }
  input::placeholder, textarea::placeholder{ color:#B4B0C9; }
  textarea{ min-height:60px; resize:vertical; font-family:'Inter', sans-serif; }
  .btn{
    font-family:'Inter', sans-serif;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
    font-size:0.88rem;
    transition:transform .05s ease, filter .1s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-accent{ background:var(--primary); color:#fff; }
  .btn-accent:hover{ background:var(--primary-dark); }
  .btn-ink{ background:#2B2A3D; color:#fff; }
  .btn-ink:hover{ filter:brightness(1.2); }
  .btn-outline{ background:transparent; color:var(--primary); border:1px solid var(--border-strong); }
  .btn-outline:hover{ background:var(--primary-light); border-color:var(--primary-border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger-border); }
  .btn-danger:hover{ background:var(--danger-light); }
  .btn-sm{ padding:5px 10px; font-size:0.78rem; }
  table{ width:100%; border-collapse:collapse; font-family:'Inter', sans-serif; font-size:0.88rem; }
  th, td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text); }
  th{ color:var(--text-dim); font-weight:700; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; }
  tr:last-child td{ border-bottom:none; }
  .pill{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:2px 10px;
    border-radius:20px;
    font-size:0.75rem;
    font-family:'Inter', sans-serif;
    font-weight:700;
    border:1px solid var(--primary-border);
  }
  .pill-success{ background:var(--success-light); color:var(--success); border-color:var(--success-border); }
  .pill-danger{ background:var(--danger-light); color:var(--danger); border-color:var(--danger-border); }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--text-dim);
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
  }
  .score-select{
    width:64px;
    padding:6px;
    text-align:center;
  }
  .indicator-header-name{ max-width:110px; color:var(--text-dim); }
  .flex-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .accordion-header{ cursor:pointer; user-select:none; }
  .accordion-header:hover{ opacity:0.85; }
  .accordion-chevron{ display:inline-block; width:14px; color:var(--primary); font-weight:700; }
  .quick-links-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
    gap:10px;
  }
  .quick-link-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:16px 8px;
    font-size:1.5rem;
    line-height:1.3;
    text-align:center;
  }
  .quick-link-btn span{ font-size:0.72rem; font-weight:700; }
  .week-summary{ display:flex; flex-direction:column; gap:6px; }
  .week-day-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:8px 6px;
    border-bottom:1px solid var(--border);
  }
  .week-day-row:last-child{ border-bottom:none; }
  .week-day-row.week-day-today{ background:var(--primary-light); border-radius:8px; }
  .week-day-label{
    min-width:44px;
    text-align:center;
    font-weight:700;
    font-size:0.78rem;
    color:var(--text);
    padding-top:2px;
  }
  .week-day-items{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    flex:1;
  }
  .muted{ color:var(--text-dim); font-family:'Inter', sans-serif; font-size:0.82rem; }
  .divider{ border:none; border-top:1px solid var(--border); margin:16px 0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--primary);
    color:#fff;
    padding:10px 14px 10px 20px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    font-weight:700;
    box-shadow:0 4px 16px rgba(76,60,150,0.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:999;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:90vw;
  }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast-close-btn{
    background:rgba(255,255,255,0.25);
    border:none;
    color:#fff;
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:50%;
    cursor:pointer;
    font-size:0.8rem;
    line-height:1;
    flex-shrink:0;
  }
  .indicator-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--primary-light);
    color:var(--text);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--primary-border);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    margin:4px 6px 4px 0;
  }
  .indicator-tag button{
    background:none; border:none; color:var(--danger); cursor:pointer; font-weight:700; padding:0;
  }
  .file-drop{
    border:2px dashed var(--border-strong);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-family:'Inter', sans-serif;
    color:var(--text-dim);
    font-size:0.85rem;
    cursor:pointer;
  }
  .file-drop:hover{ background:var(--primary-light); border-color:var(--primary); }
  .student-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-family:'Inter', sans-serif;
  }
  .student-name-link{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--primary-dark); font-weight:600; font-size:0.92rem; text-align:left;
    font-family:'Inter', sans-serif;
  }
  .student-name-link:hover{ text-decoration:underline; }
  .avg-badge{
    font-weight:700;
    color:var(--primary);
  }
  .calendar-grid{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:6px;
    font-family:'Inter', sans-serif;
  }
  .calendar-day{
    min-width:130px;
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
  }
  .calendar-day-header{
    font-size:0.76rem;
    font-weight:700;
    color:var(--text);
    text-align:center;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--border-strong);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .calendar-empty{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    padding:10px 0;
  }
  .calendar-block{
    border:1px solid;
    border-radius:7px;
    padding:7px 8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .08s ease, filter .1s ease;
  }
  .calendar-block:hover{ transform:translateY(-2px); filter:brightness(0.97); }
  .calendar-block-time{ font-size:0.72rem; font-weight:700; opacity:0.85; }
  .calendar-block-group{ font-size:0.85rem; font-weight:700; margin-top:2px; }
  .calendar-block-note{ font-size:0.72rem; opacity:0.75; margin-top:2px; }

  /* Calendario mensual */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav h3{ margin:0; font-family:'Poppins', sans-serif; font-size:1rem; color:var(--text); text-transform:capitalize; }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    font-family:'Inter', sans-serif;
  }
  .month-grid-header{
    text-align:center;
    font-size:0.68rem;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .month-cell{
    min-height:64px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px;
    cursor:pointer;
    background:var(--card-bg);
    transition:background .12s ease;
    position:relative;
  }
  .month-cell:hover{ background:var(--primary-light); }
  .month-cell.other-month{ opacity:0.35; }
  .month-cell.is-today{ border-color:var(--primary); border-width:2px; }
  .month-cell.is-selected{ background:var(--primary-light); }
  .month-cell-num{ font-size:0.78rem; font-weight:700; color:var(--text); }
  .month-cell-dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
  .month-dot{ width:7px; height:7px; border-radius:50%; }
  .month-dot.pending{ background:transparent; border:1.5px solid currentColor; }
  .month-dot.done{ background:currentColor; border:1.5px solid currentColor; }
  .day-detail-list{ margin-top:6px; }
  .day-detail-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer;
    border:1px solid;
  }

  /* Modal de detalle de estudiante */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,42,61,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:16px;
  }
  .entrega-grade-link{
    background:none; border:1px dashed var(--primary-border); border-radius:8px;
    padding:2px 6px; cursor:pointer; font:inherit; font-weight:700; color:var(--primary);
  }
  .entrega-grade-link:hover{ background:var(--primary-light); border-style:solid; }
  .modal-box{
    background:var(--card-bg); border-radius:14px; padding:24px;
    max-width:420px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    font-family:'Inter', sans-serif;
  }
  .modal-close{
    float:right; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-dim);
  }
  .pie-chart{
    width:140px; height:140px; border-radius:50%; margin:14px auto;
  }
  .stat-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .stat-row:last-child{ border-bottom:none; }
  .qr-video-wrap{ position:relative; width:100%; max-width:420px; margin:12px auto 0; aspect-ratio:1/1; border-radius:var(--radius); overflow:hidden; background:var(--primary-light); border:1px solid var(--border); display:none; }
  .qr-video-wrap.active{ display:block; }
  .qr-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .qr-frame{ position:absolute; inset:18%; border:3px solid rgba(255,255,255,0.9); border-radius:14px; box-shadow:0 0 0 999px rgba(0,0,0,0.25); pointer-events:none; }
  .scan-student{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .scan-student-name{ font-family:'Poppins','Inter',sans-serif; font-size:1.3rem; font-weight:700; color:var(--text); line-height:1.2; }
  .scan-balance{ text-align:center; background:var(--success-light); border:1px solid var(--success-border); border-radius:var(--radius); padding:6px 14px; }
  .scan-balance-num{ font-family:'Poppins','Inter',sans-serif; font-size:1.6rem; font-weight:800; color:var(--success); line-height:1.1; }
  .scan-section-label{ font-weight:600; font-size:0.82rem; color:var(--text-dim); margin:14px 0 6px; }
  .scan-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .scan-big-btn{ min-width:72px; font-size:1.15rem; font-weight:800; padding:12px 16px; }
  .scan-disabled{ opacity:0.45; cursor:not-allowed; }
  .scan-flash{ margin-top:8px; font-weight:700; color:var(--success); min-height:1.2em; opacity:0; }
  .scan-flash.show{ animation: scanFlash 2.4s ease forwards; }
  .link-qr-box{ max-width:460px; text-align:center; }
  .link-qr-name{ font-family:'Poppins','Inter',sans-serif; font-weight:800; font-size:1.4rem; line-height:1.2; margin-top:6px; color:var(--text); }
  .link-qr-code{ position:relative; width:min(78vw, 360px); margin:14px auto 4px; background:#fff; padding:14px; border-radius:16px; border:1px solid var(--border); }
  .link-qr-code svg{ width:100%; height:auto; display:block; }
  .link-qr-code.hidden-qr{ cursor:pointer; }
  .link-qr-code.hidden-qr svg{ filter:blur(14px); opacity:0.35; }
  .link-qr-cover{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; color:#2B2A3D; font-size:1.05rem; gap:4px; }
  .link-qr-cover span{ font-weight:500; font-size:0.78rem; color:#666; }
  .input-invalid{ border-color:var(--danger) !important; background:var(--danger-light) !important; }
  .entrega-unit{ border:1px solid var(--border); border-radius:12px; margin:10px 0; overflow:hidden; }
  .entrega-unit > summary{ cursor:pointer; list-style:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:10px 12px; background:var(--primary-light); }
  .entrega-unit > summary::-webkit-details-marker{ display:none; }
  .entrega-unit > summary::after{ content:'▾'; margin-left:auto; color:var(--primary); font-weight:700; }
  .entrega-unit:not([open]) > summary::after{ content:'▸'; }
  .entrega-unit .eu-title{ font-weight:700; }
  .entrega-unit .eu-body{ padding:0 12px; }
  .mail-setup{ margin-top:10px; border:1px solid var(--border); border-radius:10px; padding:8px 12px; background:var(--primary-light); }
  .mail-setup summary{ cursor:pointer; font-weight:600; font-size:0.88rem; }
  .mail-setup ol{ margin:8px 0 0; padding-left:20px; font-size:0.85rem; line-height:1.45; }
  .card-img-slot{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  .card-img-slot:last-child{ border-bottom:none; }
  .card-img-thumb{ width:120px; height:78px; flex:none; border-radius:8px; border:1px solid var(--border-strong); background:var(--primary-light) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:var(--text-dim); }
  .kiosk-overlay{ position:fixed; inset:0; z-index:998; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .kiosk-inner{ max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  .kiosk-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .kiosk-title{ font-family:'Poppins','Inter',sans-serif; font-size:1.45rem; font-weight:800; color:var(--primary-dark); line-height:1.2; }
  .kiosk-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:12px; }
  .kiosk-idle{ text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
  .kiosk-name{ font-family:'Poppins','Inter',sans-serif; font-size:1.4rem; font-weight:800; color:var(--text); line-height:1.2; }
  .kiosk-big{ font-family:'Poppins','Inter',sans-serif; font-size:3.4rem; font-weight:800; color:var(--success); line-height:1.05; margin-top:10px; }
  .kiosk-chip{ display:inline-block; padding:6px 10px; border-radius:999px; background:var(--success-light); border:1px solid var(--success-border); font-size:0.85rem; font-weight:600; }
  .kiosk-mov{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .kiosk-mov:last-of-type{ border-bottom:none; }
  .kiosk-pos{ color:var(--success); white-space:nowrap; }
  .kiosk-neg{ color:var(--danger); white-space:nowrap; }
  .kiosk-video{ max-width:300px; }
  .kiosk-course-title{ font-family:'Poppins','Inter',sans-serif; font-weight:800; font-size:1.05rem; color:var(--primary-dark); text-align:center; margin-top:4px; }
  .kiosk-timer{ height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:12px; }
  .kiosk-timer > div{ height:100%; width:100%; background:var(--primary); animation-name:kioskTimer; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes kioskTimer{ from{ width:100%; } to{ width:0; } }
  @keyframes scanFlash{ 0%{opacity:0; transform:translateY(4px);} 10%{opacity:1; transform:none;} 75%{opacity:1;} 100%{opacity:0;} }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Registro de Clases</h1>
    <div class="subtitle">Asistencia, observaciones y cotejo por indicadores — funciona sin conexión</div>
    <div class="subtitle" id="driveHeaderStatus" style="font-weight:700; margin-top:2px;"></div>
  </div>
  <div id="icon-actions-wrap">
    <button class="btn btn-outline btn-sm" id="driveSettingsBtn" onclick="openDriveSettings()" title="Google Drive">☁️ Drive</button>
    <button class="btn btn-outline btn-sm" id="reminderSettingsBtn" onclick="openReminderSettings()" title="Recordatorio de clases">🔔</button>
    <button class="btn btn-outline btn-sm" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
    <button class="btn btn-outline btn-sm" onclick="openThemeColorPicker()" title="Cambiar color del tema">🎨</button>
  </div>
</header>

<div id="selector-bar">
  <details id="periodoDetails" class="selector-group">
    <summary class="selector-label" style="cursor:pointer;">⚙️ Más opciones (Periodo) ▾</summary>
    <div class="selector-group" style="margin-top:8px;">
      <select id="periodSelect" onchange="changePeriod(this.value)" title="Periodo lectivo"></select>
      <button class="btn btn-accent btn-sm" onclick="createPeriod()" title="Crear nuevo periodo">+</button>
      <button class="btn btn-outline btn-sm" onclick="editPeriod()" title="Editar periodo actual">✎</button>
      <button class="btn btn-danger btn-sm" onclick="deletePeriod()" title="Eliminar periodo actual">🗑</button>
    </div>
  </details>
  <div class="selector-group">
    <span class="selector-label">Curso</span>
    <select id="groupSelect"></select>
    <button class="btn btn-accent btn-sm" id="newGroupBtn">+ Curso</button>
  </div>
</div>

<nav class="tabs app-font" id="modulesNav">
  <button data-module="inicio" class="active">🏠 Inicio</button>
  <button data-module="horario">📅 Horario</button>
  <button data-module="cursos">👥 Cursos</button>
  <button data-module="trabajo">📝 Trabajo en clases</button>
  <button data-module="calificaciones">🎯 Calificaciones</button>
  <button data-module="puntos">⭐ Puntos</button>
  <button data-module="tarjetas">🪪 Tarjetas y portal</button>
  <button data-module="bitacora">📓 Bitácora</button>
</nav>
<nav class="tabs subtabs app-font" id="subTabsNav" style="display:none;"></nav>

<main id="main"></main>

<div class="toast app-font" id="toast"><span id="toastText"></span><button class="toast-close-btn" id="toastCloseBtn" onclick="hideToast()">✕</button></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
/* ============ ESTADO Y PERSISTENCIA (100% local, sin conexión) ============ */
const STORAGE_KEY = 'registroClasesApp_v1';

function getStorageKeyForEmail(email){
  return email ? `${STORAGE_KEY}::${email}` : STORAGE_KEY;
}
let currentStorageKey = getStorageKeyForEmail(localStorage.getItem('gdrive_email'));

function loadState(){
  try{
    const raw = localStorage.getItem(currentStorageKey);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Error leyendo almacenamiento', e); }
  return { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
}

let state = loadState();

function saveState(){
  try{ recomputeEntregaLinkedGrades(); }catch(e){ console.error('Error recalculando notas por entregas', e); }
  state.updatedAt = Date.now();
  try{
    localStorage.setItem(currentStorageKey, JSON.stringify(state));
  }catch(e){
    console.error('Error guardando', e);
    showToast('No se pudo guardar (almacenamiento lleno o bloqueado por el navegador)');
  }
  pushToDrive();
}

// Separa el almacenamiento local cuando se detecta una cuenta de Google distinta a la última usada en este dispositivo
function switchAccountStorage(oldEmail, newEmail){
  if(!oldEmail){
    // Primera vez que se conecta una cuenta: los datos actuales pasan a pertenecer a esta cuenta (no se pierde nada)
    currentStorageKey = getStorageKeyForEmail(newEmail);
    try{ localStorage.setItem(currentStorageKey, JSON.stringify(state)); }catch(e){}
    return;
  }
  // Cambio real de cuenta: se guarda lo de la cuenta anterior tal cual, y se aíslan los datos de la nueva
  const oldKey = getStorageKeyForEmail(oldEmail);
  try{ localStorage.setItem(oldKey, JSON.stringify(state)); }catch(e){}

  const newKey = getStorageKeyForEmail(newEmail);
  let newState;
  try{
    const raw = localStorage.getItem(newKey);
    newState = raw ? JSON.parse(raw) : { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
  }catch(e){
    newState = { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
  }
  currentStorageKey = newKey;
  state = newState;
  ensureDefaultGroup();
}

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ============ SINCRONIZACIÓN CON GOOGLE DRIVE ============ */
const DRIVE_FILE_NAME = 'registro-clases-data.json';
let driveFileId = null;
let driveTokenClient = null;

const DEFAULT_CLIENT_ID = '305499160088-dk14k2puhdaso68o8hv7500kkct5savn.apps.googleusercontent.com';
function loadDriveClientId(){ return localStorage.getItem('gdrive_client_id') || DEFAULT_CLIENT_ID; }
function saveDriveClientId(id){ localStorage.setItem('gdrive_client_id', id); }

function loadStoredDriveToken(){
  try{
    const raw = localStorage.getItem('gdrive_token');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function storeDriveToken(tok){ localStorage.setItem('gdrive_token', JSON.stringify(tok)); }
function clearDriveToken(){ localStorage.removeItem('gdrive_token'); }
function isDriveTokenValid(tok){ return !!(tok && tok.access_token && tok.expires_at && Date.now() < tok.expires_at - 60000); }

let driveLastKnownConnected = null;

function setDriveStatus(status){
  const map = {
    connected: '☁️ Conectado',
    syncing: '☁️ Sincronizando…',
    error: '⚠️ Error de sincronización',
    disconnected: 'No conectado'
  };
  const text = map[status] || map.disconnected;
  const modalEl = document.getElementById('driveStatusText');
  if(modalEl) modalEl.textContent = text;
  updateDriveHeaderBadge();
}

function updateDriveHeaderBadge(){
  const badge = document.getElementById('driveHeaderStatus');
  if(!badge) return;
  const stored = loadStoredDriveToken();
  const connected = isDriveTokenValid(stored);
  const email = localStorage.getItem('gdrive_email');
  if(connected){
    badge.textContent = email ? `☁️ ${email}` : '☁️ Conectado';
    badge.style.color = 'var(--success)';
  } else {
    badge.textContent = '⚠️ Drive desconectado';
    badge.style.color = 'var(--danger)';
  }
  if(driveLastKnownConnected === true && connected === false){
    showToastQuick('⚠️ Se cerró tu sesión de Google Drive. Tus cambios NO se están respaldando hasta que vuelvas a conectar.');
  }
  driveLastKnownConnected = connected;
}

async function fetchConnectedEmail(){
  try{
    const stored = loadStoredDriveToken();
    if(!isDriveTokenValid(stored)) return;
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${stored.access_token}` }
    });
    if(!res.ok) return;
    const data = await res.json();
    if(!data.email) return;
    const previousEmail = localStorage.getItem('gdrive_email');
    if(data.email !== previousEmail){
      const isRealSwitch = !!previousEmail;
      switchAccountStorage(previousEmail, data.email);
      localStorage.setItem('gdrive_email', data.email);
      driveFileId = null; // el archivo de Drive de la cuenta anterior ya no aplica
      renderAll();
      if(isRealSwitch){
        showToast('Cuenta de Google distinta detectada (' + data.email + ') — se separaron los datos de cada cuenta.');
      }
    }
    updateDriveHeaderBadge();
  }catch(e){ /* no crítico */ }
}

function connectDrive(){
  const clientId = loadDriveClientId();
  if(!clientId){ showToast('Primero ingresa y guarda tu Client ID de Google'); return; }
  if(typeof google === 'undefined' || !google.accounts){
    showToast('No se pudo cargar Google (revisa tu conexión o que el archivo esté alojado en https)');
    return;
  }
  const stored = loadStoredDriveToken();
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp)=>{
      if(resp.error){
        showToastQuick('No se pudo conectar con Google Drive');
        setDriveStatus('error');
        return;
      }
      const tok = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000) };
      storeDriveToken(tok);
      setDriveStatus('connected');
      showToastQuick('Conectado a Google Drive');
      await fetchConnectedEmail();
      syncFromDrive();
    }
  });
  driveTokenClient.requestAccessToken({ prompt: stored ? '' : 'consent' });
}

function disconnectDrive(){
  clearDriveToken();
  driveFileId = null;
  // Mantenemos gdrive_email para no perder de vista de quién son los datos guardados en este dispositivo
  setDriveStatus('disconnected');
  showToastQuick('Se desconectó Google Drive (tus datos siguen guardados en este navegador)');
}

async function driveFetch(url, options={}){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) throw new Error('token-expired');
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), Authorization: `Bearer ${stored.access_token}` }
  });
  if(res.status === 401) throw new Error('token-expired');
  if(!res.ok) throw new Error('drive-error-' + res.status);
  return res;
}

async function findDriveFile(){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id)`);
  const data = await res.json();
  return (data.files && data.files.length > 0) ? data.files[0] : null;
}

async function downloadDriveFile(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return JSON.parse(await res.text());
}

async function uploadDriveFile(fileId, data){
  const body = typeof data === 'string' ? data : JSON.stringify(data);
  if(fileId){
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body
    });
    return fileId;
  }
  const metadata = { name: DRIVE_FILE_NAME, parents:['appDataFolder'] };
  const boundary = 'registroClasesBoundary';
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
    method:'POST',
    headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
    body: multipartBody
  });
  const created = await res.json();
  return created.id;
}

// Recuerda, por cuenta conectada, la última versión remota que este dispositivo efectivamente vio.
// Esto permite detectar "¿cambió el remoto desde la última vez que lo miré?" en vez de comparar
// solo por hora de reloj (lo cual falla si dos dispositivos editan sin haberse visto entre sí).
function getSyncTimestampKey(){
  return currentStorageKey + '::synced_ts';
}
function loadLastSyncedRemoteTimestamp(){
  return Number(localStorage.getItem(getSyncTimestampKey())) || 0;
}
function saveLastSyncedRemoteTimestamp(ts){
  localStorage.setItem(getSyncTimestampKey(), String(ts || 0));
}

/* ---- Cola de sincronización ----
   Todas las operaciones con Drive (subir y revisar cambios) se ejecutan UNA A LA VEZ, en orden.
   Antes, si hacías dos ediciones seguidas, la segunda subida arrancaba mientras la primera aún
   estaba en curso, veía en Drive la versión de la primera edición, la confundía con "cambios de
   otro dispositivo" y cargaba esa versión encima, borrando tu segunda edición. */
let driveQueue = Promise.resolve();
let drivePushTimer = null;
let drivePushPending = false;
function enqueueDriveTask(task){
  driveQueue = driveQueue.then(task).catch(e=> console.error('Error en cola de Drive', e));
  return driveQueue;
}
// ¿Hay cambios locales que todavía no llegaron a Drive?
function hasUnsyncedLocalChanges(){
  return (state.updatedAt || 0) !== loadLastSyncedRemoteTimestamp();
}
function adoptRemoteState(remote){
  state = remote;
  if(!state.schedule) state.schedule = [];
  if(!state.periods) state.periods = [];
  ensureDefaultGroup();
  localStorage.setItem(currentStorageKey, JSON.stringify(state));
  saveLastSyncedRemoteTimestamp(remote.updatedAt || 0);
  renderAll();
}
// Sube una "foto" fija del estado (no el objeto vivo), y registra exactamente esa versión como sincronizada
async function uploadStateSnapshot(){
  const snapshotTs = state.updatedAt || Date.now();
  const snapshotBody = JSON.stringify(state);
  driveFileId = await uploadDriveFile(driveFileId, snapshotBody);
  saveLastSyncedRemoteTimestamp(snapshotTs);
}

async function syncFromDrive(){
  // Si hay una subida esperando o en curso, no revisamos ahora: primero debe terminar de subir lo tuyo
  if(drivePushTimer || drivePushPending) return;
  return enqueueDriveTask(doSyncFromDrive);
}
async function doSyncFromDrive(){
  try{
    setDriveStatus('syncing');
    const file = await findDriveFile();
    if(file){
      driveFileId = file.id;
      const remote = await downloadDriveFile(file.id);
      const remoteUpdated = remote.updatedAt || 0;
      const lastSynced = loadLastSyncedRemoteTimestamp();
      if(remoteUpdated !== lastSynced){
        if(hasUnsyncedLocalChanges() && lastSynced !== 0){
          // Conflicto real: otro dispositivo subió cambios y aquí también hay cambios sin subir.
          // Se guarda una copia de respaldo de lo local antes de cargar lo remoto.
          try{ localStorage.setItem(currentStorageKey + '::respaldo_conflicto', JSON.stringify({ savedAt: Date.now(), state })); }catch(e){}
          adoptRemoteState(remote);
          showToastQuick('⚠️ Otro dispositivo había subido cambios distintos. Se cargaron esos (tu versión local quedó respaldada en este equipo).');
        } else {
          adoptRemoteState(remote);
          if(lastSynced !== 0) showToastQuick('Datos actualizados desde Google Drive (otro dispositivo hizo cambios)');
        }
      } else if(hasUnsyncedLocalChanges()){
        await uploadStateSnapshot();
      }
    } else {
      driveFileId = null;
      await uploadStateSnapshot();
    }
    setDriveStatus('connected');
  }catch(e){
    console.error('Error de sincronización con Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

// Se llama en cada guardado: espera un momento (agrupa ediciones rápidas) y sube en orden
function pushToDrive(){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) return;
  setDriveStatus('syncing');
  if(drivePushTimer) clearTimeout(drivePushTimer);
  drivePushTimer = setTimeout(()=>{
    drivePushTimer = null;
    if(drivePushPending) return; // ya hay una subida en la cola: esa subirá la versión más reciente
    drivePushPending = true;
    enqueueDriveTask(async ()=>{
      drivePushPending = false;
      await doPushToDrive();
    });
  }, 700);
}
async function doPushToDrive(){
  if(!isDriveTokenValid(loadStoredDriveToken())) return;
  if(!hasUnsyncedLocalChanges()){ setDriveStatus('connected'); return; }
  try{
    setDriveStatus('syncing');
    if(!driveFileId){
      const file = await findDriveFile();
      if(file) driveFileId = file.id;
    }
    if(driveFileId){
      // Solo se considera "cambio de otro dispositivo" si lo que hay en Drive no es la última versión que ESTE equipo subió o vio
      const remote = await downloadDriveFile(driveFileId);
      const remoteUpdated = (remote && remote.updatedAt) || 0;
      const lastSynced = loadLastSyncedRemoteTimestamp();
      if(remote && remoteUpdated !== lastSynced){
        try{ localStorage.setItem(currentStorageKey + '::respaldo_conflicto', JSON.stringify({ savedAt: Date.now(), state })); }catch(e){}
        adoptRemoteState(remote);
        showToastQuick('⚠️ Otro dispositivo sincronizó cambios que aún no tenías. Se cargaron esos — revisa tus últimos cambios y vuelve a aplicarlos si hace falta (quedó un respaldo en este equipo).');
        setDriveStatus('connected');
        return;
      }
    }
    await uploadStateSnapshot();
    setDriveStatus(drivePushTimer || drivePushPending ? 'syncing' : 'connected');
  }catch(e){
    console.error('Error subiendo a Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

/* ============ MODAL: CONFIGURACIÓN DE GOOGLE DRIVE ============ */
function openDriveSettings(){
  const clientId = loadDriveClientId();
  const stored = loadStoredDriveToken();
  const connected = isDriveTokenValid(stored);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'driveModalOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font">
      <button class="modal-close" onclick="closeDriveSettings()">✕</button>
      <h2 style="border:none; padding-bottom:0;">☁️ Google Drive</h2>

  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeDriveSettings(); });

function backupFileNamePrefix(){
  const email = localStorage.getItem('gdrive_email');
  const account = email ? email.split('@')[0].replace(/[^a-zA-Z0-9_\-]/g,'') : 'sin_cuenta';
  const now = new Date();
  const date = now.toISOString().slice(0,10);
  const time = String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  return `${account}_${date}_${time}`;
}

function exportFullBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${backupFileNamePrefix()}_respaldo_registro_clases.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Respaldo completo descargado');
}

function exportConflictBackup(){
  let b = null;
  try{ b = JSON.parse(localStorage.getItem(currentStorageKey + '::respaldo_conflicto') || 'null'); }catch(e){}
  if(!b){ showToast('No hay versión respaldada'); return; }
  const blob = new Blob([JSON.stringify(b.state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${backupFileNamePrefix()}_version_local_respaldada.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportSelectedGroupsBackup(){
  const checked = [...document.querySelectorAll('.backup-group-check:checked')].map(el=>el.value);
  if(checked.length === 0){ showToast('Selecciona al menos un curso'); return; }
  const selectedGroups = state.groups.filter(g=> checked.includes(g.id));

  const periodIds = new Set();
  selectedGroups.forEach(g=>{
    [...(g.sessions||[]), ...(g.evaluations||[]), ...(g.decimas||[]), ...(g.gradeGroups||[]), ...(g.processes||[]), ...(g.bitacora||[]), ...(g.entregas||[]), ...(g.canjes||[]), ...(g.puntos||[])]
      .forEach(item=>{ if(item.periodId) periodIds.add(item.periodId); });
  });
  const periods = (state.periods || []).filter(p=> periodIds.has(p.id));
  const schedule = (state.schedule || []).filter(e=> checked.includes(e.groupId));
  const data = { groups: selectedGroups, periods, schedule, activeGroupId: null, activePeriodId: null };

  const namesPart = selectedGroups.map(g=> g.name.trim().replace(/[^a-zA-Z0-9_\-]+/g,'_')).join('+');
  const filename = `${backupFileNamePrefix()}_${namesPart}.json`;

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Respaldo de ${selectedGroups.length} curso(s) descargado`);
}

function importFullBackup(file){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !Array.isArray(data.groups)){ showToast('Ese archivo no es un respaldo válido'); return; }
      if(!confirm('Esto reemplazará TODOS los datos actuales en este dispositivo por los del respaldo. ¿Continuar?')) return;
      state = data;
      if(!state.schedule) state.schedule = [];
      if(!state.periods) state.periods = [];
      if(state.activePeriodId === undefined) state.activePeriodId = null;
      ensureDefaultGroup();
      saveState();
      closeDriveSettings();
      renderAll();
      showToast('Respaldo restaurado correctamente');
    }catch(e){
      showToast('No se pudo leer el archivo de respaldo');
    }
  };
  reader.readAsText(file);
}

function mergeGroupData(localGroup, importedGroup, periodIdMap){
  const remapPeriodIdValue = (pid)=> (pid && periodIdMap.has(pid)) ? periodIdMap.get(pid) : pid;

  // Estudiantes: por nombre. Si ya existe, se reutiliza su id local (no se duplica).
  const studentIdMap = new Map();
  (importedGroup.students || []).forEach(s=>{
    const existing = localGroup.students.find(ls=> ls.name.trim().toLowerCase() === (s.name||'').trim().toLowerCase());
    if(existing){ studentIdMap.set(s.id, existing.id); }
    else {
      const newStudent = { ...s, id: uid() };
      localGroup.students.push(newStudent);
      studentIdMap.set(s.id, newStudent.id);
    }
  });

  // Indicadores: por nombre
  const indicatorIdMap = new Map();
  (importedGroup.indicators || []).forEach(ind=>{
    const existing = localGroup.indicators.find(li=> li.name.trim().toLowerCase() === (ind.name||'').trim().toLowerCase());
    if(existing){ indicatorIdMap.set(ind.id, existing.id); }
    else {
      const newInd = { ...ind, id: uid() };
      localGroup.indicators.push(newInd);
      indicatorIdMap.set(ind.id, newInd.id);
    }
  });

  // Procesos: por nombre
  const processIdMap = new Map();
  (importedGroup.processes || []).forEach(p=>{
    const existing = localGroup.processes.find(lp=> lp.name.trim().toLowerCase() === (p.name||'').trim().toLowerCase());
    if(existing){ processIdMap.set(p.id, existing.id); }
    else {
      const newP = { ...p, id: uid(), periodId: remapPeriodIdValue(p.periodId) };
      localGroup.processes.push(newP);
      processIdMap.set(p.id, newP.id);
    }
  });

  // Grupos de notas: por nombre
  const gradeGroupIdMap = new Map();
  (importedGroup.gradeGroups || []).forEach(gg=>{
    const existing = localGroup.gradeGroups.find(lgg=> lgg.name.trim().toLowerCase() === (gg.name||'').trim().toLowerCase());
    if(existing){ gradeGroupIdMap.set(gg.id, existing.id); }
    else {
      const newGG = { ...gg, id: uid(), periodId: remapPeriodIdValue(gg.periodId) };
      localGroup.gradeGroups.push(newGG);
      gradeGroupIdMap.set(gg.id, newGG.id);
    }
  });

  const remapCotejo = (cotejo)=>{
    const out = {};
    Object.keys(cotejo || {}).forEach(oldId=>{ out[indicatorIdMap.get(oldId) || oldId] = cotejo[oldId]; });
    return out;
  };
  const remapSnapshot = (snap)=> (snap || []).map(item=> ({ ...item, id: indicatorIdMap.get(item.id) || item.id }));

  // Sesiones (Historial): por fecha+hora exacta. Si ya existe una clase en esa fecha/hora, no se toca.
  let sessionsAdded = 0;
  (importedGroup.sessions || []).forEach(s=>{
    const dup = localGroup.sessions.some(ls=> ls.date===s.date && ls.time===s.time);
    if(dup) return;
    localGroup.sessions.push({
      ...s, id: uid(),
      periodId: remapPeriodIdValue(s.periodId),
      processId: s.processId ? (processIdMap.get(s.processId) || null) : null,
      indicatorSnapshot: remapSnapshot(s.indicatorSnapshot),
      entries: (s.entries || []).map(e=> ({ ...e, studentId: studentIdMap.get(e.studentId) || e.studentId, cotejo: remapCotejo(e.cotejo) }))
    });
    sessionsAdded++;
  });

  // Evaluaciones: por nombre. Si ya existe, solo se completan puntajes de estudiantes que no tenían nota (sin sobrescribir).
  let evalsAdded = 0, evalsFilled = 0;
  (importedGroup.evaluations || []).forEach(ev=>{
    const existing = localGroup.evaluations.find(le=> le.name.trim().toLowerCase() === (ev.name||'').trim().toLowerCase());
    if(existing){
      if(!existing.scores) existing.scores = {};
      Object.keys(ev.scores || {}).forEach(oldSid=>{
        const newSid = studentIdMap.get(oldSid) || oldSid;
        if(existing.scores[newSid] === undefined || existing.scores[newSid] === null){
          existing.scores[newSid] = ev.scores[oldSid];
          evalsFilled++;
        }
      });
    } else {
      const newScores = {}, newOverrides = {};
      Object.keys(ev.scores || {}).forEach(oldSid=>{ newScores[studentIdMap.get(oldSid) || oldSid] = ev.scores[oldSid]; });
      Object.keys(ev.overrides || {}).forEach(oldSid=>{ newOverrides[studentIdMap.get(oldSid) || oldSid] = ev.overrides[oldSid]; });
      localGroup.evaluations.push({
        ...ev, id: uid(),
        periodId: remapPeriodIdValue(ev.periodId),
        gradeGroupId: ev.gradeGroupId ? (gradeGroupIdMap.get(ev.gradeGroupId) || null) : null,
        processId: ev.processId ? (processIdMap.get(ev.processId) || null) : null,
        entregaLink: ev.entregaLink ? {
          ...ev.entregaLink,
          periodId: ev.entregaLink.periodId ? remapPeriodIdValue(ev.entregaLink.periodId) : null,
          processId: ev.entregaLink.processId ? (processIdMap.get(ev.entregaLink.processId) || null) : null
        } : undefined,
        scores: newScores, overrides: newOverrides
      });
      evalsAdded++;
    }
  });

  // Décimas: por fecha+motivo. Si ya existe, se completan valores de estudiantes que no tenían (sin sobrescribir).
  let decimasAdded = 0;
  (importedGroup.decimas || []).forEach(d=>{
    const existing = localGroup.decimas.find(ld=> ld.date===d.date && (ld.note||'')===(d.note||''));
    if(existing){
      if(!existing.values) existing.values = {};
      Object.keys(d.values || {}).forEach(oldSid=>{
        const newSid = studentIdMap.get(oldSid) || oldSid;
        if(existing.values[newSid] === undefined || existing.values[newSid] === null) existing.values[newSid] = d.values[oldSid];
      });
    } else {
      const newValues = {};
      Object.keys(d.values || {}).forEach(oldSid=>{ newValues[studentIdMap.get(oldSid) || oldSid] = d.values[oldSid]; });
      localGroup.decimas.push({ ...d, id: uid(), periodId: remapPeriodIdValue(d.periodId), values: newValues });
      decimasAdded++;
    }
  });

  // Entregas: por nombre+fecha. Si ya existe, se completan estados de estudiantes que no tenían (sin sobrescribir).
  let entregasAdded = 0;
  (importedGroup.entregas || []).forEach(ent=>{
    const existing = localGroup.entregas.find(le=> le.name.trim().toLowerCase() === (ent.name||'').trim().toLowerCase() && le.date === ent.date);
    if(existing){
      if(!existing.estados) existing.estados = {};
      Object.keys(ent.estados || {}).forEach(oldSid=>{
        const newSid = studentIdMap.get(oldSid) || oldSid;
        if(!existing.estados[newSid]) existing.estados[newSid] = ent.estados[oldSid];
      });
    } else {
      const newEstados = {};
      Object.keys(ent.estados || {}).forEach(oldSid=>{ newEstados[studentIdMap.get(oldSid) || oldSid] = ent.estados[oldSid]; });
      localGroup.entregas.push({
        ...ent, id: uid(),
        periodId: remapPeriodIdValue(ent.periodId),
        processId: ent.processId ? (processIdMap.get(ent.processId) || null) : null,
        estados: newEstados
      });
      entregasAdded++;
    }
  });

  // Bitácora: son eventos discretos difíciles de deduplicar con certeza — se agregan todos como registros nuevos.
  (importedGroup.bitacora || []).forEach(b=>{
    localGroup.bitacora.push({
      ...b, id: uid(),
      periodId: remapPeriodIdValue(b.periodId),
      studentIds: (b.studentIds || []).map(oldSid=> studentIdMap.get(oldSid) || oldSid)
    });
  });

  // Canjes de premios: por estudiante+fecha+hora+premio (sin duplicar)
  if(!localGroup.canjes) localGroup.canjes = [];
  (importedGroup.canjes || []).forEach(c=>{
    const sid = studentIdMap.get(c.studentId) || c.studentId;
    const dup = localGroup.canjes.some(lc=> lc.studentId===sid && lc.date===c.date && (lc.time||'')===(c.time||'') && lc.name===c.name);
    if(dup) return;
    localGroup.canjes.push({ ...c, id: uid(), studentId: sid, periodId: remapPeriodIdValue(c.periodId), decimaSessionId: null });
  });

  // Puntos: por fecha+motivo. Si ya existe, se completan valores de estudiantes que no tenían (sin sobrescribir).
  if(!localGroup.puntos) localGroup.puntos = [];
  (importedGroup.puntos || []).forEach(d=>{
    const existing = localGroup.puntos.find(ld=> ld.date===d.date && (ld.note||'')===(d.note||''));
    if(existing){
      if(!existing.values) existing.values = {};
      Object.keys(d.values || {}).forEach(oldSid=>{
        const newSid = studentIdMap.get(oldSid) || oldSid;
        if(existing.values[newSid] === undefined || existing.values[newSid] === null) existing.values[newSid] = d.values[oldSid];
      });
    } else {
      const newValues = {};
      Object.keys(d.values || {}).forEach(oldSid=>{ newValues[studentIdMap.get(oldSid) || oldSid] = d.values[oldSid]; });
      localGroup.puntos.push({ ...d, id: uid(), periodId: remapPeriodIdValue(d.periodId), values: newValues });
    }
  });

  return { sessionsAdded, evalsAdded, evalsFilled, decimasAdded, entregasAdded, studentIdMap };
}

function importAdditionalData(file){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !Array.isArray(data.groups)){ showToast('Ese archivo no es un respaldo válido'); return; }
      if(!state.periods) state.periods = [];
      if(!state.schedule) state.schedule = [];

      // 1) Emparejar/crear periodos: por nombre, sin duplicar
      const periodIdMap = new Map();
      (data.periods || []).forEach(p=>{
        const existing = state.periods.find(lp=> lp.name.trim().toLowerCase() === (p.name||'').trim().toLowerCase());
        if(existing){
          periodIdMap.set(p.id, existing.id);
        } else {
          const newPeriod = { ...p, id: uid() };
          state.periods.push(newPeriod);
          periodIdMap.set(p.id, newPeriod.id);
        }
      });
      const remapPeriodId = (item)=>{
        if(item.periodId && periodIdMap.has(item.periodId)) item.periodId = periodIdMap.get(item.periodId);
      };

      // 2) Cursos: los que YA EXISTEN (por nombre) se fusionan por dentro; los que no existen se agregan completos
      let added = 0, merged = 0;
      let sessionsAdded = 0, evalsAdded = 0, evalsFilled = 0, decimasAdded = 0, entregasAdded = 0;
      const groupIdMap = new Map(); // solo para cursos recién agregados (para remapear su horario)
      const mergedGroupIdMap = new Map(); // groupId importado -> groupId local existente (para remapear su horario)
      data.groups.forEach(g=>{
        const localMatch = state.groups.find(lg=> lg.name.trim().toLowerCase() === (g.name||'').trim().toLowerCase());
        if(localMatch){
          const result = mergeGroupData(localMatch, g, periodIdMap);
          mergedGroupIdMap.set(g.id, localMatch.id);
          sessionsAdded += result.sessionsAdded;
          evalsAdded += result.evalsAdded;
          evalsFilled += result.evalsFilled;
          decimasAdded += result.decimasAdded;
          entregasAdded += result.entregasAdded;
          merged++;
          return;
        }
        const newGroup = JSON.parse(JSON.stringify(g));
        const oldGroupId = newGroup.id;
        newGroup.id = uid();
        groupIdMap.set(oldGroupId, newGroup.id);
        if(!newGroup.students) newGroup.students = [];
        if(!newGroup.indicators) newGroup.indicators = [];
        if(!newGroup.sessions) newGroup.sessions = [];
        if(!newGroup.evaluations) newGroup.evaluations = [];
        if(!newGroup.decimas) newGroup.decimas = [];
        if(!newGroup.gradeGroups) newGroup.gradeGroups = [];
        if(!newGroup.processes) newGroup.processes = [];
        if(!newGroup.bitacora) newGroup.bitacora = [];
        if(!newGroup.entregas) newGroup.entregas = [];
        if(!newGroup.canjes) newGroup.canjes = [];
        if(!newGroup.puntos) newGroup.puntos = [];
        [newGroup.sessions, newGroup.evaluations, newGroup.decimas, newGroup.gradeGroups, newGroup.processes, newGroup.bitacora, newGroup.entregas, newGroup.canjes, newGroup.puntos]
          .forEach(list=> list.forEach(remapPeriodId));
        state.groups.push(newGroup);
        added++;
      });

      // 3) Horario: se agregan las clases de cursos nuevos Y de cursos fusionados, evitando duplicados exactos
      let scheduleAdded = 0;
      (data.schedule || []).forEach(e=>{
        let newGroupId = null;
        if(groupIdMap.has(e.groupId)) newGroupId = groupIdMap.get(e.groupId);
        else if(mergedGroupIdMap.has(e.groupId)) newGroupId = mergedGroupIdMap.get(e.groupId);
        if(!newGroupId) return;
        const dup = state.schedule.some(le=> le.groupId===newGroupId && le.day===e.day && le.startTime===e.startTime);
        if(dup) return;
        state.schedule.push({ ...e, id: uid(), groupId: newGroupId });
        scheduleAdded++;
      });

      saveState();
      closeDriveSettings();
      renderAll();
      const parts = [];
      if(added > 0) parts.push(`${added} curso(s) nuevo(s)`);
      if(merged > 0) parts.push(`${merged} curso(s) existente(s) fusionado(s) (${sessionsAdded} clase(s), ${evalsAdded} evaluación(es) nueva(s) + ${evalsFilled} puntaje(s) completado(s), ${decimasAdded} décima(s), ${entregasAdded} entrega(s))`);
      if(scheduleAdded > 0) parts.push(`${scheduleAdded} clase(s) de horario`);
      showToast(parts.length ? 'Se agregó: ' + parts.join(' · ') : 'No había datos nuevos para agregar.');

    }catch(e){
      console.error('Error agregando datos', e);
      showToast('No se pudo leer ese archivo');
    }
  };
  reader.readAsText(file);
}

}

  saveDriveClientId(val);

function getActiveGroup(){
  return state.groups.find(g => g.id === state.activeGroupId) || null;
}

function isEntryPresent(entry){
  if(!entry) return false;
  if(entry.presente !== undefined && entry.presente !== null) return !!entry.presente;
  if(!entry.cotejo) return false;
  return Object.values(entry.cotejo).some(v => v !== null && v !== undefined);
}

function computeStudentStatsForSessions(group, studentId, sessions){
  let presentCount = 0, absentCount = 0, obtained = 0, maxPossible = 0;
  sessions.forEach(session=>{
    const entry = session.entries.find(e=> e.studentId === studentId);
    if(!entry) return;
    const inds = session.indicatorSnapshot || group.indicators;
    if(isEntryPresent(entry)){
      presentCount++;
      inds.forEach(ind=>{
        const v = entry.cotejo[ind.id];
        if(v !== null && v !== undefined){
          obtained += v;
          maxPossible += (ind.levels || 5);
        }
      });
    } else {
      absentCount++;
    }
  });
  const total = presentCount + absentCount;
  const percent = maxPossible > 0 ? Math.round((obtained / maxPossible) * 100) : null;
  return { presentCount, absentCount, total, obtained, maxPossible, percent };
}

/* ============ CALIFICACIONES: ESCALA CHILENA 1.0 - 7.0 (aprobación 4.0) ============ */
function computeChileGrade(scoreObtained, totalScore, exigenciaPercent){
  if(scoreObtained === null || scoreObtained === undefined || !totalScore || totalScore <= 0) return null;
  let exigencia = (exigenciaPercent || 60) / 100;
  if(exigencia <= 0.01) exigencia = 0.01;
  if(exigencia >= 0.99) exigencia = 0.99;
  let p = scoreObtained / totalScore;
  if(p < 0) p = 0;
  if(p > 1) p = 1;
  let nota;
  if(p <= exigencia){
    nota = 1 + 3 * (p / exigencia);
  } else {
    nota = 4 + 3 * (p - exigencia) / (1 - exigencia);
  }
  nota = Math.min(7, Math.max(1, nota));
  return Math.round(nota * 10) / 10;
}

// "Unidades de calificación": cada evaluación suelta cuenta como una unidad;
// las evaluaciones que pertenecen a un grupo de notas se promedian y forman UNA sola
// unidad ("nota sumativa"), que usa el tipo/ponderación del grupo (no de cada evaluación).
function getGradingUnits(group){
  const evals = getActiveEvaluations(group);
  const gradeGroups = getActiveGradeGroups(group);
  const units = [];
  evals.filter(e=> !e.gradeGroupId).forEach(e=>{
    units.push({ type:'eval', evals:[e], weightType: e.weightType, weightPercent: e.weightPercent });
  });
  gradeGroups.forEach(gg=>{
    const members = evals.filter(e=> e.gradeGroupId === gg.id);
    if(members.length > 0){
      units.push({ type:'group', gradeGroup: gg, evals: members, weightType: gg.weightType, weightPercent: gg.weightPercent });
    }
  });
  return units;
}

function computeUnitGrade(unit, studentId){
  const notas = unit.evals.map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  if(notas.length === 0) return null;
  return Math.round((notas.reduce((a,b)=>a+b,0)/notas.length) * 10) / 10;
}

function computeStudentEvalGrade(evaluation, studentId){
  const score = evaluation.scores ? evaluation.scores[studentId] : null;
  if(score === null || score === undefined) return null;
  const params = getEvalParamsForStudent(evaluation, studentId);
  let nota = computeChileGrade(score, params.totalScore, params.exigencia);
  const decimasAplicadas = evaluation.decimasAplicadas ? evaluation.decimasAplicadas[studentId] : null;
  if(decimasAplicadas){ nota = Math.min(7.0, Math.round((nota + decimasAplicadas / 10) * 10) / 10); }
  return nota;
}

function getEvalParamsForStudent(evaluation, studentId){
  const override = evaluation.overrides && evaluation.overrides[studentId];
  return {
    totalScore: (override && override.totalScore !== undefined && override.totalScore !== null) ? override.totalScore : evaluation.totalScore,
    exigencia: (override && override.exigencia !== undefined && override.exigencia !== null) ? override.exigencia : evaluation.exigencia,
  };
}

function computeStudentFinalGrade(group, studentId){
  const units = getGradingUnits(group);
  const weighted = units.filter(u=> u.weightType === 'weighted');
  const simple = units.filter(u=> u.weightType !== 'weighted');

  let weightedSum = 0, weightTotal = 0;
  weighted.forEach(u=>{
    const nota = computeUnitGrade(u, studentId);
    if(nota !== null){
      weightedSum += nota * ((u.weightPercent || 0) / 100);
      weightTotal += (u.weightPercent || 0) / 100;
    }
  });

  const simpleNotas = simple.map(u=> computeUnitGrade(u, studentId)).filter(n=> n !== null);
  const simpleAvg = simpleNotas.length ? simpleNotas.reduce((a,b)=>a+b,0)/simpleNotas.length : null;
  const remainingWeight = Math.max(0, 1 - weightTotal);

  let finalGrade = null;
  if(weightTotal > 0 && simpleAvg !== null && remainingWeight > 0){
    finalGrade = weightedSum + simpleAvg * remainingWeight;
  } else if(weightTotal > 0){
    finalGrade = weightTotal >= 1 ? weightedSum : (simpleAvg !== null ? weightedSum + simpleAvg * remainingWeight : weightedSum / weightTotal);
  } else if(simpleAvg !== null){
    finalGrade = simpleAvg;
  }
  if(finalGrade !== null) finalGrade = Math.round(Math.min(7, Math.max(1, finalGrade)) * 10) / 10;

  const allNotas = getActiveEvaluations(group).map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  const promedioSimple = allNotas.length ? Math.round((allNotas.reduce((a,b)=>a+b,0)/allNotas.length) * 10) / 10 : null;

  return { finalGrade, promedioSimple, count: allNotas.length };
}

function totalWeightAssigned(group){
  return getGradingUnits(group).filter(u=> u.weightType === 'weighted')

/* ---- Orden de las notas: 'creacion' (como se agregaron), 'fecha' o 'personalizado' ----
   Se guarda por curso. Afecta la lista, la tabla de resumen, la ficha del estudiante y las exportaciones. */
function getEvalSortMode(group){ return group.evalSortMode || 'creacion'; }
function sortEvaluations(group, list){
  const mode = getEvalSortMode(group);
  const creationIndex = new Map((group.evaluations || []).map((e,i)=> [e.id, i]));
  const byCreation = (a,b)=> creationIndex.get(a.id) - creationIndex.get(b.id);
  if(mode === 'fecha'){
    // Las que no tienen fecha van al final, en el orden en que se agregaron
    return list.slice().sort((a,b)=>{
      if(a.date && b.date && a.date !== b.date) return a.date.localeCompare(b.date);
      if(a.date && !b.date) return -1;
      if(!a.date && b.date) return 1;
      return byCreation(a,b);
    });
  }
  if(mode === 'personalizado'){
    const order = group.evalCustomOrder || [];
    const pos = new Map(order.map((id,i)=> [id, i]));
    // Las notas nuevas (que aún no tienen posición) quedan al final
    return list.slice().sort((a,b)=>{
      const pa = pos.has(a.id) ? pos.get(a.id) : Infinity;
      const pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
      if(pa !== pb) return pa - pb;
      return byCreation(a,b);
    });
  }
  return list.slice().sort(byCreation);
}
function changeEvalSortMode(mode){
  const group = getActiveGroup();
  if(mode === 'personalizado'){
    // Al entrar al modo personalizado se parte del orden que se está viendo ahora
    const current = getActiveEvaluations(group).map(e=> e.id);
    const others = (group.evalCustomOrder || []).filter(id=> !current.includes(id));
    group.evalSortMode = 'personalizado';
    group.evalCustomOrder = current.concat(others);
  } else {
    group.evalSortMode = mode;
  }
  saveState();
  renderCalificaciones(group);
}
function moveEvaluation(evalId, dir){
  const group = getActiveGroup();
  const visible = getActiveEvaluations(group).map(e=> e.id);
  const i = visible.indexOf(evalId);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= visible.length) return;
  [visible[i], visible[j]] = [visible[j], visible[i]];
  const others = (group.evalCustomOrder || []).filter(id=> !visible.includes(id));
  group.evalCustomOrder = visible.concat(others);
  group.evalSortMode = 'personalizado';
  saveState();
  renderCalificaciones(group);
}

const MODULE_TABS = {
  inicio: ['inicio'],
  horario: ['horario'],
  cursos: ['estudiantes'],
  trabajo: ['indicadores','registrar','entregas','historial','decimas'],
  puntos: ['escanear','premios','catalogo'],
  tarjetas: ['tarjetas','portal','consulta'],
  calificaciones: ['calificaciones'],
  bitacora: ['bitacora'],
};
const SUBTAB_LABELS = {
  indicadores: 'Indicadores',
  registrar: 'Registrar clase',
  historial: 'Historial',
  decimas: 'Décimas',
  escanear: '📷 Escanear',
  premios: '⭐ Saldos y canjes',
  catalogo: '🎁 Premios y motivos',
  tarjetas: '🪪 Tarjetas',
  portal: '🌐 Portal',
  consulta: '🔒 Modo consulta',
  entregas: 'Entregas',
  calificaciones: 'Calificaciones',
};
function moduleForTab(tab){
  for(const m in MODULE_TABS){ if(MODULE_TABS[m].includes(tab)) return m; }
  return 'inicio';
}
let currentModule = 'inicio';
let currentTab = 'inicio';

function renderNav(){
  document.querySelectorAll('#modulesNav button').forEach(b=> b.classList.toggle('active', b.dataset.module === currentModule));
  const subNav = document.getElementById('subTabsNav');
  const tabs = MODULE_TABS[currentModule] || [];
  if(tabs.length > 1){
    subNav.style.display = 'flex';
    subNav.innerHTML = tabs.map(t=> `<button data-tab="${t}" class="${t===currentTab?'active':''}">${SUBTAB_LABELS[t] || t}</button>`).join('');
  } else {
    subNav.style.display = 'none';
    subNav.innerHTML = '';
  }
}
function goToTab(tab){
  currentTab = tab;
  currentModule = moduleForTab(tab);
  if(tab === 'registrar'){ registrarIndicatorSelection = null; registrarAttendanceOnly = null; }
  renderNav();
  renderMain();
}
function goToModule(mod){
  currentModule = mod;
  currentTab = (MODULE_TABS[mod] || ['horario'])[0];
  if(currentTab === 'registrar'){ registrarIndicatorSelection = null; registrarAttendanceOnly = null; }
  renderNav();
  renderMain();
}
document.getElementById('modulesNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-module]');
  if(!btn) return;
  goToModule(btn.dataset.module);
});
document.getElementById('subTabsNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  goToTab(btn.dataset.tab);
});

function renderMain(){
  const main = document.getElementById('main');
  const group = getActiveGroup();
  if(!group){ main.innerHTML = '<div class="empty-state">Crea un grupo para comenzar.</div>'; return; }

  try{ recomputeEntregaLinkedGrades(); }catch(e){}
  if(currentTab !== 'escanear' && !kioskActive){ qrScanner.wanted = false; stopQrScanner(); }
  if(currentTab === 'inicio') return renderInicio();
  if(currentTab === 'estudiantes') return renderEstudiantes(group);
  if(currentTab === 'indicadores') return renderIndicadores(group);
  if(currentTab === 'horario') return renderHorario();
  if(currentTab === 'registrar') return renderRegistrar(group);
  if(currentTab === 'historial') return renderHistorial(group);
  if(currentTab === 'decimas') return renderDecimas(group);
  if(currentTab === 'escanear') return renderEscanear(group);
  if(PUNTOS_TABS.includes(currentTab)) return renderPremios(group);
  if(currentTab === 'entregas') return renderEntregas(group);
  if(currentTab === 'calificaciones') return renderCalificaciones(group);
  if(currentTab === 'bitacora') return renderBitacora(group);
}

function importStudentsFromText(group, text){
  if(!text || !text.trim()){ showToast('No hay texto para importar'); return; }
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let count = 0, emails = 0;
  lines.forEach(line=>{
    const cells = line.split(/[,;\t]/).map(c=> c.replace(/^"|"$/g,'').trim());
    const email = cells.find(c=> isValidEmail(c)) || '';
    const name = cells.find(c=> c && !isValidEmail(c)) || '';
    if(!name) return;
    const existing = group.students.find(s=> normalizePersonName(s.name) === normalizePersonName(name));
    if(!existing){
      const st = {id: uid(), name};
      if(email){ st.email = email; emails++; }
      group.students.push(st);
      count++;
    } else if(email && existing.email !== email){
      existing.email = email; emails++;
    }
  });
  saveState();
  renderEstudiantes(group);
  showToast(count + ' estudiante(s) importado(s)' + (emails ? ` · ${emails} correo(s) guardado(s)` : ''));
}

const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let calendarMonthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedCalendarDate = toISODate(new Date());

function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function jsWeekdayToOurDay(jsDay){ return jsDay === 0 ? 7 : jsDay; }
function buildMonthCells(cursor){
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const firstWeekday = jsWeekdayToOurDay(firstOfMonth.getDay());
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=1; i<firstWeekday; i++){
    cells.push({ date: new Date(year, month, 1 - (firstWeekday - i)), otherMonth: true });
  }
  for(let day=1; day<=daysInMonth; day++){
    cells.push({ date: new Date(year, month, day), otherMonth: false });
  }
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1].date;
    const next = new Date(last);
    next.setDate(next.getDate()+1);
    cells.push({ date: next, otherMonth: true });
  }
  return cells;
}
function changeCalendarMonth(delta){
  calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth()+delta, 1);
  renderHorario();
}

    renderRegistrar(group, existingSession);
  } else {
    renderRegistrar(group, null, { date: iso, time: entry.startTime });
  }
}

function findCurrentOrNextClass(){
  const now = new Date();
  const todayWeekday = jsWeekdayToOurDay(now.getDay());
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const todayEntries = state.schedule.filter(e=> e.day === todayWeekday);

  const toMinutes = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };

  const current = todayEntries.find(e=>{
    const startMin = toMinutes(e.startTime);
    const endMin = e.endTime ? toMinutes(e.endTime) : startMin + 60;
    return nowMinutes >= startMin && nowMinutes < endMin;
  });
  if(current) return { entry: current, status: 'now' };

  const upcoming = todayEntries.filter(e=> toMinutes(e.startTime) > nowMinutes)
    .sort((a,b)=> a.startTime.localeCompare(b.startTime));
  if(upcoming[0]) return { entry: upcoming[0], status: 'next' };

  return null;
}

function buildWeekSummary(){
  const days = [];
  const today = new Date();
  for(let i=0; i<7; i++){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const iso = toISODate(d);
    const weekday = jsWeekdayToOurDay(d.getDay());
    const classesThatDay = state.schedule
      .filter(e=> e.day === weekday)
      .sort((a,b)=> a.startTime.localeCompare(b.startTime));
    const entregasThatDay = [];
    const evaluationsThatDay = [];
    state.groups.forEach(g=>{
      getActiveEntregas(g).forEach(en=>{
        const dl = getEntregaDeadline(en);
        if(en.date === iso || (dl && dl.fecha === iso)){
          entregasThatDay.push({ entrega: en, group: g });
        }
      });
      getActiveEvaluations(g).forEach(ev=>{
        if(ev.date === iso){
          evaluationsThatDay.push({ evaluation: ev, group: g });
        }
      });
    });
    days.push({ date: d, iso, classesThatDay, entregasThatDay, evaluationsThatDay });
  }
  return days;
}

function computeDateForWeekday(day){
  // day: 1=Lunes ... 7=Domingo. Devuelve la fecha (YYYY-MM-DD) de ese día en la semana actual.
  const today = new Date();
  const jsDay = today.getDay(); // 0=Domingo ... 6=Sábado
  const todayIso = jsDay === 0 ? 7 : jsDay; // convertir a 1=Lunes ... 7=Domingo
  const diff = day - todayIso;
  const target = new Date(today);
  target.setDate(today.getDate() + diff);
  return target.toISOString().slice(0,10);
}

function goToClass(entryId){
  const entry = state.schedule.find(e=>e.id===entryId);
  if(!entry) return;
  const group = state.groups.find(g=>g.id===entry.groupId);
  if(!group){ showToast('El grupo de esta clase ya no existe'); return; }
  state.activeGroupId = group.id;
  saveState();
  renderGroupSelect();
  currentTab = 'registrar';
  currentModule = moduleForTab('registrar');
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  renderNav();
  const targetDate = computeDateForWeekday(entry.day);
  const existingSession = getActiveSessions(group).find(s=> s.date === targetDate && s.time === entry.startTime);
  if(existingSession){
    renderRegistrar(group, existingSession);
  } else {
    renderRegistrar(group, null, { date: targetDate, time: entry.startTime });
  }
}

let registrarIndicatorSelection = null;
let registrarAttendanceOnly = null;
let registrarCurrentSessionToEdit = null;
let registrarCurrentPrefill = null;
let registrarThemeFilter = '';

function toggleRegistrarIndicator(id, checked){
  if(checked){
    if(!registrarIndicatorSelection.includes(id)) registrarIndicatorSelection.push(id);
  } else {
    registrarIndicatorSelection = registrarIndicatorSelection.filter(i=>i!==id);
  }
  renderRegistrar(getActiveGroup(), registrarCurrentSessionToEdit, registrarCurrentPrefill);
}
function toggleAllIndicators(group, selectAll){
  const visible = registrarThemeFilter ? group.indicators.filter(i=> i.tema === registrarThemeFilter) : group.indicators;
  const visibleIds = visible.map(i=>i.id);
  if(selectAll){
    visibleIds.forEach(id=>{ if(!registrarIndicatorSelection.includes(id)) registrarIndicatorSelection.push(id); });
  } else {
    registrarIndicatorSelection = registrarIndicatorSelection.filter(id=> !visibleIds.includes(id));
  }
  renderRegistrar(group, registrarCurrentSessionToEdit, registrarCurrentPrefill);
}
function changeRegistrarThemeFilter(tema){
  registrarThemeFilter = tema || '';
  renderRegistrar(getActiveGroup(), registrarCurrentSessionToEdit, registrarCurrentPrefill);
}

function saveQuickIndicatorForm(){
  const group = getActiveGroup();
  const name = document.getElementById('quickIndName').value.trim();
  const tema = readTemaSelectValue('quickIndTemaSelect', 'quickIndTemaNew');
  let levels = parseInt(document.getElementById('quickIndLevels').value, 10);
  if(!name){ showToast('Ingresa un nombre para el indicador'); return; }
  if(!levels || levels < 2) levels = 2;
  if(levels > 10) levels = 10;
  const newIndicator = { id: uid(), name, levels, tema };
  group.indicators.push(newIndicator);
  if(registrarIndicatorSelection === null) registrarIndicatorSelection = [];
  registrarIndicatorSelection.push(newIndicator.id);

  renderRegistrar(group, registrarCurrentSessionToEdit, registrarCurrentPrefill);

function renderRegistrar(group, sessionToEdit, prefill){

  registrarCurrentPrefill = prefill || null;

  if(group.students.length === 0){
    main.innerHTML = groupHeaderCard(group) + '<div class="card app-font"><div class="empty-state">Agrega estudiantes en la pestaña "Cursos" antes de registrar una clase.</div></div>';
    return;

  // Inicializar modo de asistencia solamente (sin indicadores)
  if(registrarAttendanceOnly === null){
    registrarAttendanceOnly = isEdit ? (!sessionToEdit.indicatorSnapshot || sessionToEdit.indicatorSnapshot.length === 0) : false;
  }

  // Inicializar selección de indicadores para esta clase (banco de indicadores)
  if(registrarIndicatorSelection === null){
    if(isEdit && sessionToEdit.indicatorSnapshot){
      registrarIndicatorSelection = sessionToEdit.indicatorSnapshot.map(i=>i.id);
    } else if(group.lastUsedIndicatorIds && group.lastUsedIndicatorIds.length){
      registrarIndicatorSelection = group.lastUsedIndicatorIds.filter(id=> group.indicators.some(i=>i.id===id));

      </div>
    </div>

    ${saveButtonsRow}

      <h2>Datos de la clase</h2>

      </label>
    </div>

    ${registrarAttendanceOnly ? '' : `
    <div class="card app-font">
      <div class="flex-between">
        <h2 style="border:none; margin-bottom:0; padding-bottom:0;">Indicadores de esta clase</h2>
