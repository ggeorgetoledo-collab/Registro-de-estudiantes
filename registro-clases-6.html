<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Clases</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C4EE3">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --primary:#6C4EE3;
    --primary-dark:#5638C4;
    --primary-light:#F1ECFC;
    --primary-border:rgba(108,78,227,0.3);
    --bg:#F6F5FB;
    --card-bg:#FFFFFF;
    --text:#2B2A3D;
    --text-dim:#7C7A94;
    --border:#E9E6F5;
    --border-strong:#DAD4F0;
    --success:#22B573;
    --success-light:#E6F8EF;
    --success-border:rgba(34,181,115,0.35);
    --danger:#F0554A;
    --danger-light:#FDECEA;
    --danger-border:rgba(240,85,74,0.35);
    --shadow: 0 6px 20px rgba(76,60,150,0.08);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app-font{ font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  h1, h2, .heading-font{ font-family:'Poppins', 'Inter', sans-serif; }
  header{
    background:var(--card-bg);
    color:var(--text);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:1px solid var(--border);
    box-shadow: 0 2px 10px rgba(76,60,150,0.05);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.1px;
    color:var(--primary-dark);
  }
  header .subtitle{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    color:var(--text-dim);
    margin-top:2px;
    letter-spacing:0.1px;
  }
  #group-select-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Inter', sans-serif;
  }
  select, input, textarea, button{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
  }
  select#groupSelect{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:#fff;
    color:var(--text);
    min-width:180px;
  }
  nav.tabs{
    display:flex;
    gap:0;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:0 16px;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Inter', sans-serif;
    background:none;
    border:none;
    padding:14px 18px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:0.92rem;
    font-weight:600;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    letter-spacing:0.1px;
  }
  nav.tabs button.active{
    color:var(--primary);
    border-bottom:3px solid var(--primary);
    font-weight:700;
  }
  main{
    max-width:980px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .card h2{
    margin-top:0;
    font-size:1.08rem;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.1px;
    padding-bottom:12px;
    margin-bottom:14px;
    border-bottom:2px solid var(--primary-light);
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  label{
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    color:var(--text-dim);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input[type=text], input[type=date], input[type=time], input[type=number], textarea, select{
    padding:9px 10px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    width:100%;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
  }
  input::placeholder, textarea::placeholder{ color:#B4B0C9; }
  textarea{ min-height:60px; resize:vertical; font-family:'Inter', sans-serif; }
  .btn{
    font-family:'Inter', sans-serif;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
    font-size:0.88rem;
    transition:transform .05s ease, filter .1s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-accent{ background:var(--primary); color:#fff; }
  .btn-accent:hover{ background:var(--primary-dark); }
  .btn-ink{ background:#2B2A3D; color:#fff; }
  .btn-ink:hover{ filter:brightness(1.2); }
  .btn-outline{ background:transparent; color:var(--primary); border:1px solid var(--border-strong); }
  .btn-outline:hover{ background:var(--primary-light); border-color:var(--primary-border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger-border); }
  .btn-danger:hover{ background:var(--danger-light); }
  .btn-sm{ padding:5px 10px; font-size:0.78rem; }
  table{ width:100%; border-collapse:collapse; font-family:'Inter', sans-serif; font-size:0.88rem; }
  th, td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text); }
  th{ color:var(--text-dim); font-weight:700; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; }
  tr:last-child td{ border-bottom:none; }
  .pill{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:2px 10px;
    border-radius:20px;
    font-size:0.75rem;
    font-family:'Inter', sans-serif;
    font-weight:700;
    border:1px solid var(--primary-border);
  }
  .pill-success{ background:var(--success-light); color:var(--success); border-color:var(--success-border); }
  .pill-danger{ background:var(--danger-light); color:var(--danger); border-color:var(--danger-border); }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--text-dim);
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
  }
  .score-select{
    width:64px;
    padding:6px;
    text-align:center;
  }
  .indicator-header-name{ max-width:110px; color:var(--text-dim); }
  .flex-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted{ color:var(--text-dim); font-family:'Inter', sans-serif; font-size:0.82rem; }
  .divider{ border:none; border-top:1px solid var(--border); margin:16px 0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--primary);
    color:#fff;
    padding:10px 20px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    font-weight:700;
    box-shadow:0 4px 16px rgba(76,60,150,0.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:999;
  }
  .toast.show{ opacity:1; }
  .indicator-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--primary-light);
    color:var(--text);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--primary-border);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    margin:4px 6px 4px 0;
  }
  .indicator-tag button{
    background:none; border:none; color:var(--danger); cursor:pointer; font-weight:700; padding:0;
  }
  .file-drop{
    border:2px dashed var(--border-strong);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-family:'Inter', sans-serif;
    color:var(--text-dim);
    font-size:0.85rem;
    cursor:pointer;
  }
  .file-drop:hover{ background:var(--primary-light); border-color:var(--primary); }
  .student-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-family:'Inter', sans-serif;
  }
  .student-name-link{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--primary-dark); font-weight:600; font-size:0.92rem; text-align:left;
    font-family:'Inter', sans-serif;
  }
  .student-name-link:hover{ text-decoration:underline; }
  .avg-badge{
    font-weight:700;
    color:var(--primary);
  }
  .calendar-grid{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:6px;
    font-family:'Inter', sans-serif;
  }
  .calendar-day{
    min-width:130px;
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
  }
  .calendar-day-header{
    font-size:0.76rem;
    font-weight:700;
    color:var(--text);
    text-align:center;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--border-strong);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .calendar-empty{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    padding:10px 0;
  }
  .calendar-block{
    border:1px solid;
    border-radius:7px;
    padding:7px 8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .08s ease, filter .1s ease;
  }
  .calendar-block:hover{ transform:translateY(-2px); filter:brightness(0.97); }
  .calendar-block-time{ font-size:0.72rem; font-weight:700; opacity:0.85; }
  .calendar-block-group{ font-size:0.85rem; font-weight:700; margin-top:2px; }
  .calendar-block-note{ font-size:0.72rem; opacity:0.75; margin-top:2px; }

  /* Calendario mensual */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav h3{ margin:0; font-family:'Poppins', sans-serif; font-size:1rem; color:var(--text); text-transform:capitalize; }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    font-family:'Inter', sans-serif;
  }
  .month-grid-header{
    text-align:center;
    font-size:0.68rem;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .month-cell{
    min-height:64px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px;
    cursor:pointer;
    background:#fff;
    transition:background .12s ease;
    position:relative;
  }
  .month-cell:hover{ background:var(--primary-light); }
  .month-cell.other-month{ opacity:0.35; }
  .month-cell.is-today{ border-color:var(--primary); border-width:2px; }
  .month-cell.is-selected{ background:var(--primary-light); }
  .month-cell-num{ font-size:0.78rem; font-weight:700; color:var(--text); }
  .month-cell-dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
  .month-dot{ width:7px; height:7px; border-radius:50%; }
  .month-dot.pending{ background:transparent; border:1.5px solid currentColor; }
  .month-dot.done{ background:currentColor; border:1.5px solid currentColor; }
  .day-detail-list{ margin-top:6px; }
  .day-detail-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer;
    border:1px solid;
  }

  /* Modal de detalle de estudiante */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,42,61,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:16px;
  }
  .modal-box{
    background:#fff; border-radius:14px; padding:24px;
    max-width:420px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(43,42,61,0.3);
    font-family:'Inter', sans-serif;
  }
  .modal-close{
    float:right; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-dim);
  }
  .pie-chart{
    width:140px; height:140px; border-radius:50%; margin:14px auto;
  }
  .stat-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .stat-row:last-child{ border-bottom:none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Registro de Clases</h1>
    <div class="subtitle">Asistencia, observaciones y cotejo por indicadores — funciona sin conexión</div>
  </div>
  <div id="group-select-wrap">
    <select id="groupSelect"></select>
    <button class="btn btn-accent btn-sm" id="newGroupBtn">+ Grupo</button>
    <button class="btn btn-outline btn-sm" id="driveSettingsBtn" onclick="openDriveSettings()" title="Google Drive">☁️ Drive</button>
  </div>
</header>

<nav class="tabs app-font" id="tabs">
  <button data-tab="estudiantes" class="active">Estudiantes</button>
  <button data-tab="indicadores">Indicadores</button>
  <button data-tab="horario">Horario</button>
  <button data-tab="registrar">Registrar clase</button>
  <button data-tab="historial">Historial</button>
  <button data-tab="calificaciones">Calificaciones</button>
</nav>

<main id="main"></main>

<div class="toast app-font" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============ ESTADO Y PERSISTENCIA (100% local, sin conexión) ============ */
const STORAGE_KEY = 'registroClasesApp_v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Error leyendo almacenamiento', e); }
  return { groups: [], activeGroupId: null, schedule: [] };
}

let state = loadState();

function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Error guardando', e);
    showToast('No se pudo guardar (almacenamiento lleno o bloqueado por el navegador)');
  }
  pushToDrive();
}

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ============ SINCRONIZACIÓN CON GOOGLE DRIVE ============ */
const DRIVE_FILE_NAME = 'registro-clases-data.json';
let driveFileId = null;
let driveTokenClient = null;

const DEFAULT_CLIENT_ID = '305499160088-dk14k2puhdaso68o8hv7500kkct5savn.apps.googleusercontent.com';
function loadDriveClientId(){ return localStorage.getItem('gdrive_client_id') || DEFAULT_CLIENT_ID; }
function saveDriveClientId(id){ localStorage.setItem('gdrive_client_id', id); }

function loadStoredDriveToken(){
  try{
    const raw = localStorage.getItem('gdrive_token');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function storeDriveToken(tok){ localStorage.setItem('gdrive_token', JSON.stringify(tok)); }
function clearDriveToken(){ localStorage.removeItem('gdrive_token'); }
function isDriveTokenValid(tok){ return !!(tok && tok.access_token && tok.expires_at && Date.now() < tok.expires_at - 60000); }

function setDriveStatus(status){
  const map = {
    connected: '☁️ Conectado',
    syncing: '☁️ Sincronizando…',
    error: '⚠️ Error de sincronización',
    disconnected: 'No conectado'
  };
  const text = map[status] || map.disconnected;
  const modalEl = document.getElementById('driveStatusText');
  if(modalEl) modalEl.textContent = text;
}

function connectDrive(){
  const clientId = loadDriveClientId();
  if(!clientId){ showToast('Primero ingresa y guarda tu Client ID de Google'); return; }
  if(typeof google === 'undefined' || !google.accounts){
    showToast('No se pudo cargar Google (revisa tu conexión o que el archivo esté alojado en https)');
    return;
  }
  const stored = loadStoredDriveToken();
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/drive.appdata',
    callback: (resp)=>{
      if(resp.error){
        showToast('No se pudo conectar con Google Drive');
        setDriveStatus('error');
        return;
      }
      const tok = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000) };
      storeDriveToken(tok);
      setDriveStatus('connected');
      showToast('Conectado a Google Drive');
      syncFromDrive();
    }
  });
  driveTokenClient.requestAccessToken({ prompt: stored ? '' : 'consent' });
}

function disconnectDrive(){
  clearDriveToken();
  driveFileId = null;
  setDriveStatus('disconnected');
  showToast('Se desconectó Google Drive (tus datos siguen guardados en este navegador)');
}

async function driveFetch(url, options={}){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) throw new Error('token-expired');
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), Authorization: `Bearer ${stored.access_token}` }
  });
  if(res.status === 401) throw new Error('token-expired');
  if(!res.ok) throw new Error('drive-error-' + res.status);
  return res;
}

async function findDriveFile(){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id)`);
  const data = await res.json();
  return (data.files && data.files.length > 0) ? data.files[0] : null;
}

async function downloadDriveFile(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return JSON.parse(await res.text());
}

async function uploadDriveFile(fileId, data){
  const body = JSON.stringify(data);
  if(fileId){
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body
    });
    return fileId;
  }
  const metadata = { name: DRIVE_FILE_NAME, parents:['appDataFolder'] };
  const boundary = 'registroClasesBoundary';
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
    method:'POST',
    headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
    body: multipartBody
  });
  const created = await res.json();
  return created.id;
}

async function syncFromDrive(){
  try{
    setDriveStatus('syncing');
    const file = await findDriveFile();
    if(file){
      driveFileId = file.id;
      const remote = await downloadDriveFile(file.id);
      const localUpdated = state.updatedAt || 0;
      const remoteUpdated = remote.updatedAt || 0;
      if(remoteUpdated > localUpdated){
        state = remote;
        if(!state.schedule) state.schedule = [];
        ensureDefaultGroup();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderAll();
        showToast('Datos actualizados desde Google Drive');
      } else if(localUpdated > remoteUpdated){
        await uploadDriveFile(driveFileId, state);
      }
    } else {
      driveFileId = await uploadDriveFile(null, state);
    }
    setDriveStatus('connected');
  }catch(e){
    console.error('Error de sincronización con Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

async function pushToDrive(){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) return;
  try{
    setDriveStatus('syncing');
    if(!driveFileId){
      const file = await findDriveFile();
      if(file) driveFileId = file.id;
    }
    driveFileId = await uploadDriveFile(driveFileId, state);
    setDriveStatus('connected');
  }catch(e){
    console.error('Error subiendo a Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

/* ============ MODAL: CONFIGURACIÓN DE GOOGLE DRIVE ============ */
function openDriveSettings(){
  const clientId = loadDriveClientId();
  const stored = loadStoredDriveToken();
  const connected = isDriveTokenValid(stored);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'driveModalOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font">
      <button class="modal-close" onclick="closeDriveSettings()">✕</button>
      <h2 style="border:none; padding-bottom:0;">☁️ Google Drive</h2>
      <p class="muted">Respalda y sincroniza tus datos entre dispositivos con tu propia cuenta de Google. Solo funciona si este archivo está alojado en una URL con https (no abierto como archivo local).</p>
      <div class="stat-row"><span>Estado</span><strong id="driveStatusText">${connected ? '☁️ Conectado' : 'No conectado'}</strong></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-accent btn-sm" onclick="connectDrive()">Conectar</button>
        <button class="btn btn-outline btn-sm" onclick="syncFromDrive()">🔄 Sincronizar ahora</button>
        <button class="btn btn-danger btn-sm" onclick="disconnectDrive()">Desconectar</button>
      </div>
      <hr class="divider">
      <details>
        <summary class="muted" style="cursor:pointer; font-size:0.8rem;">Configuración avanzada (Client ID)</summary>
        <label style="margin-top:10px;">Client ID de Google (OAuth)</label>
        <input type="text" id="driveClientIdInput" placeholder="xxxxx.apps.googleusercontent.com" value="${escapeHtml(clientId)}">

function getActiveGroup(){
  return state.groups.find(g => g.id === state.activeGroupId) || null;
}

function isEntryPresent(entry){
  if(!entry || !entry.cotejo) return false;
  return Object.values(entry.cotejo).some(v => v !== null && v !== undefined);
}

function computeStudentStats(group, studentId){
  let presentCount = 0, absentCount = 0, obtained = 0, maxPossible = 0;
  group.sessions.forEach(session=>{
    const entry = session.entries.find(e=> e.studentId === studentId);
    if(!entry) return;
    const inds = session.indicatorSnapshot || group.indicators;
    if(isEntryPresent(entry)){
      presentCount++;
      inds.forEach(ind=>{
        const v = entry.cotejo[ind.id];
        if(v !== null && v !== undefined){
          obtained += v;
          maxPossible += (ind.levels || 5);
        }
      });
    } else {
      absentCount++;
    }
  });
  const total = presentCount + absentCount;
  const percent = maxPossible > 0 ? Math.round((obtained / maxPossible) * 100) : null;
  return { presentCount, absentCount, total, obtained, maxPossible, percent };
}

/* ============ CALIFICACIONES: ESCALA CHILENA 1.0 - 7.0 (aprobación 4.0) ============ */
function computeChileGrade(scoreObtained, totalScore, exigenciaPercent){
  if(scoreObtained === null || scoreObtained === undefined || !totalScore || totalScore <= 0) return null;
  let exigencia = (exigenciaPercent || 60) / 100;
  if(exigencia <= 0.01) exigencia = 0.01;
  if(exigencia >= 0.99) exigencia = 0.99;
  let p = scoreObtained / totalScore;
  if(p < 0) p = 0;
  if(p > 1) p = 1;
  let nota;
  if(p <= exigencia){
    nota = 1 + 3 * (p / exigencia);
  } else {
    nota = 4 + 3 * (p - exigencia) / (1 - exigencia);
  }
  nota = Math.min(7, Math.max(1, nota));
  return Math.round(nota * 10) / 10;
}

function getEvalParamsForStudent(evaluation, studentId){
  const override = evaluation.overrides && evaluation.overrides[studentId];
  return {
    totalScore: (override && override.totalScore !== undefined && override.totalScore !== null) ? override.totalScore : evaluation.totalScore,
    exigencia: (override && override.exigencia !== undefined && override.exigencia !== null) ? override.exigencia : evaluation.exigencia,
  };
}

function computeStudentEvalGrade(evaluation, studentId){
  const score = evaluation.scores ? evaluation.scores[studentId] : null;
  if(score === null || score === undefined) return null;
  const params = getEvalParamsForStudent(evaluation, studentId);
  return computeChileGrade(score, params.totalScore, params.exigencia);
}

function computeStudentFinalGrade(group, studentId){
  const evals = group.evaluations || [];
  const weighted = evals.filter(e=> e.weightType === 'weighted');
  const simple = evals.filter(e=> e.weightType !== 'weighted');

  let weightedSum = 0, weightTotal = 0;
  weighted.forEach(e=>{
    const nota = computeStudentEvalGrade(e, studentId);
    if(nota !== null){
      weightedSum += nota * ((e.weightPercent || 0) / 100);
      weightTotal += (e.weightPercent || 0) / 100;
    }
  });

  const simpleNotas = simple.map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  const simpleAvg = simpleNotas.length ? simpleNotas.reduce((a,b)=>a+b,0)/simpleNotas.length : null;
  const remainingWeight = Math.max(0, 1 - weightTotal);

  let finalGrade = null;
  if(weightTotal > 0 && simpleAvg !== null && remainingWeight > 0){
    finalGrade = weightedSum + simpleAvg * remainingWeight;
  } else if(weightTotal > 0){
    finalGrade = weightTotal >= 1 ? weightedSum : (simpleAvg !== null ? weightedSum + simpleAvg * remainingWeight : weightedSum / weightTotal);
  } else if(simpleAvg !== null){
    finalGrade = simpleAvg;
  }
  if(finalGrade !== null) finalGrade = Math.round(Math.min(7, Math.max(1, finalGrade)) * 10) / 10;

  const allNotas = evals.map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  const promedioSimple = allNotas.length ? Math.round((allNotas.reduce((a,b)=>a+b,0)/allNotas.length) * 10) / 10 : null;

  return { finalGrade, promedioSimple, count: allNotas.length };
}

function totalWeightAssigned(group){
  return (group.evaluations || []).filter(e=> e.weightType === 'weighted')
    .reduce((sum,e)=> sum + (e.weightPercent || 0), 0);
}

const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

let calendarMonthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedCalendarDate = toISODate(new Date());

function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function jsWeekdayToOurDay(jsDay){ return jsDay === 0 ? 7 : jsDay; }
function buildMonthCells(cursor){
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const firstWeekday = jsWeekdayToOurDay(firstOfMonth.getDay());
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=1; i<firstWeekday; i++){
    cells.push({ date: new Date(year, month, 1 - (firstWeekday - i)), otherMonth: true });
  }
  for(let day=1; day<=daysInMonth; day++){
    cells.push({ date: new Date(year, month, day), otherMonth: false });
  }
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1].date;
    const next = new Date(last);
    next.setDate(next.getDate()+1);
    cells.push({ date: next, otherMonth: true });
  }
  return cells;
}
function changeCalendarMonth(delta){
  calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth()+delta, 1);
  renderHorario();

}

function editScheduleEntry(id){
  const entry = state.schedule.find(e=>e.id===id);
  if(!entry) return;
  const dayRaw = prompt('Día de la semana (1=Lunes ... 7=Domingo):', entry.day);
  if(dayRaw === null) return;
  const day = parseInt(dayRaw, 10);
  if(day >= 1 && day <= 7) entry.day = day;
  const start = prompt('Hora de inicio (HH:MM):', entry.startTime);
  if(start !== null && /^\d{2}:\d{2}$/.test(start.trim())) entry.startTime = start.trim();
  const end = prompt('Hora de término (HH:MM, opcional):', entry.endTime || '');
  if(end !== null) entry.endTime = end.trim();
  const note = prompt('Nota (opcional):', entry.note || '');
  if(note !== null) entry.note = note.trim();
  saveState();
  renderHorario();
  showToast('Clase del horario actualizada');
}

function deleteScheduleEntry(id){
  if(!confirm('¿Eliminar esta clase del horario?')) return;
  state.schedule = state.schedule.filter(e=>e.id!==id);
  saveState();
  renderHorario();
}

function computeDateForWeekday(day){
  // day: 1=Lunes ... 7=Domingo. Devuelve la fecha (YYYY-MM-DD) de ese día en la semana actual.
  const today = new Date();
  const jsDay = today.getDay(); // 0=Domingo ... 6=Sábado
  const todayIso = jsDay === 0 ? 7 : jsDay; // convertir a 1=Lunes ... 7=Domingo
  const diff = day - todayIso;
  const target = new Date(today);
  target.setDate(today.getDate() + diff);
  return target.toISOString().slice(0,10);
}

function goToClass(entryId){
  const entry = state.schedule.find(e=>e.id===entryId);
  if(!entry) return;
  const group = state.groups.find(g=>g.id===entry.groupId);
  if(!group){ showToast('El grupo de esta clase ya no existe'); return; }
  state.activeGroupId = group.id;
  saveState();
  renderGroupSelect();
  currentTab = 'registrar';
  document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab==='registrar'));
  renderRegistrar(group, null, { date: computeDateForWeekday(entry.day), time: entry.startTime });
}

    <div class="card app-font">
      <div class="flex-between">
        <h2 style="border:none; margin-bottom:0; padding-bottom:0;">${escapeHtml(evaluation.name)}</h2>
        <button class="btn btn-outline btn-sm" onclick="closeEvalScores()">← Volver</button>
      </div>
      <p class="muted">Puntaje total: ${evaluation.totalScore} · Exigencia: ${evaluation.exigencia}% (aprobación 4.0)</p>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>Estudiante</th><th>Puntaje obtenido</th><th>Nota</th><th>Adecuación</th></tr>
        </thead>
        <tbody>
          ${group.students.map(s=>{
            const score = evaluation.scores ? evaluation.scores[s.id] : null;
            const nota = computeStudentEvalGrade(evaluation, s.id);
            const hasOverride = evaluation.overrides && evaluation.overrides[s.id];
            return `
              <tr>
                <td>${escapeHtml(s.name)}</td>
                <td><input type="number" class="score-select" style="width:80px;" min="0" max="${(hasOverride && hasOverride.totalScore) || evaluation.totalScore}"
                    value="${score !== null && score !== undefined ? score : ''}"
                    onchange="saveEvalScore('${evaluation.id}','${s.id}', this.value)"></td>
                <td class="avg-badge">${nota !== null ? nota.toFixed(1) : '-'}</td>
                <td>
                  <button class="btn btn-outline btn-sm" onclick="openEvalOverride('${evaluation.id}','${s.id}')">
                    ${hasOverride ? '✎ Editado' : 'Ajustar'}
                  </button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function closeEvalScores(){
  calActiveEvalId = null;
  renderCalificaciones(getActiveGroup());
}

function saveEvalScore(evalId, studentId, value){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  if(!ev.scores) ev.scores = {};
  const num = value === '' ? null : Number(value);
  ev.scores[studentId] = (num === null || isNaN(num)) ? null : num;
  saveState();
  renderEvalScores(group, ev);
}

function openEvalOverride(evalId, studentId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  const student = group.students.find(s=>s.id===studentId);
  if(!ev.overrides) ev.overrides = {};
  const current = ev.overrides[studentId] || {};
  const newTotal = prompt(`Puntaje total para ${student ? student.name : 'este estudiante'} (adecuación curricular). Deja vacío para usar el valor por defecto (${ev.totalScore}):`, current.totalScore !== undefined ? current.totalScore : '');
  if(newTotal === null) return;
  const newExigencia = prompt(`% de exigencia para ${student ? student.name : 'este estudiante'}. Deja vacío para usar el valor por defecto (${ev.exigencia}%):`, current.exigencia !== undefined ? current.exigencia : '');
  if(newExigencia === null) return;
  const override = {};
  if(newTotal.trim() !== '' && Number(newTotal) > 0) override.totalScore = Number(newTotal);
  if(newExigencia.trim() !== '' && Number(newExigencia) > 0) override.exigencia = Number(newExigencia);
  if(Object.keys(override).length === 0){
    delete ev.overrides[studentId];
  } else {
    ev.overrides[studentId] = override;
  }
  saveState();
  renderEvalScores(group, ev);
  showToast('Adecuación curricular guardada');
}

/* ============ EXPORTAR CALIFICACIONES A EXCEL (con fórmulas editables) ============ */
function colLetter(n){
  let s = '';
  while(n > 0){
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

async function exportCalificacionesToExcel(group){
  if(typeof ExcelJS === 'undefined'){
    showToast('Se necesita conexión a internet para exportar con fórmulas. Intenta de nuevo cuando tengas internet.');
    return;
  }
  const evals = group.evaluations || [];
  if(evals.length === 0){ showToast('No hay evaluaciones para exportar'); return; }
  if(group.students.length === 0){ showToast('No hay estudiantes en este grupo'); return; }

  showToast('Generando Excel…');
  const workbook = new ExcelJS.Workbook();
  const ws = workbook.addWorksheet('Calificaciones');
  const blockColors = ['F1ECFC','E6F8EF','FDF3DE','E7F1FC','FCEAF3'];

  let col = 2;
  const blocks = evals.map((ev, idx)=>{
    const scoreCol = col, totalCol = col+1, exigCol = col+2, notaCol = col+3;
    col += 4;
    return { ev, scoreCol, totalCol, exigCol, notaCol, color: blockColors[idx % blockColors.length] };
  });
  const promedioCol = col; col++;
  const finalCol = col; col++;

  ws.mergeCells(1,1,2,1);
  const studentHeader = ws.getCell(1,1);
  studentHeader.value = 'Estudiante';
  studentHeader.font = { bold:true, color:{argb:'FF2B2A3D'} };
  studentHeader.alignment = { vertical:'middle', horizontal:'center' };
  studentHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE9E6F5'} };

  blocks.forEach(b=>{
    ws.mergeCells(1, b.scoreCol, 1, b.notaCol);
    const header = ws.getCell(1, b.scoreCol);
    header.value = `${b.ev.name} (${b.ev.weightType === 'weighted' ? 'pondera ' + b.ev.weightPercent + '%' : 'promedio simple'})`;
    header.font = { bold:true, size:10, color:{argb:'FF2B2A3D'} };
    header.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    for(let c=b.scoreCol; c<=b.notaCol; c++){
      ws.getCell(1,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
      ws.getCell(2,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
    }
    const subHeaders = ['Puntaje','Total','% Exig.','Nota'];
    [b.scoreCol,b.totalCol,b.exigCol,b.notaCol].forEach((c,i)=>{
      const cell = ws.getCell(2,c);
      cell.value = subHeaders[i];
      cell.font = { bold:true, size:9, color:{argb:'FF2B2A3D'} };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    });
  });

  ws.mergeCells(1, promedioCol, 2, promedioCol);
  const promHeader = ws.getCell(1, promedioCol);
  promHeader.value = 'Promedio simple';
  promHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  promHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  promHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  ws.mergeCells(1, finalCol, 2, finalCol);
  const finalHeader = ws.getCell(1, finalCol);
  finalHeader.value = 'Nota final';
  finalHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  finalHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  finalHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  group.students.forEach((student, si)=>{
    const rowNum = 3 + si;
    ws.getCell(rowNum, 1).value = student.name;
    ws.getCell(rowNum, 1).font = { bold:true };

    const notaRefs = [];
    blocks.forEach(b=>{
      const scoreVal = b.ev.scores ? b.ev.scores[student.id] : null;
      const override = b.ev.overrides ? b.ev.overrides[student.id] : null;
      const totalVal = (override && override.totalScore != null) ? override.totalScore : b.ev.totalScore;
      const exigVal = (override && override.exigencia != null) ? override.exigencia : b.ev.exigencia;

      ws.getCell(rowNum, b.scoreCol).value = (scoreVal !== null && scoreVal !== undefined) ? scoreVal : null;
      ws.getCell(rowNum, b.totalCol).value = totalVal;
      ws.getCell(rowNum, b.exigCol).value = exigVal;
      [b.scoreCol, b.totalCol, b.exigCol].forEach(c=>{
        ws.getCell(rowNum, c).alignment = { horizontal:'center', vertical:'middle' };
      });

      const S = colLetter(b.scoreCol) + rowNum;
      const T = colLetter(b.totalCol) + rowNum;
      const E = colLetter(b.exigCol) + rowNum;
      const pExpr = `MIN(1,MAX(0,${S}/${T}))`;
      const exigExpr = `(${E}/100)`;
      const gradeFormula = `ROUND(MIN(7,MAX(1,IF(${pExpr}<=${exigExpr},1+3*(${pExpr}/${exigExpr}),4+3*(${pExpr}-${exigExpr})/(1-${exigExpr})))),1)`;
      const notaCell = ws.getCell(rowNum, b.notaCol);
      notaCell.value = { formula: `IF(OR(${S}="",${T}=0),"",${gradeFormula})` };
      notaCell.alignment = { horizontal:'center', vertical:'middle' };
      notaCell.font = { bold:true };
      notaRefs.push({ ref: colLetter(b.notaCol) + rowNum, weighted: b.ev.weightType === 'weighted', weightPercent: b.ev.weightPercent || 0 });
    });

    const allRefs = notaRefs.map(n=>n.ref);
    const promCell = ws.getCell(rowNum, promedioCol);
    promCell.value = { formula: `IFERROR(ROUND(AVERAGE(${allRefs.join(',')}),1),"")` };
    promCell.alignment = { horizontal:'center', vertical:'middle' };

    const weightedRefs = notaRefs.filter(n=>n.weighted);
    const simpleRefs = notaRefs.filter(n=>!n.weighted);
    const weightTotal = weightedRefs.reduce((s,n)=> s + (n.weightPercent/100), 0);
    const remaining = Math.max(0, 1 - weightTotal);

    let finalFormula;
    if(weightedRefs.length > 0 && simpleRefs.length > 0){
      const weightedTerms = weightedRefs.map(n=> `${n.ref}*${(n.weightPercent/100)}`).join('+');
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})+AVERAGE(${simpleRefs.map(n=>n.ref).join(',')})*${remaining})),1),"")`;
    } else if(weightedRefs.length > 0){
      const weightedTerms = weightedRefs.map(n=> `${n.ref}*${(n.weightPercent/100)}`).join('+');
      const divisor = (weightTotal > 0 && weightTotal < 1) ? `/${weightTotal}` : '';
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})${divisor})),1),"")`;
    } else {
      finalFormula = `IFERROR(ROUND(AVERAGE(${simpleRefs.map(n=>n.ref).join(',')}),1),"")`;
    }
    const finalCellObj = ws.getCell(rowNum, finalCol);
    finalCellObj.value = { formula: finalFormula };
    finalCellObj.alignment = { horizontal:'center', vertical:'middle' };
    finalCellObj.font = { bold:true, color:{argb:'FF6C4EE3'} };
  });

  ws.getColumn(1).width = 22;
  for(let c=2; c<=finalCol; c++){ ws.getColumn(c).width = 11; }
  ws.getRow(1).height = 34;
  ws.getRow(2).height = 26;

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeGroupName = group.name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
  a.href = url;
  a.download = `calificaciones_${safeGroupName}_${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Excel de calificaciones exportado');
}

/* ============ EXPORTAR A EXCEL (.xlsx con formato, con respaldo CSV sin conexión) ============ */
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportGroupToCSVFallback(group){
  const sessions = [...group.sessions].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sessions.length === 0){ showToast('No hay registros para exportar'); return; }

  const header = ['Estudiante'];
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    inds.forEach(ind=> header.push(`${formatDate(session.date)} ${session.time} - ${ind.name}`));
  });
  header.push('Presentes','Ausentes','Obtenido','Posible','% Logro');
  const rows = [header];

  group.students.forEach(student=>{
    const row = [student.name];
    sessions.forEach(session=>{
      const inds = session.indicatorSnapshot || group.indicators;
      const entry = session.entries.find(e=> e.studentId === student.id);
      if(!entry){
        inds.forEach(()=> row.push(''));
      } else if(!isEntryPresent(entry)){
        row.push('AUSENTE');
        for(let i=1;i<inds.length;i++) row.push('');
      } else {
        inds.forEach(ind=> row.push(entry.cotejo[ind.id] ?? ''));
      }
    });
    const stats = computeStudentStats(group, student.id);
    row.push(stats.presentCount, stats.absentCount, stats.obtained, stats.maxPossible, stats.percent === null ? '' : stats.percent + '%');
    rows.push(row);
  });

  const csvContent = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeGroupName = group.name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
  a.href = url;
  a.download = `registro_${safeGroupName}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sin conexión: se exportó un .csv simple (sin colores). Ábrelo con Excel.');
}

async function exportGroupToExcel(group){
  if(typeof ExcelJS === 'undefined'){
    exportGroupToCSVFallback(group);
    return;
  }
  const sessions = [...group.sessions].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sessions.length === 0){ showToast('No hay registros para exportar'); return; }

  showToast('Generando Excel…');
  const workbook = new ExcelJS.Workbook();
  const ws = workbook.addWorksheet('Registro');

  const blockColors = ['F1ECFC','E6F8EF','FDF3DE','E7F1FC','FCEAF3'];
  let col = 2; // columna B
  const blocks = sessions.map((session, idx)=>{
    const inds = session.indicatorSnapshot || group.indicators;
    const startCol = col;
    const endCol = col + inds.length - 1;
    col = endCol + 1;
    return { session, inds, startCol, endCol, color: blockColors[idx % blockColors.length] };
  });
  const summaryStart = col;
  const summaryLabels = ['Presentes','Ausentes','Obtenido','Posible','% Logro'];
  const summaryEnd = summaryStart + summaryLabels.length - 1;

  // Encabezado columna Estudiante (filas 1-2 combinadas)
  ws.mergeCells(1,1,2,1);
  const studentHeader = ws.getCell(1,1);
  studentHeader.value = 'Estudiante';
  studentHeader.font = { bold:true, color:{argb:'FF2B2A3D'} };
  studentHeader.alignment = { vertical:'middle', horizontal:'center' };
  studentHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE9E6F5'} };

  // Encabezados por bloque de clase
  blocks.forEach(block=>{
    ws.mergeCells(1, block.startCol, 1, block.endCol);
    const headerCell = ws.getCell(1, block.startCol);
    headerCell.value = `${formatDate(block.session.date)} · ${block.session.time}`;
    headerCell.font = { bold:true, color:{argb:'FF2B2A3D'} };
    headerCell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    for(let c=block.startCol; c<=block.endCol; c++){
      ws.getCell(1,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+block.color} };
      ws.getCell(2,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+block.color} };
    }
    block.inds.forEach((ind, i)=>{
      const cell = ws.getCell(2, block.startCol + i);
      cell.value = ind.name;
      cell.font = { bold:true, size:10, color:{argb:'FF2B2A3D'} };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    });
  });

  // Encabezado del resumen
  ws.mergeCells(1, summaryStart, 1, summaryEnd);
  const summaryHeader = ws.getCell(1, summaryStart);
  summaryHeader.value = 'Resumen';
  summaryHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  summaryHeader.alignment = { vertical:'middle', horizontal:'center' };
  summaryLabels.forEach((label, i)=>{
    const cell = ws.getCell(2, summaryStart + i);
    cell.value = label;
    cell.font = { bold:true, size:10, color:{argb:'FFFFFFFF'} };
    cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  });
  for(let c=summaryStart; c<=summaryEnd; c++){
    ws.getCell(1,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };
    ws.getCell(2,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF554C77'} };
  }

  // Filas de datos: una por estudiante
  group.students.forEach((student, si)=>{
    const rowNum = 3 + si;
    const nameCell = ws.getCell(rowNum, 1);
    nameCell.value = student.name;
    nameCell.font = { bold:true };
    nameCell.alignment = { vertical:'middle' };

    blocks.forEach(block=>{
      const entry = block.session.entries.find(e=> e.studentId === student.id);
      if(!entry){
        ws.mergeCells(rowNum, block.startCol, rowNum, block.endCol);
        const cell = ws.getCell(rowNum, block.startCol);
        cell.value = '—';
        cell.alignment = { horizontal:'center', vertical:'middle' };
        cell.font = { color:{argb:'FFB4B0C9'}, italic:true };
      } else if(!isEntryPresent(entry)){
        ws.mergeCells(rowNum, block.startCol, rowNum, block.endCol);
        const cell = ws.getCell(rowNum, block.startCol);
        cell.value = 'AUSENTE';
        cell.font = { bold:true, color:{argb:'FFD8493E'} };
        cell.alignment = { horizontal:'center', vertical:'middle' };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFDECEA'} };
      } else {
        block.inds.forEach((ind, i)=>{
          const cell = ws.getCell(rowNum, block.startCol + i);
          const v = entry.cotejo[ind.id];
          cell.value = (v !== null && v !== undefined) ? v : '';
          cell.alignment = { horizontal:'center', vertical:'middle' };
        });
      }
    });

    const stats = computeStudentStats(group, student.id);
    const summaryValues = [
      stats.presentCount,
      stats.absentCount,
      stats.obtained,
      stats.maxPossible,
      stats.percent === null ? '' : stats.percent + '%'
    ];
    summaryValues.forEach((val, i)=>{
      const cell = ws.getCell(rowNum, summaryStart + i);
      cell.value = val;
      cell.alignment = { horizontal:'center', vertical:'middle' };
      if(i === 4) cell.font = { bold:true, color:{argb:'FF6C4EE3'} };
    });
  });

  ws.getColumn(1).width = 24;
  for(let c=2; c<=summaryEnd; c++){ ws.getColumn(c).width = 13; }
  ws.getRow(1).height = 30;
  ws.getRow(2).height = 34;

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeGroupName = group.name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
  a.href = url;
  a.download = `registro_${safeGroupName}_${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Archivo Excel exportado');
}

/* ============ UTILIDADES ============ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

if(!state.schedule) state.schedule = [];
ensureDefaultGroup();

  syncFromDrive();
}

setInterval(()=>{
  if(currentTab === 'registrar') return;
  if(document.hidden) return;
  if(isDriveTokenValid(loadStoredDriveToken())){
    syncFromDrive();
  }
}, 30000);

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && currentTab !== 'registrar' && isDriveTokenValid(loadStoredDriveToken())){
    syncFromDrive();
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=> console.log('No se pudo registrar el service worker', err));
  });
}
