/* ---- Permiso de Gmail ---- */
function getGmailToken(){
  return new Promise((resolve, reject)=>{
    if(gmailToken && gmailToken.expires_at > Date.now() + 60000){ resolve(gmailToken.access_token); return; }
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
      reject(new Error('No se pudo cargar Google. Revisa tu conexión a internet.')); return;
    }
    const cfg = {
      client_id: loadDriveClientId(),
      scope: GMAIL_SEND_SCOPE,
      prompt: '',
      callback: (resp)=>{
        if(resp.error){ reject(new Error('Google no dio el permiso (' + (resp.error_description || resp.error) + ')')); return; }
        if(!google.accounts.oauth2.hasGrantedAllScopes(resp, GMAIL_SEND_SCOPE)){
          reject(new Error('No se marcó el permiso "Enviar correo electrónico en tu nombre" en la ventana de Google')); return;
        }
        gmailToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000) };
        resolve(resp.access_token);
      },
      error_callback: (err)=>{
        const t = err && err.type;
        reject(new Error(t === 'popup_closed' ? 'Se cerró la ventana de Google sin dar el permiso'
          : t === 'popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google (permite ventanas emergentes)'
          : 'No se pudo abrir la ventana de Google'));
      },
    };
    const hint = localStorage.getItem('gdrive_email');
    if(hint) cfg.login_hint = hint;
    google.accounts.oauth2.initTokenClient(cfg).requestAccessToken();
  });
}

/* ---- Construcción del correo (MIME) ---- */
function b64Utf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function wrapB64(s){ return s.replace(/.{1,76}/g, '$&\r\n'); }
function mimeHeaderValue(str){ return /^[\x20-\x7E]*$/.test(str) ? str : '=?UTF-8?B?' + b64Utf8(str) + '?='; }
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(String(r.result).split(',')[1] || '');
    r.onerror = ()=> reject(r.error);
    r.readAsDataURL(blob);
  });
}
async function buildReportMime(to, subject, bodyText, fileName, fileBlob, mimeType){
  mimeType = mimeType || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const boundary = 'rc_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const asciiName = fileName.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_');
  const attachment = await blobToBase64(fileBlob);
  return [
    'MIME-Version: 1.0',
    'To: ' + to,
    'Subject: ' + mimeHeaderValue(subject),
    'Content-Type: multipart/mixed; boundary="' + boundary + '"',
    '',
    '--' + boundary,
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    wrapB64(b64Utf8(bodyText.replace(/\r?\n/g, '\r\n'))),
    '--' + boundary,
    'Content-Type: ' + mimeType + '; name="' + asciiName + '"',
    'Content-Disposition: attachment; filename="' + asciiName + '"; filename*=UTF-8\'\'' + encodeURIComponent(fileName),
    'Content-Transfer-Encoding: base64',
    '',
    wrapB64(attachment),
    '--' + boundary + '--',
    '',
  ].join('\r\n');
}
async function gmailSendMime(token, mime){
  const res = await fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'message/rfc822' },
    body: mime,
  });
  if(res.ok) return;
  let msg = '';
  try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(e){}
  if(res.status === 401){ gmailToken = null; throw new Error('El permiso de Google expiró. Vuelve a enviar.'); }
  if(res.status === 403 && /has not been used|is disabled|not enabled/i.test(msg)){
    const err = new Error('La Gmail API no está habilitada en tu proyecto de Google Cloud (revisa "Primera vez: habilitar el envío").');
    err.fatal = true; throw err;
  }
  if(res.status === 403 && /insufficient|scope/i.test(msg)){ gmailToken = null; const err = new Error('Falta el permiso para enviar correos. Vuelve a intentarlo y acepta el permiso.'); err.fatal = true; throw err; }
  if(res.status === 400 && /invalid to|recipient|address/i.test(msg)) throw new Error('Google rechazó el correo del destinatario');
  if(res.status === 429) throw new Error('Google limitó los envíos por ahora (demasiados seguidos). Intenta más tarde.');
  throw new Error('Error de Gmail (' + res.status + ')' + (msg ? ': ' + msg : ''));
}

/* Lee un CSV/texto con nombre y correo en cualquier columna, y asigna el correo al estudiante con ese nombre */
function applyEmailsFromText(group, text){
  let matched = 0;
  const unmatched = [];
  String(text || '').split(/\r?\n/).forEach(line=>{
    const cells = line.split(/[,;\t]/).map(c=> c.replace(/^"|"$/g, '').trim()).filter(Boolean);
    const email = cells.find(c=> isValidEmail(c));
    if(!email) return;
    const nameCells = cells.filter(c=> c !== email && !/^\d+$/.test(c));
    if(nameCells.length === 0) return;
    const candidates = [nameCells.join(' '), ...nameCells, nameCells.slice().reverse().join(' ')].map(normalizePersonName);
    const s = group.students.find(st=> candidates.includes(normalizePersonName(st.name)));
    if(s){ s.email = email; matched++; if(mailSendState) mailSendState.selected.add(s.id); }
    else unmatched.push(nameCells.join(' '));
  });
  return { matched, unmatched };
}
function importMailCsv(file){
  if(!file) return;
  const group = mailGroup();
  const reader = new FileReader();
  reader.onload = ev=>{
    const { matched, unmatched } = applyEmailsFromText(group, ev.target.result);
    saveState();
    renderMailReports();
    showToast(`${matched} correo(s) asignado(s)` + (unmatched.length ? `. Sin coincidencia de nombre: ${unmatched.slice(0,3).join(', ')}${unmatched.length > 3 ? '…' : ''}` : ''));
  };
  reader.readAsText(file, 'UTF-8');
}

async function startMailSend(){
  const ms = mailSendState;
  const group = mailGroup();
  if(!ms || !group || ms.sending) return;
  const isCard = ms.kind === 'card';
  if(!isCard && typeof JSZip === 'undefined'){ showToast('Se necesita conexión a internet para generar los informes.'); return; }
  const recipients = group.students.filter(s=> ms.selected.has(s.id) && isValidEmail(s.email));
  if(recipients.length === 0) return;
  // Importante: el permiso se pide antes de cualquier espera, para que el navegador no bloquee la ventana de Google
  let token;
  try{
    token = await getGmailToken();
  }catch(e){
    showToast(e.message);
    return;
  }
  const tpl = mailTpl();
  const opts = reportOptionsFromTemplate();
  if(isCard){ ensureAllCards(); if(ensurePortalConfig().enabled) ensureWebTokens(); }
  ms.sending = true; ms.confirming = false;
  ms.status = {};
  recipients.forEach(s=> ms.status[s.id] = { state: 'pending' });
  renderMailReports();
  let ok = 0, fail = 0, fatal = null;
  for(const s of recipients){
    if(fatal){ ms.status[s.id] = { state: 'error', msg: 'No enviado' }; fail++; continue; }
    ms.status[s.id] = { state: 'sending' };
    refreshMailRow(s);
    try{
      const subject = fillMailPlaceholders(tpl.subject, group, s);
      const body = fillMailPlaceholders(tpl.body, group, s).replace(/\n{3,}/g, '\n\n');
      const mime = isCard
        ? await buildReportMime(s.email.trim(), subject, body, digitalCardFileName(s), await renderDigitalCardBlob(digitalCardFor(group, s)), 'image/png')
        : await buildReportMime(s.email.trim(), subject, body, reportFileName(s), await buildDocxBlob(buildStudentHistoryBody(group, s, opts), { nombre: s.name, curso: group.name }));
      await gmailSendMime(token, mime);
      ms.status[s.id] = { state: 'ok' };
      s[isCard ? 'lastCardSent' : 'lastReportSent'] = new Date().toISOString();
      ok++;
    }catch(e){
      ms.status[s.id] = { state: 'error', msg: e.message };
      fail++;
      if(e.fatal) fatal = e;
    }
    refreshMailRow(s);
    await sleep(350);
  }
  ms.sending = false;
  saveState();
  renderMailReports();
  if(fatal) showToast(fatal.message);
  else showToast(fail ? `Enviados ${ok}, con error ${fail}. Revisa el estado bajo cada correo.` : `✅ ${ok} ${isCard ? 'tarjeta(s) digital(es) enviada(s)' : 'informe(s) enviado(s)'}`);
}
function refreshMailRow(s){
  const cell = document.getElementById('mailStatus_' + s.id);
  if(cell) cell.innerHTML = mailStatusHtml(s);
  const footer = document.getElementById('mailSendFooter');
  if(footer) footer.innerHTML = mailFooterHtml(0);
}

/* ============ PLANTILLA WORD PARA INFORMES ============ */
/* El profesor sube un .docx con su encabezado (logo, colegio), pie de página, márgenes y letra.
   Los Word que genera la app se insertan en el cuerpo de esa plantilla: donde diga {CONTENIDO},
   o al final si no aparece. {NOMBRE}, {CURSO} y {FECHA} se reemplazan también en encabezado y pie.
   Plantillas de hasta 300 KB se guardan con tus datos (se sincronizan con Drive); las más pesadas,
   solo en este dispositivo. */
const WORD_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const TEMPLATE_SYNC_MAX = 300 * 1024;
const TEMPLATE_DB = 'registroClasesReportTemplate';
let reportTemplateCache = null;   // { key, buffer }

function templateDb(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('Este navegador no permite guardar archivos')); return; }
    const req = indexedDB.open(TEMPLATE_DB, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('files');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function templateDbOp(mode, fn){
  const db = await templateDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = ()=> resolve(req ? req.result : undefined);
    tx.onerror = ()=> reject(tx.error);
  });
}
function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0; i<bytes.length; i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToArrayBuffer(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

/* Devuelve el ArrayBuffer de la plantilla activa, o null si no hay (o si es de otro dispositivo) */
async function getReportTemplateBuffer(){
  const info = state.reportTemplate;
  if(!info) return null;
  const key = info.uploadedAt + '|' + info.name;
  if(reportTemplateCache && reportTemplateCache.key === key) return reportTemplateCache.buffer;
  let buffer = null;
  if(info.b64) buffer = base64ToArrayBuffer(info.b64);
  else {
    try{
      const stored = await templateDbOp('readonly', st=> st.get('template'));
      if(stored && stored.uploadedAt === info.uploadedAt) buffer = stored.data;
    }catch(e){}
  }
  if(buffer) reportTemplateCache = { key, buffer };
  return buffer;
}
function reportTemplateAvailableHere(){
  const info = state.reportTemplate;
  if(!info) return false;
  if(info.b64) return true;
  return !!(reportTemplateCache && reportTemplateCache.key === info.uploadedAt + '|' + info.name);
}

/* ---- Utilidades XML ---- */
function wParagraphText(p){
  return [...p.getElementsByTagNameNS(WORD_NS, 't')].map(t=> t.textContent).join('');
}
/* Reemplaza un texto aunque Word lo haya partido en varios fragmentos (runs) con distinto formato */
function replaceInWordParagraph(p, replacements){
  const ts = [...p.getElementsByTagNameNS(WORD_NS, 't')];
  if(ts.length === 0) return;
  const fullText = ()=> ts.map(t=> t.textContent).join('');
  if(fullText().indexOf('{') === -1) return;
  for(const [key, value] of replacements){
    let guard = 0, idx;
    while((idx = fullText().indexOf(key)) !== -1 && guard++ < 50){
      const end = idx + key.length;
      let pos = 0, first = true;
      for(const t of ts){
        const txt = t.textContent, s = pos, e = pos + txt.length;
        pos = e;
        if(e <= idx || s >= end) continue;
        const a = Math.max(idx, s) - s, b = Math.min(end, e) - s;
        t.textContent = txt.slice(0, a) + (first ? value : '') + txt.slice(b);
        t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
        first = false;
      }
    }
  }
}
function templateReplacements(ctx){
  const pairs = [
    ['{NOMBRE}', ctx.nombre || ''],
    ['{CURSO}', ctx.curso || ''],
    ['{FECHA}', formatDate(toISODate(new Date()))],
  ];
  // también en minúsculas: {nombre}, {curso}, {fecha}
  return [...pairs, ...pairs.map(([k, v])=> [k.toLowerCase(), v])];
}
function replacePlaceholdersInXmlDoc(doc, ctx){
  const reps = templateReplacements(ctx);
  [...doc.getElementsByTagNameNS(WORD_NS, 'p')].forEach(p=> replaceInWordParagraph(p, reps));
}

/* Inserta el contenido generado (XML de párrafos/tablas) en la plantilla y devuelve el .docx final */
async function mergeIntoTemplate(templateBuffer, bodyXml, ctx){
  const zip = await JSZip.loadAsync(templateBuffer);
  // Ubicación del documento principal (normalmente word/document.xml)
  let docPath = 'word/document.xml';
  try{
    const rels = await zip.file('_rels/.rels').async('string');
    const m = rels.match(/Type="[^"]*\/officeDocument"[^>]*Target="\/?([^"]+)"/) || rels.match(/Target="\/?([^"]+)"[^>]*Type="[^"]*\/officeDocument"/);
    if(m) docPath = m[1];
  }catch(e){}
  const docFile = zip.file(docPath);
  if(!docFile) throw new Error('La plantilla no parece un documento de Word válido');
  const parser = new DOMParser();
  const doc = parser.parseFromString(await docFile.async('string'), 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('No se pudo leer la plantilla');
  const body = doc.getElementsByTagNameNS(WORD_NS, 'body')[0];
  if(!body) throw new Error('La plantilla no tiene cuerpo de documento');

  const frag = parser.parseFromString(`<w:root xmlns:w="${WORD_NS}">${bodyXml}</w:root>`, 'application/xml');
  if(frag.getElementsByTagName('parsererror').length) throw new Error('No se pudo armar el contenido del informe');
  const nodes = [...frag.documentElement.childNodes].filter(n=> n.nodeType === 1);

  const target = [...body.getElementsByTagNameNS(WORD_NS, 'p')].find(p=> /\{contenido\}/i.test(wParagraphText(p)));
  if(target){
    const parent = target.parentNode;
    nodes.forEach(n=> parent.insertBefore(doc.importNode(n, true), target));
    parent.removeChild(target);
    // Una celda de tabla de Word siempre debe terminar en un párrafo
    if(parent.localName === 'tc'){
      const last = [...parent.childNodes].filter(n=> n.nodeType === 1).pop();
      if(!last || last.localName !== 'p') parent.appendChild(doc.createElementNS(WORD_NS, 'w:p'));
    }
  } else {
    const sectPr = [...body.childNodes].find(n=> n.nodeType === 1 && n.localName === 'sectPr') || null;
    nodes.forEach(n=> body.insertBefore(doc.importNode(n, true), sectPr));
  }
  replacePlaceholdersInXmlDoc(doc, ctx);
  zip.file(docPath, new XMLSerializer().serializeToString(doc));

  // Encabezados y pies de página
  for(const path of Object.keys(zip.files).filter(p=> /^word\/(header|footer)\d*\.xml$/.test(p))){
    const hdoc = parser.parseFromString(await zip.file(path).async('string'), 'application/xml');
    if(hdoc.getElementsByTagName('parsererror').length) continue;
    replacePlaceholdersInXmlDoc(hdoc, ctx);
    zip.file(path, new XMLSerializer().serializeToString(hdoc));
  }
  // Si subieron una plantilla .dotx, el resultado debe abrirse como documento normal
  const ctFile = zip.file('[Content_Types].xml');
  if(ctFile){
    const ct = await ctFile.async('string');
    if(ct.includes('wordprocessingml.template.main+xml')){
      zip.file('[Content_Types].xml', ct.replace(/wordprocessingml\.template\.main\+xml/g, 'wordprocessingml.document.main+xml'));
    }
  }
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* ============ PORTAL DEL ESTUDIANTE (consulta desde su propio celular) ============ */
/* Cada tarjeta lleva un QR con un enlace a consulta.html y una clave secreta de 20 caracteres (#t=...).
   El profesor genera un archivo datos-<id>.json y lo sube al repositorio. Ese archivo es público,
   pero cada registro va cifrado (AES-GCM) con una clave derivada de la clave secreta de la tarjeta:
   sin la tarjeta no se puede leer. La clave va en el "#" del enlace, que el navegador nunca envía al servidor. */
const PORTAL_PAGE = 'consulta.html';

function ensurePortalConfig(){
  if(!state.portal) state.portal = { enabled:false, includeObs:false, includeBitacora:false, fileId:null, url:'', lastGenerated:null };
  if(!state.portal.fileId){
    const email = localStorage.getItem('gdrive_email') || '';
    const slug = (email.split('@')[0] || 'profesor').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
    state.portal.fileId = slug || 'profesor';
  }
  return state.portal;
}
function portalDataFileName(){ return 'datos-' + ensurePortalConfig().fileId + '.json'; }
function portalDefaultUrl(){
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return '';
  return location.origin + location.pathname.replace(/[^/]*$/, '') + PORTAL_PAGE;
}
function portalBaseUrl(){
  const p = ensurePortalConfig();
  return (p.url || '').trim() || portalDefaultUrl();
}
function generateWebToken(existing){
  let tok;
  do{
    const rnd = crypto.getRandomValues(new Uint8Array(20));
    tok = Array.from(rnd, b=> CARD_ALPHABET[b % CARD_ALPHABET.length]).join('');
  } while(existing.has(tok));
  existing.add(tok);
  return tok;
}
function ensureWebTokens(){
  const existing = new Set();
  state.groups.forEach(g=> (g.students || []).forEach(s=>{ if(s.webToken) existing.add(s.webToken); }));
  let changed = false;
  state.groups.forEach(g=> (g.students || []).forEach(s=>{
    if(!s.webToken){ s.webToken = generateWebToken(existing); changed = true; }
  }));
  if(changed) saveState();
}
function portalStudentUrl(s){
  return `${portalBaseUrl()}#f=${encodeURIComponent(ensurePortalConfig().fileId)}&t=${s.webToken}`;
}
/* Contenido del QR de una tarjeta: enlace al portal (si está activado) o el código simple */
function cardQrData(s){
  const p = ensurePortalConfig();
  if(p.enabled && s.webToken && portalBaseUrl()) return portalStudentUrl(s);
  return QR_PREFIX + s.card;
}

/* ---- Cifrado ---- */
async function sha256Bytes(str){
  return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
}
function bytesToHex(bytes){ return Array.from(bytes, b=> b.toString(16).padStart(2, '0')).join(''); }
async function encryptForToken(token, obj){
  const id = bytesToHex(await sha256Bytes('rc-id:' + token)).slice(0, 32);
  const key = await crypto.subtle.importKey('raw', await sha256Bytes('rc-key:' + token), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return [id, { iv: arrayBufferToBase64(iv.buffer), ct: arrayBufferToBase64(ct) }];
}

/* ---- Datos de un estudiante para el portal ---- */
function buildPortalPayload(group, s){
  const p = ensurePortalConfig();
  const sid = s.id;
  const stats = computeStudentStats(group, sid);
  const grade = computeStudentFinalGrade(group, sid);
  const period = (state.periods || []).find(x=> x.id === state.activePeriodId);
  const sessions = getActiveSessions(group)
    .filter(se=> (se.entries || []).some(e=> e.studentId === sid))
    .sort((a,b)=> ((a.date||'') + (a.time||'')).localeCompare((b.date||'') + (b.time||'')));
  const clases = sessions.map(se=>{
    const entry = se.entries.find(e=> e.studentId === sid);
    const present = isEntryPresent(entry);
    const inds = se.indicatorSnapshot || group.indicators;
    let obt = 0, max = 0;
    if(present) inds.forEach(ind=>{
      const v = (entry.cotejo || {})[ind.id];
      if(v !== null && v !== undefined){ obt += v; max += (ind.levels || 5); }
    });
    const c = { d: se.date || '', h: se.time || '', p: present ? 1 : 0, o: obt, m: max, pr: se.processId || '' };
    if(p.includeObs && entry.observaciones) c.obs = entry.observaciones;
    return c;
  });
  const evalsSorted = getActiveEvaluations(group);
  const evalItem = e=> ({
    n: e.name, d: e.date || '', nota: computeStudentEvalGrade(e, sid),
    dec: (e.decimasAplicadas && e.decimasAplicadas[sid]) || 0, pr: e.processId || '',
  });
  const evaluaciones = evalsSorted.map(evalItem);
  // Notas agrupadas: cada grupo de calificaciones va con sus notas y su nota de grupo, en el orden de la primera nota del grupo
  const groupUnits = new Map(getGradingUnits(group).filter(u=> u.type === 'group').map(u=> [u.gradeGroup.id, u]));
  const seenGroups = new Set();
  const unidades = [];
  evalsSorted.forEach(e=>{
    if(e.gradeGroupId && groupUnits.has(e.gradeGroupId)){
      if(seenGroups.has(e.gradeGroupId)) return;
      seenGroups.add(e.gradeGroupId);
      const u = groupUnits.get(e.gradeGroupId);
      unidades.push({ t: 'g', n: u.gradeGroup.name, nota: computeUnitGrade(u, sid),
        peso: u.weightType === 'weighted' ? (u.weightPercent || 0) : null,
        items: evalsSorted.filter(x=> x.gradeGroupId === e.gradeGroupId).map(evalItem) });
    } else {
      unidades.push({ t: 'e', ...evalItem(e), peso: e.weightType === 'weighted' ? (e.weightPercent || 0) : null });
    }
  });
  const decimasMovs = getActiveDecimas(group)
    .filter(d=> d.values && d.values[sid])
    .map(d=> ({ d: d.date || '', n: d.note || '', v: d.values[sid] }))
    .sort((a,b)=> a.d.localeCompare(b.d));
  const entregas = getActiveEntregas(group).map(e=>{
    const st = e.estados ? e.estados[sid] : null;
    return { n: e.name, d: e.date || '', e: st || '', pr: e.processId || '', lim: getEntregaEffectiveDeadlineTimestamp(e) };
  });
  // Nota que forman las entregas de cada unidad (evaluaciones vinculadas a entregas)
  const notasEntregas = evalsSorted.filter(e=> e.entregaLink).map(e=> ({
    pr: e.entregaLink.processId || '', n: e.name, nota: computeStudentEvalGrade(e, sid),
  }));
  const payload = {
    nombre: s.name, curso: group.name, periodo: period ? period.name : '',
    generado: new Date().toISOString(),
    asistencia: { presentes: stats.presentCount, ausentes: stats.absentCount, logro: stats.percent, obtenido: stats.obtained, maximo: stats.maxPossible },
    clases,
    notas: { lista: evaluaciones, unidades, final: grade.finalGrade, promedio: grade.promedioSimple },
    decimas: {
      total: computeStudentDecimasTotal(group, sid), aplicadas: computeStudentDecimasApplied(group, sid),
      disponibles: computeStudentDecimasAvailable(group, sid), movs: decimasMovs,
    },
    puntos: {
      ganados: computeStudentPuntosTotal(group, sid), canjeados: computeStudentPuntosRedeemed(group, sid),
      disponibles: computeStudentPuntosAvailable(group, sid),
      movs: kioskMovements(group, sid).map(m=> ({ d: m.date, h: m.time, n: m.text, v: m.amount })),
    },
    premios: (state.premios || []).map(x=> ({ n: x.name, c: x.cost, t: x.type === 'decimas' ? 'd' : 'p' })),
    entregas,
    notasEntregas,
  };
  if(p.includeBitacora){
    // Solo registros dirigidos a este estudiante (los generales del curso pueden mencionar a otros)
    payload.bitacora = getActiveBitacora(group)
      .filter(b=> (b.studentIds || []).includes(sid))
      .sort((a,b)=> (a.date||'').localeCompare(b.date||''))
      .map(b=> ({ d: b.date || '', c: BITACORA_CATEGORIAS[b.categoria || ''] || '', a: b.actividadPedagogica || '', o: b.observaciones || '' }));
  }
  return payload;
}

/* Un curso del estudiante, con una vista por periodo (el portal permite elegir periodo y unidad).
   Cada vista se calcula igual que en la app con ese periodo seleccionado. */
function buildPortalCourse(group, s){
  const saved = state.activePeriodId;
  const periods = state.periods || [];
  const views = [];
  try{
    const list = periods.length ? periods : [null];
    for(const per of list){
      state.activePeriodId = per ? per.id : null;
      const datos = buildPortalPayload(group, s);
      const hasData = datos.clases.length || datos.notas.lista.length || datos.entregas.length || datos.puntos.movs.length || datos.decimas.movs.length;
      const isCurrent = per ? per.id === saved : true;
      if(!hasData && !isCurrent) continue;
      const usedProcs = new Set([...datos.clases, ...datos.notas.lista, ...datos.entregas].map(x=> x.pr).filter(Boolean));
      const procesos = (group.processes || []).filter(pr=> usedProcs.has(pr.id)).map(pr=> ({ id: pr.id, n: pr.name }));
      views.push({ id: per ? per.id : '', n: per ? per.name : '', actual: isCurrent, procesos, datos });
    }
  } finally {
    state.activePeriodId = saved;
  }
  return { curso: group.name, periodos: views };
}

  const pageMsg = pageOk ? '✅ Página de consulta publicada' : '⚠️ No se encontró <strong>consulta.html</strong> en ' + escapeHtml(folder);

function openLinkQr(studentId){
  const group = getActiveGroup();
  if(!ensurePortalConfig().enabled){ showToast('Activa primero el portal en 🌐 Portal'); return; }
  if(!group || group.students.length === 0){ showToast('Este curso no tiene estudiantes'); return; }
  ensureAllCards();
  ensureWebTokens();
  const sid = studentId || group.students[0].id;
  linkQrState = { groupId: group.id, studentId: sid, shown: false };
  renderLinkQr();
}
function closeLinkQr(){
  document.getElementById('linkQrOverlay')?.remove();
  linkQrState = null;
}
function stepLinkQr(dir){
  const group = state.groups.find(g=> g.id === linkQrState.groupId);
  const idx = group.students.findIndex(s=> s.id === linkQrState.studentId);
  const next = group.students[(idx + dir + group.students.length) % group.students.length];
  linkQrState = { ...linkQrState, studentId: next.id, shown: false };
  renderLinkQr();
}
function jumpLinkQr(studentId){
  linkQrState = { ...linkQrState, studentId, shown: false };
  renderLinkQr();
}
function revealLinkQr(){
  linkQrState.shown = !linkQrState.shown;
  renderLinkQr();
}
function renderLinkQr(){
  if(!linkQrState) return;
  const group = state.groups.find(g=> g.id === linkQrState.groupId);
  const s = group && group.students.find(x=> x.id === linkQrState.studentId);
  if(!s){ closeLinkQr(); return; }
  const idx = group.students.indexOf(s);
  let overlay = document.getElementById('linkQrOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'linkQrOverlay';
    overlay.addEventListener('click', e=>{ if(e.target === overlay) closeLinkQr(); });
    document.body.appendChild(overlay);
  }
  const shown = linkQrState.shown;
  overlay.innerHTML = `
    <div class="modal-box app-font link-qr-box">
      <button class="modal-close" onclick="closeLinkQr()">✕</button>
      <div class="muted" style="font-weight:600;">📲 Enlace personal al portal · ${idx + 1} de ${group.students.length}</div>
      <div class="link-qr-name">${escapeHtml(s.name)}</div>
      <div class="muted">${escapeHtml(s.card ? coursesLabelForCard(s.card) : group.name)}</div>
      <div class="link-qr-code${shown ? '' : ' hidden-qr'}" onclick="${shown ? '' : 'revealLinkQr()'}">
        ${qrSvgForData(portalStudentUrl(s))}
        ${shown ? '' : '<div class="link-qr-cover">👁️ Toca para mostrar el QR<br><span>Solo cuando el estudiante esté frente a la pantalla</span></div>'}
      </div>
      <p class="muted" style="font-size:0.85rem; margin:6px 0 0;">${shown
        ? 'Escanea con la cámara de tu celular y abre el enlace. Luego guárdalo en tu <strong>pantalla de inicio</strong> para entrar siempre.'
        : 'Al mostrarlo, el estudiante lo escanea con la cámara de su celular y abre su registro.'}</p>
      <div class="row" style="justify-content:center; gap:6px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="stepLinkQr(-1)">← Anterior</button>
        ${shown ? '<button class="btn btn-outline btn-sm" onclick="revealLinkQr()">🙈 Ocultar</button>' : '<button class="btn btn-accent btn-sm" onclick="revealLinkQr()">👁️ Mostrar QR</button>'}
        <button class="btn btn-accent btn-sm" onclick="stepLinkQr(1)">Siguiente →</button>
      </div>
      <select style="margin-top:10px; width:100%;" onchange="jumpLinkQr(this.value)">
        ${group.students.map(st=> `<option value="${st.id}"${st.id === s.id ? ' selected' : ''}>${escapeHtml(st.name)}</option>`).join('')}
      </select>
      <p class="muted" style="font-size:0.75rem; margin:8px 0 0;">Muestra los datos de tu última publicación (🚀 Publicar ahora).</p>
    </div>`;
}

/* Copia el enlace personal del portal (para enviarlo por WhatsApp, Classroom, etc.) */
async function copyPortalLink(studentId){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  const hadToken = !!s.webToken;
  ensureWebTokens();
  const url = portalStudentUrl(s);
  let ok = false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(url); ok = true; } }catch(e){}
  if(!ok){
    // Alternativa para navegadores sin acceso al portapapeles
    const ta = document.createElement('textarea');
    ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove();
  }
  if(ok){
    showToast(`📋 Enlace de ${s.name} copiado. Pégalo en WhatsApp, Classroom o donde quieras.` + (hadToken ? '' : ' Es nuevo: presiona 🚀 Publicar ahora para que funcione.'));
  } else {
    showCopyLinkFallback(s.name, url);
  }
}
function showCopyLinkFallback(name, url){
  document.getElementById('copyLinkOverlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'copyLinkOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="max-width:480px;">
      <button class="modal-close" onclick="document.getElementById('copyLinkOverlay').remove()">✕</button>
      <h2 style="border:none; padding-bottom:0;">📋 Enlace de ${escapeHtml(name)}</h2>
      <p class="muted">Este navegador no permitió copiar automáticamente. Mantén presionado el enlace (o selecciónalo) y cópialo.</p>
      <textarea readonly rows="3" style="width:100%;" onclick="this.select()">${escapeHtml(url)}</textarea>
    </div>`;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  overlay.querySelector('textarea').select();
}

/* ============ ESTUDIANTES EN VARIOS CURSOS (una sola tarjeta) ============ */
/* Los registros "vinculados" de un mismo estudiante en distintos cursos comparten código de tarjeta y clave del portal.
   Cada curso sigue teniendo sus propios puntos, notas y registros. */

/* Todas las coincidencias de una tarjeta, con el curso activo primero */
function findAllByCard(raw){
  const out = [];
  const ordered = [...state.groups].sort((a,b)=> (a.id === state.activeGroupId ? -1 : 0) - (b.id === state.activeGroupId ? -1 : 0));
  const tm = String(raw || '').match(/[#&?]t=([A-Za-z0-9]{12,})/);
  if(tm){
    const tok = tm[1].toUpperCase();
    ordered.forEach(g=> (g.students || []).forEach(st=>{ if(st.webToken === tok) out.push({ group: g, student: st }); }));
    return out;
  }
  const code = normalizeCardCode(raw);
  if(!code) return out;
  ordered.forEach(g=> (g.students || []).forEach(st=>{ if(st.card === code) out.push({ group: g, student: st }); }));
  return out;
}
/* Registros que comparten tarjeta con este estudiante (incluido él mismo), en el orden de los cursos */
function linkedRecords(student){
  if(!student || !student.card) return [];
  const out = [];
  state.groups.forEach(g=> (g.students || []).forEach(st=>{ if(st.card === student.card) out.push({ group: g, student: st }); }));
  return out;
}
function coursesLabelForCard(code){
  const names = [];
  state.groups.forEach(g=>{ if((g.students || []).some(st=> st.card === code)) names.push(g.name); });
  return names.join(' / ');
}

/* Une varios registros en una sola tarjeta: todos toman el código y la clave del primero */
function linkRecordSet(records){
  if(records.length < 2) return;
  ensureAllCards();
  ensureWebTokens();
  const keeper = records[0].student;
  records.forEach(({ student })=>{
    // Si ya estaba vinculado con otros, esos también pasan a la nueva tarjeta
    const prevCard = student.card;
    state.groups.forEach(g=> (g.students || []).forEach(st=>{
      if(st.card === prevCard){ st.card = keeper.card; st.webToken = keeper.webToken; }
    }));
    if(!keeper.cardAlias && student.cardAlias) keeper.cardAlias = student.cardAlias;
  });
  const all = linkedRecords(keeper);
  all.forEach(({ student })=>{ if(!student.cardAlias && keeper.cardAlias) student.cardAlias = keeper.cardAlias; });
}

function proposeLinks(){
  const byName = new Map();
  state.groups.forEach(g=> (g.students || []).forEach(st=>{
    const key = normalizePersonName(st.name);
    if(!key) return;
    if(!byName.has(key)) byName.set(key, []);
    byName.get(key).push({ group: g, student: st });
  }));
  const proposals = [];
  byName.forEach(records=>{
    const groupsSet = new Set(records.map(r=> r.group.id));
    if(groupsSet.size < 2) return;
    const cards = new Set(records.map(r=> r.student.card));
    if(cards.size === 1 && records[0].student.card) return; // ya vinculados
    proposals.push(records);
  });
  return proposals;
}

/* Vincular a mano (cuando el nombre está escrito distinto en cada curso) */
function openManualLink(studentId){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  const others = [];
  state.groups.forEach(g=>{
    if(g.id === group.id) return;
    (g.students || []).forEach(st=>{ if(!s.card || st.card !== s.card) others.push({ group: g, student: st }); });
  });
  if(others.length === 0){ showToast('No hay estudiantes en otros cursos para vincular'); return; }
  const key = normalizePersonName(s.name).split(' ');
  // Los más parecidos primero (cuántas palabras del nombre comparten)
  const score = st=> normalizePersonName(st.name).split(' ').filter(w=> key.includes(w)).length;
  others.sort((a,b)=> score(b.student) - score(a.student) || a.group.name.localeCompare(b.group.name) || a.student.name.localeCompare(b.student.name));
  document.getElementById('linkWizardOverlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'linkWizardOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="max-width:480px;">
      <button class="modal-close" onclick="document.getElementById('linkWizardOverlay').remove()">✕</button>
      <h2 style="border:none; padding-bottom:0;">🔗 Vincular a ${escapeHtml(s.name)}</h2>
      <p class="muted">Elige su registro en otro curso. Ambos quedarán con la tarjeta de <strong>${escapeHtml(group.name)}</strong> (código ${s.card || 'nuevo'}).</p>
      <select id="manualLinkSelect" style="width:100%;">
        ${others.map((o, i)=> `<option value="${i}">${escapeHtml(o.group.name)} · ${escapeHtml(o.student.name)}</option>`).join('')}
      </select>
      <div class="row" style="justify-content:center; margin-top:12px;">
        <button class="btn btn-accent" id="manualLinkBtn">🔗 Vincular</button>
      </div>
    </div>`;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('manualLinkBtn').onclick = ()=>{
    const o = others[Number(document.getElementById('manualLinkSelect').value)];
    linkRecordSet([{ group, student: s }, o]);
    saveState();
    overlay.remove();
    renderPremios(getActiveGroup());
    showToast(`Vinculado con ${o.group.name}. Imprímele la tarjeta nueva y vuelve a publicar el portal.`);
  };
}

/* Separa a un estudiante de su tarjeta compartida: queda con tarjeta propia */
function unlinkStudent(studentId){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  if(!confirm(`¿Separar a ${s.name} de ${group.name} de su tarjeta compartida?\n\nEn este curso quedará con un código y QR propios (hay que imprimirle una tarjeta para este curso). Su tarjeta actual seguirá funcionando para los otros cursos.`)) return;
  s.card = generateCardCode(allCardCodes());
  const toks = new Set(); state.groups.forEach(g=> (g.students||[]).forEach(x=>{ if(x.webToken) toks.add(x.webToken); }));
  s.webToken = generateWebToken(toks);
  saveState();
  renderPremios(group);
  showToast('Separado. Nuevo código: ' + s.card);
}

function linkedCardHtml(){
  let persons = 0;
  const seen = new Set();
  state.groups.forEach(g=> (g.students || []).forEach(st=>{
    if(!st.card || seen.has(st.card)) return;
    seen.add(st.card);
    if(linkedRecords(st).length > 1) persons++;
  }));
  return `
    <div class="card app-font">
      <h2>Estudiantes en varios cursos</h2>
      <p class="muted">Si un estudiante está en más de un curso (distintas asignaturas), vincúlalo para que use <strong>una sola tarjeta</strong>: en el portal verá todas sus asignaturas, y al escanearlo podrás elegir en qué asignatura suman los puntos. Los puntos, notas y registros siguen separados por curso.</p>

}

/* ============ PUBLICACIÓN DIRECTA EN GITHUB (botón "Publicar ahora") ============ */
/* Sube datos-<id>.json al repositorio con la API de GitHub, usando una llave de acceso (token)
   limitada a ese repositorio. La llave se guarda solo en este dispositivo (no se sincroniza ni va en respaldos). */
function ghTokenKey(){ return 'gh_portal_token::' + (localStorage.getItem('gdrive_email') || 'local'); }
function getGhToken(){ try{ return localStorage.getItem(ghTokenKey()) || ''; }catch(e){ return ''; } }
function setGhToken(t){ try{ if(t) localStorage.setItem(ghTokenKey(), t); else localStorage.removeItem(ghTokenKey()); }catch(e){} }

/* Deduce usuario, repositorio y carpeta desde la dirección de la página de consulta (https://usuario.github.io/repo/…/consulta.html) */
function guessGhRepoFromUrl(url){
  const m = String(url || '').match(/^https:\/\/([A-Za-z0-9-]+)\.github\.io\/(.*)$/i);
  if(!m) return null;
  const owner = m[1];
  const segs = m[2].split(/[?#]/)[0].split('/').filter(Boolean);
  segs.pop(); // quita consulta.html
  if(segs.length === 0) return { owner, repo: owner + '.github.io', folder: '' };
  return { owner, repo: segs[0], folder: segs.slice(1).join('/') };
}
function ghConfig(){
  const p = ensurePortalConfig();
  const guess = guessGhRepoFromUrl(portalBaseUrl()) || {};
  const gh = p.github || {};
  return {
    owner: (gh.owner || guess.owner || '').trim(),
    repo: (gh.repo || guess.repo || '').trim(),
    branch: (gh.branch || '').trim(),
    folder: (gh.folder !== undefined && gh.folder !== null ? gh.folder : (guess.folder || '')).trim().replace(/^\/+|\/+$/g, ''),
  };
}
function ghReady(){ const c = ghConfig(); return !!(getGhToken() && c.owner && c.repo); }

async function ghApi(path, opts){
  const res = await fetch('https://api.github.com' + path, {
    ...(opts || {}),
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + getGhToken(), 'X-GitHub-Api-Version': '2022-11-28', ...((opts && opts.headers) || {}) },
  });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  return { res, body };
}
function ghErrorMessage(res, body){
  const msg = (body && body.message) || '';
  if(res.status === 401) return 'GitHub no aceptó la llave (puede estar mal copiada o vencida). Crea una nueva y pégala en "Conectar GitHub".';
  if(res.status === 403) return 'La llave no tiene permiso para escribir en el repositorio. Revisa que tenga "Contents: Read and write".';
  if(res.status === 404) return 'No se encontró el repositorio o la llave no tiene acceso a él. Revisa usuario, repositorio y que la llave incluya ese repositorio.';
  return 'Error de GitHub (' + res.status + ')' + (msg ? ': ' + msg : '');
}

/* Arma el archivo de datos cifrado (el mismo que se descarga a mano) */
async function buildPortalDataJson(){
  ensureRewardsConfig();
  ensureAllCards();
  ensureWebTokens();
  const entries = {};
  let count = 0;
  // Un registro por tarjeta: si el estudiante está vinculado en varios cursos, lleva todas sus asignaturas
  const byToken = new Map();
  for(const g of state.groups){
    for(const s of (g.students || [])){
      if(!byToken.has(s.webToken)) byToken.set(s.webToken, []);
      byToken.get(s.webToken).push({ g, s });
    }
  }
  for(const [token, recs] of byToken){
    const cursos = recs.map(({ g, s })=> buildPortalCourse(g, s));
    const payload = { v: 3, nombre: recs[0].s.name, generado: new Date().toISOString(), cursos };
    const [id, enc] = await encryptForToken(token, payload);
    entries[id] = enc;
    count++;
  }
  const data = { v: 2, generado: new Date().toISOString(), estudiantes: count, entries };
  return { json: JSON.stringify(data), count, generado: data.generado };
}

let portalPublishing = false;
let portalJustPublishedAt = 0; // evita mostrar la versión anterior mientras GitHub Pages se actualiza
async function publishPortalNow(){
  if(portalPublishing) return;
  if(!window.crypto || !crypto.subtle){ showToast('Para publicar abre la app desde su dirección https (GitHub Pages).'); return; }
  if(!ghReady()){ openGhSetup(); return; }
  const c = ghConfig();
  const p = ensurePortalConfig();
  const path = (c.folder ? c.folder + '/' : '') + portalDataFileName();
  const apiPath = `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  portalPublishing = true;
  setPortalPublishStatus('⏳ Cifrando y publicando…');
  try{
    const { json, count, generado } = await buildPortalDataJson();
    const content = arrayBufferToBase64(new TextEncoder().encode(json).buffer);
    let lastErr = null;
    for(let attempt = 0; attempt < 2; attempt++){
      // Si el archivo ya existe, GitHub pide su identificador (sha) para reemplazarlo
      const ref = c.branch ? '?ref=' + encodeURIComponent(c.branch) : '';
      const cur = await ghApi(apiPath + ref);
      if(!cur.res.ok && cur.res.status !== 404){ throw new Error(ghErrorMessage(cur.res, cur.body)); }
      if(cur.res.status === 404){
        // 404 puede ser "el archivo aún no existe" o "no hay acceso al repositorio": se distingue consultando el repositorio
        const repoCheck = await ghApi(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);
        if(!repoCheck.res.ok) throw new Error(ghErrorMessage(repoCheck.res, repoCheck.body));
      }
      const body = {
        message: `Actualizar datos del portal (${formatDate(toISODate(new Date()))} ${new Date().toTimeString().slice(0,5)})`,
        content,
      };
      if(cur.res.ok && cur.body && cur.body.sha) body.sha = cur.body.sha;
      if(c.branch) body.branch = c.branch;
      const put = await ghApi(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if(put.res.ok){
        p.lastGenerated = generado;
        p.lastPublished = generado;
        saveState();
        portalJustPublishedAt = Date.now();
        if(PUNTOS_TABS.includes(currentTab)) renderPremios(getActiveGroup());
        setPortalPublishStatus(`✅ Publicado (${count} estudiantes). Estará visible para los estudiantes en 1 o 2 minutos.`);
        showToast(`✅ Portal publicado (${count} estudiantes). Visible en 1–2 minutos.`);
        return;
      }
      lastErr = put;
      if(put.res.status !== 409 && put.res.status !== 422) break; // 409/422: otro cambio al mismo tiempo, se reintenta una vez
    }
    throw new Error(ghErrorMessage(lastErr.res, lastErr.body));
  }catch(e){
    console.error(e);
    const msg = (e && e.message) || 'error desconocido';
    setPortalPublishStatus('❌ ' + msg);
    showToast('No se pudo publicar: ' + msg);
  }finally{
    portalPublishing = false;
  }
}
function setPortalPublishStatus(html){
  const el = document.getElementById('portalPublishedStatus');
  if(el) el.innerHTML = html;
}

/* ============ TARJETA DIGITAL (imagen PNG para el celular) ============ */
/* Tiene el mismo QR que la tarjeta impresa: sirve en tu escáner, en el modo consulta y (si el portal está activo)
   su QR abre el portal del estudiante. Usa los colores del diseño de la tarjeta (general o propio del estudiante). */
function digitalCardFor(group, s){
  return { studentId: s.id, name: s.name, course: s.card ? coursesLabelForCard(s.card) : group.name, code: s.card,
    alias: s.cardAlias || '', qr: cardQrData(s), design: s.cardDesign || null };
}
function colorIsDark(hex){
  const m = String(hex || '').match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if(!m) return false;
  const [r, g, b] = [m[1], m[2], m[3]].map(x=> parseInt(x, 16) / 255);
  return (0.299 * r + 0.587 * g + 0.114 * b) < 0.55;
}
function loadImageEl(src){
  return new Promise(res=>{ if(!src){ res(null); return; } const i = new Image(); i.onload = ()=> res(i); i.onerror = ()=> res(null); i.src = src; });
}
function wrapCanvasText(ctx, text, maxW, maxLines){
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width <= maxW || !line) line = test;
    else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  if(lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1] + '…';
    while(ctx.measureText(last).width > maxW && last.length > 2) last = last.slice(0, -2) + '…';
    kept[maxLines - 1] = last;
    return kept;
  }
  return lines;
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

async function renderDigitalCardBlob(card){
  const cfg = state.cardConfig || DEFAULT_CARD_CONFIG;
  const des = effectiveDesign(cfg, card.design);
  const images = await loadCardImagesFor([card]);
  const front = images[card.studentId] && images[card.studentId].front;
  const [logoImg, frontImg] = await Promise.all([loadImageEl(cfg.logo), loadImageEl(front)]);
  const W = 1080, H = 1620, PAD = 70;
  const FONT = 'Calibri, Carlito, "Segoe UI", Roboto, Arial, sans-serif';
  const accent = des.frame !== 'none' ? des.frame : '#2B2A3D';
  const bg = des.bg !== 'none' ? des.bg : '#F6F5FB';
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Fondo y marco
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = bg; roundRectPath(ctx, 28, 28, W - 56, H - 56, 48); ctx.fill();

  // Encabezado (color del marco, o la imagen de frente del estudiante)
  const headH = 300;
  ctx.save(); roundRectPath(ctx, 28, 28, W - 56, headH, 48); ctx.clip();
  ctx.fillStyle = accent; ctx.fillRect(28, 28, W - 56, headH);
  let headText = colorIsDark(accent) ? '#FFFFFF' : '#1A1A1A';
  if(frontImg){
    const scale = Math.max((W - 56) / frontImg.width, headH / frontImg.height);
    const iw = frontImg.width * scale, ih = frontImg.height * scale;
    ctx.drawImage(frontImg, 28 + (W - 56 - iw) / 2, 28 + (headH - ih) / 2, iw, ih);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(28, 28, W - 56, headH);
    headText = '#FFFFFF';
  }
  ctx.restore();
  let hx = PAD + 10;
  if(logoImg){
    const lh = 150, lw = Math.min(220, logoImg.width * (lh / logoImg.height));
    ctx.fillStyle = '#FFFFFF'; roundRectPath(ctx, hx - 12, 28 + (headH - lh) / 2 - 12, lw + 24, lh + 24, 20); ctx.fill();
    ctx.drawImage(logoImg, hx, 28 + (headH - lh) / 2, lw, lh);
    hx += lw + 40;
  }
  ctx.fillStyle = headText; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const headW = W - PAD - 10 - hx;
  ctx.font = `bold 50px ${FONT}`;
  const titleLines = wrapCanvasText(ctx, (cfg.title || 'Tarjeta de puntos').toUpperCase(), headW, 2);
  const schoolLines = cfg.school ? (ctx.font = `36px ${FONT}`, wrapCanvasText(ctx, cfg.school, headW, 2)) : [];
  const blockH = titleLines.length * 58 + schoolLines.length * 44;
  let hy = 28 + headH / 2 - blockH / 2 + 29;
  ctx.font = `bold 50px ${FONT}`; titleLines.forEach(l=>{ ctx.fillText(l, hx, hy); hy += 58; });
  ctx.font = `36px ${FONT}`; schoolLines.forEach(l=>{ ctx.fillText(l, hx, hy - 7); hy += 44; });

  // Nombre, apodo y curso
  ctx.textAlign = 'center'; ctx.fillStyle = '#1A1A1A';
  let y = 28 + headH + 90;
  ctx.font = `bold 76px ${FONT}`;
  wrapCanvasText(ctx, card.name, W - 2 * PAD, 2).forEach(l=>{ ctx.fillText(l, W / 2, y); y += 86; });
  if(cfg.showAlias && card.alias){
    ctx.font = `italic 44px ${FONT}`; ctx.fillStyle = '#444444';
    wrapCanvasText(ctx, '“' + card.alias + '”', W - 2 * PAD, 1).forEach(l=>{ ctx.fillText(l, W / 2, y); y += 56; });
  }
  ctx.font = `40px ${FONT}`; ctx.fillStyle = '#444444';
  wrapCanvasText(ctx, card.course, W - 2 * PAD, 2).forEach(l=>{ ctx.fillText(l, W / 2, y); y += 50; });

  // QR (siempre negro sobre blanco para que se pueda escanear)
  const qr = qrcode(0, 'M');
  qr.addData(card.qr || (QR_PREFIX + card.code));
  qr.make();
  const n = qr.getModuleCount();
  const footerH = 170;
  const avail = Math.min(W - 2 * PAD - 60, H - 28 - footerH - (y + 20));
  const cell = Math.max(4, Math.floor(avail / (n + 8)));
  const qrSize = cell * (n + 8);
  const qx = Math.round((W - qrSize) / 2), qy = Math.round(y + 20 + (avail - qrSize) / 2);
  ctx.fillStyle = '#FFFFFF'; roundRectPath(ctx, qx, qy, qrSize, qrSize, 28); ctx.fill();
  ctx.fillStyle = '#000000';
  for(let r = 0; r < n; r++) for(let col = 0; col < n; col++){
    if(qr.isDark(r, col)) ctx.fillRect(qx + (col + 4) * cell, qy + (r + 4) * cell, cell, cell);
  }

  // Código y pie
  ctx.fillStyle = '#1A1A1A'; ctx.font = `bold 46px Consolas, "Courier New", monospace`;
  ctx.fillText(card.code || '', W / 2, H - 28 - footerH + 45);
  ctx.fillStyle = '#555555'; ctx.font = `32px ${FONT}`;
  ctx.fillText('Muestra este código para sumar puntos o canjear.', W / 2, H - 28 - footerH + 105);
  ctx.fillText('Tarjeta personal: no la compartas.', W / 2, H - 28 - footerH + 145);

  return new Promise(res=> c.toBlob(b=> res(b), 'image/png'));
}
function digitalCardFileName(s){
  // Sin tildes ni ñ: algunos programas muestran mal esos caracteres en nombres de archivo dentro de un ZIP
  const ascii = s.name.trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  return `Tarjeta_${ascii || 'estudiante'}.png`;
}

async function downloadDigitalCardsZip(groupId){
  const group = state.groups.find(g=> g.id === groupId) || getActiveGroup();
  if(!group || group.students.length === 0){ showToast('Este curso no tiene estudiantes'); return; }
  if(typeof JSZip === 'undefined'){ showToast('Se necesita conexión a internet para armar el ZIP.'); return; }
  ensureAllCards();
  if(ensurePortalConfig().enabled) ensureWebTokens();
  showToastQuick('Generando tarjetas digitales…');
  const zip = new JSZip();
  const used = new Set();
  for(const s of group.students){
    let name = digitalCardFileName(s);
    if(used.has(name)) name = name.replace('.png', '_' + s.card + '.png');
    used.add(name);
    zip.file(name, await renderDigitalCardBlob(digitalCardFor(group, s)));
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Tarjetas_digitales_${safeFileName(group.name)}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast(`${group.students.length} tarjeta(s) digital(es) descargada(s) en un ZIP`);
}

/* ============ TAB: ENTREGAS (guías/trabajos: en plazo, fuera de plazo, no entregado) ============ */
const ENTREGA_ESTADOS = {
  en_plazo: { label:'Entregada en plazo', color:{bg:'#E6F8EF', text:'#1F9D64', border:'#B9EBD1'} },
  fuera_plazo: { label:'Entregada fuera de plazo', color:{bg:'#FDF3DE', text:'#C6871A', border:'#F5DFA8'} },
  no_entregada: { label:'No entregada', color:{bg:'#FDECEA', text:'#D8493E', border:'#F5C4BE'} },
};

function getActiveEntregas(group){
  return (group.entregas || []).filter(e=> !state.activePeriodId || e.periodId === state.activePeriodId);
}

// Devuelve {fecha, hora} del plazo de una entrega, o null si no tiene uno configurado.
// Compatible con entregas antiguas que solo guardaban "horaLimite" (implícitamente en la fecha de la guía).
function getEntregaDeadline(entrega){
  const fecha = entrega.plazoFecha || (entrega.horaLimite ? entrega.date : null);
  const hora = entrega.plazoHora || entrega.horaLimite || null;
  if(!fecha || !hora) return null;
  return { fecha, hora };
}

// Momento en que se considera vencida una entrega: usa el plazo configurado si existe,
// o el final del día de la fecha de la guía si no se configuró un plazo específico.
function getEntregaEffectiveDeadlineTimestamp(entrega){
  const dl = getEntregaDeadline(entrega);
  if(dl){
    const [hh, mm] = dl.hora.split(':').map(Number);
    const d = new Date(dl.fecha + 'T00:00:00');
    d.setHours(hh, mm, 0, 0);
    return d.getTime();
  }
  return new Date(entrega.date + 'T23:59:59').getTime();
}

// ¿Sigue abierto el plazo de la entrega? (sin estado + plazo vigente = "En plazo")
function entregaIsOpen(entrega){ return getEntregaEffectiveDeadlineTimestamp(entrega) > Date.now(); }

// Marca automáticamente como "No entregada" a quien no tenga ningún estado una vez vencido el plazo.
// No toca a quien ya tiene un estado (marcado manual o automático previo) — eso se puede seguir editando a mano.
function autoMarkOverdueEntregas(){
  const now = Date.now();
  let changed = false;
  (state.groups || []).forEach(group=>{
    (group.entregas || []).forEach(entrega=>{
      if(getEntregaEffectiveDeadlineTimestamp(entrega) > now) return;
      if(!entrega.estados) entrega.estados = {};
      if(!entrega.fechas) entrega.fechas = {};
      (group.students || []).forEach(s=>{
        if(!entrega.estados[s.id]){
          entrega.estados[s.id] = 'no_entregada';
          entrega.fechas[s.id] = toISODate(new Date());
          changed = true;
        }
      });
    });
  });
  if(changed) saveState();
  return changed;
}

// Cruza con el registro de "Trabajo en clases": ¿estuvo el estudiante presente el día indicado?
// Devuelve true/false si hay clase registrada ese día, o null si no hay ningún registro de clase en esa fecha.
function wasStudentPresentOnDate(group, studentId, dateISO){
  const sessionsOnDate = getActiveSessions(group).filter(s=> s.date === dateISO);
  if(sessionsOnDate.length === 0) return null;
  return sessionsOnDate.some(s=>{
    const entry = s.entries.find(e=> e.studentId === studentId);
    return entry && isEntryPresent(entry);
  });
}

/* ---- Entregas agrupadas por unidad (proceso): cada unidad muestra su nota vinculada ---- */
let entregaUnitOpen = {}; // unidades desplegadas en la lista (se recuerda mientras la app está abierta)
function entregaUnitLabel(name){
  return /^unidad\b/i.test(String(name || '').trim()) ? name : 'Unidad ' + name;
}
// Agrupa las entregas por unidad, en el orden de la entrega más reciente de cada unidad. Las sin unidad van al final.
function groupEntregasByUnit(group, entregas){
  const byId = new Map();
  entregas.forEach(e=>{
    const k = e.processId && (group.processes || []).some(p=> p.id === e.processId) ? e.processId : '';
    if(!byId.has(k)) byId.set(k, []);
    byId.get(k).push(e);
  });
  const out = [...byId.entries()].map(([pid, list])=>{
    const proc = pid ? group.processes.find(p=> p.id === pid) : null;
    return { pid, name: proc ? proc.name : '', list, last: list.reduce((m, e)=> (e.date || '') > m ? (e.date || '') : m, '') };
  });
  out.sort((a,b)=> (!a.pid) - (!b.pid) || b.last.localeCompare(a.last));
  return out;
}
// Notas vinculadas a las entregas de una unidad (pid '' = notas que cuentan todas las entregas del periodo)
function entregaUnitGradeEvals(group, pid){
  return getActiveEvaluations(group).filter(ev=> ev.entregaLink && (ev.entregaLink.processId || '') === pid);
}
function entregasByUnitHtml(group, entregas){
  const units = groupEntregasByUnit(group, entregas);
  const procs = getActiveProcesses(group);
  const onlyNoUnit = units.length === 1 && !units[0].pid;
  const rowHtml = e=>{
    const estados = e.estados || {};
    const counts = { en_plazo:0, fuera_plazo:0, no_entregada:0 };
    Object.values(estados).forEach(v=>{ if(counts[v] !== undefined) counts[v]++; });
    const dl = getEntregaDeadline(e);
    return `
      <div class="student-list-item" style="align-items:flex-start;">
        <div style="min-width:0;">
          <strong>${escapeHtml(e.name)}</strong>
          ${dl ? `<span class="pill" style="margin-left:6px;">🔔 ${formatDate(dl.fecha)} ${dl.hora}</span>` : ''}
          <div class="muted">${formatDate(e.date)} · ✅ ${counts.en_plazo} en plazo · 🟠 ${counts.fuera_plazo} fuera de plazo · 🔴 ${counts.no_entregada} no entregada</div>
          ${procs.length ? `<label class="muted" style="font-size:0.74rem; display:flex; align-items:center; gap:6px; margin-top:4px;">📂
            <select style="width:auto; max-width:220px; font-size:0.78rem; padding:3px 6px;" onchange="setEntregaUnit('${e.id}', this.value)">
              <option value="">Sin unidad</option>
              ${procs.map(p=>`<option value="${p.id}" ${p.id===e.processId?'selected':''}>${escapeHtml(entregaUnitLabel(p.name))}</option>`).join('')}
            </select></label>` : ''}
        </div>
        <div class="row" style="gap:6px;">
          <button class="btn btn-accent btn-sm" onclick="openEntregaValues('${e.id}')">Completar</button>
          <button class="btn btn-outline btn-sm" onclick="openEntregaEditForm('${e.id}')">✎ Datos</button>
          <button class="btn btn-outline btn-sm" onclick="openEntregaDeadlineForm('${e.id}')">🔔 Plazo</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEntrega('${e.id}')">Eliminar</button>
        </div>
      </div>`;
  };
  const hint = procs.length === 0
    ? `<p class="muted" style="font-size:0.78rem;">💡 Para agrupar las entregas por unidad, crea las unidades con <strong>+ Proceso</strong> (en "Más opciones") y asígnaselas a cada entrega.</p>`
    : (onlyNoUnit ? `<p class="muted" style="font-size:0.78rem;">💡 Asigna una unidad a cada entrega (📂) para agruparlas: las de una misma unidad forman una nota.</p>` : '');
  if(onlyNoUnit) return hint + units[0].list.map(rowHtml).join('');
  return hint + units.map((u, i)=>{
    const evs = entregaUnitGradeEvals(group, u.pid);
    const key = u.pid || '_none';
    const open = entregaUnitOpen[key] !== undefined ? entregaUnitOpen[key] : i === 0;
    const title = u.pid ? 'Entregas ' + entregaUnitLabel(u.name) : 'Entregas sin unidad';
    const gradeInfo = !u.pid
      ? '<span class="muted">No forman parte de la nota de ninguna unidad</span>'
      : (evs.length
          ? `<span class="pill" style="background:var(--primary-light); color:var(--primary); border-color:var(--primary-border);">🎯 Nota: ${evs.map(ev=> escapeHtml(ev.name)).join(', ')}</span>`
          : `<button class="btn btn-ink btn-sm" onclick="event.preventDefault(); openEntregasToGradeForm('${u.pid}')">🎯 Convertir en nota</button>`);
    return `
      <details class="entrega-unit" ${open ? 'open' : ''} ontoggle="entregaUnitOpen['${key}'] = this.open">
        <summary>
          <span class="eu-title">📂 ${escapeHtml(title)}</span>
          <span class="muted" style="font-size:0.8rem;">${u.list.length} entrega(s)</span>
          ${gradeInfo}
        </summary>
        <div class="eu-body">${u.list.map(rowHtml).join('')}</div>
      </details>`;
  }).join('');
}
function setEntregaUnit(entregaId, processId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=> e.id === entregaId);
  if(!entrega) return;
  entrega.processId = processId || null;
  if(processId) entregaUnitOpen[processId] = true;
  saveState();
  renderEntregas(group);
  const proc = processId ? group.processes.find(p=> p.id === processId) : null;
  showToast(proc ? '"' + entrega.name + '" quedó en ' + entregaUnitLabel(proc.name) : '"' + entrega.name + '" quedó sin unidad');
}

function computeStudentEntregaStats(group, studentId, entregasList){
  const stats = { en_plazo:0, fuera_plazo:0, no_entregada:0 };
  (entregasList || getActiveEntregas(group)).forEach(e=>{
    const estado = e.estados ? e.estados[studentId] : null;
    if(estado && stats[estado] !== undefined) stats[estado]++;
  });
  return stats;
}

function ensureEntregaDecimaSession(group, entrega){
  if(!group.decimas) group.decimas = [];
  if(entrega.decimaSessionId){
    const existing = group.decimas.find(d=>d.id===entrega.decimaSessionId);
    if(existing) return existing;
  }
  const session = { id: uid(), date: entrega.date, note: 'Entrega: ' + entrega.name, periodId: entrega.periodId, values: {} };
  group.decimas.push(session);
  entrega.decimaSessionId = session.id;
  return session;
}
function syncEntregaDecimaBonus(group, entrega, studentId, awardBonus){
  if(!entrega.decimasBonus) return;
  const session = ensureEntregaDecimaSession(group, entrega);
  if(awardBonus){ session.values[studentId] = entrega.decimasBonus; }
  else { delete session.values[studentId]; }
}

function applyEntregaToggle(entregaId, studentId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  if(!entrega.excepciones) entrega.excepciones = {};

  if(entrega.estados[studentId]){
    delete entrega.estados[studentId];
    delete entrega.fechas[studentId];
    delete entrega.excepciones[studentId];
    syncEntregaDecimaBonus(group, entrega, studentId, false);
  } else {
    const todayISO = toISODate(new Date());
    const estado = todayISO > entrega.date ? 'fuera_plazo' : 'en_plazo';
    entrega.estados[studentId] = estado;
    entrega.fechas[studentId] = todayISO;
    syncEntregaDecimaBonus(group, entrega, studentId, estado === 'en_plazo');
  }
  saveState();
}
// Fija el estado directamente (usado por el desplegable de la Vista general): permite elegir
// cualquiera de los tres estados, o "" para dejarla sin marcar de nuevo.
function setEntregaEstadoDirect(entregaId, studentId, estado){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  if(!entrega.excepciones) entrega.excepciones = {};

  if(!estado){

    delete entrega.fechas[studentId];
    delete entrega.excepciones[studentId];
    syncEntregaDecimaBonus(group, entrega, studentId, false);
  } else {
    entrega.estados[studentId] = estado;
    entrega.fechas[studentId] = entrega.fechas[studentId] || toISODate(new Date());
    if(estado !== 'en_plazo') delete entrega.excepciones[studentId];
    syncEntregaDecimaBonus(group, entrega, studentId, estado === 'en_plazo');
  }
  saveState();
  renderEntregas(group);
}
function applyEntregaException(entregaId, studentId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  if(!entrega.excepciones) entrega.excepciones = {};
  const todayISO = toISODate(new Date());
  entrega.estados[studentId] = 'en_plazo';
  entrega.fechas[studentId] = entrega.fechas[studentId] || todayISO;

function applyEntregaMarkAll(entregaId){
  const group = getActiveGroup();

  saveState();

/* ---- Nota vinculada a entregas: recálculo automático y detalle por estudiante ---- */
const ENTREGA_PUNTOS = { en_plazo: 1, fuera_plazo: 0.5, no_entregada: 0 };

// Entregas que alimentan una evaluación vinculada (mismo período y, si corresponde, mismo proceso)
function getEntregaLinkedEntregas(group, evaluation){
  const link = evaluation.entregaLink;
  if(!link) return [];
  return (group.entregas || [])
    .filter(e=> !link.periodId || e.periodId === link.periodId)
    .filter(e=> !link.processId || e.processId === link.processId)
    .slice()
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}
function getEntregaLinkTotal(group, evaluation){
  const link = evaluation.entregaLink;
  if(link && link.totalFixed) return link.totalFixed;
  return getEntregaLinkedEntregas(group, evaluation).length;
}
function computeEntregaLinkPoints(group, evaluation, studentId){
  let obtained = 0;
  getEntregaLinkedEntregas(group, evaluation).forEach(e=>{
    const estado = e.estados ? e.estados[studentId] : null;
    obtained += ENTREGA_PUNTOS[estado] || 0;
  });
  return obtained;
}
// Recalcula los puntajes de todas las evaluaciones vinculadas a entregas (se llama en cada guardado)
function recomputeEntregaLinkedGrades(){
  (state.groups || []).forEach(group=>{
    (group.evaluations || []).forEach(ev=>{
      if(!ev.entregaLink) return;
      const total = getEntregaLinkTotal(group, ev);
      if(!ev.scores) ev.scores = {};
      ev.totalScore = 100;
      (group.students || []).forEach(s=>{
        const obtained = computeEntregaLinkPoints(group, ev, s.id);
        ev.scores[s.id] = total > 0 ? Math.min(100, Math.round((obtained / total) * 100)) : 0;
      });
    });
  });
}

    const session = group.decimas && group.decimas.find(d=>d.id===entrega.decimaSessionId);
    if(session) session.values = {};
  }
  saveState();
  closeEntregaEditForm();
  renderEntregas(group);
  showToast('Entrega actualizada');
}

function saveEvalScore(evalId, studentId, value){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  if(!ev.scores) ev.scores = {};
  const num = value === '' ? null : Number(value);
  ev.scores[studentId] = (num === null || isNaN(num)) ? null : num;
  saveState();
  renderEvalScores(group, ev);
}

function openEvalOverride(evalId, studentId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  const student = group.students.find(s=>s.id===studentId);
  if(!ev.overrides) ev.overrides = {};
  const current = ev.overrides[studentId] || {};
  const newTotal = prompt(`Puntaje total para ${student ? student.name : 'este estudiante'} (adecuación curricular). Deja vacío para usar el valor por defecto (${ev.totalScore}):`, current.totalScore !== undefined ? current.totalScore : '');
  if(newTotal === null) return;
  const newExigencia = prompt(`% de exigencia para ${student ? student.name : 'este estudiante'}. Deja vacío para usar el valor por defecto (${ev.exigencia}%):`, current.exigencia !== undefined ? current.exigencia : '');
  if(newExigencia === null) return;
  const override = {};
  if(newTotal.trim() !== '' && Number(newTotal) > 0) override.totalScore = Number(newTotal);
  if(newExigencia.trim() !== '' && Number(newExigencia) > 0) override.exigencia = Number(newExigencia);
  if(Object.keys(override).length === 0){
    delete ev.overrides[studentId];
  } else {
    ev.overrides[studentId] = override;
  }
  saveState();
  renderEvalScores(group, ev);
  showToast('Adecuación curricular guardada');
}

/* ============ EXPORTAR CALIFICACIONES A EXCEL (con fórmulas editables) ============ */
function colLetter(n){
  let s = '';
  while(n > 0){
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function addCalificacionesSheet(workbook, group){
  const evals = getActiveEvaluations(group);
  const gradeGroups = getActiveGradeGroups(group);
  if(evals.length === 0 || group.students.length === 0) return false;

  const ws = workbook.addWorksheet('Calificaciones');
  const blockColors = ['F1ECFC','E6F8EF','FDF3DE','E7F1FC','FCEAF3'];

  let col = 2;
  let standaloneColorIdx = 0;
  const blocks = evals.map((ev)=>{
    const scoreCol = col, totalCol = col+1, exigCol = col+2, notaCol = col+3;
    col += 4;
    let color;
    if(ev.gradeGroupId){
      const gg = gradeGroups.find(g=>g.id===ev.gradeGroupId);
      color = gg ? gradeGroupColor(gg.id).bg.replace('#','') : blockColors[0];
    } else {
      color = blockColors[standaloneColorIdx % blockColors.length];
      standaloneColorIdx++;
    }
    return { ev, scoreCol, totalCol, exigCol, notaCol, color };
  });

  // Una columna extra por cada grupo de notas: su "nota sumativa" (promedio de sus evaluaciones miembro)
  const groupSummaryCols = gradeGroups
    .map(gg=>({ gg, memberBlocks: blocks.filter(b=> b.ev.gradeGroupId === gg.id) }))
    .filter(g=> g.memberBlocks.length > 0)
    .map(g=>{ const c = col; col++; return { ...g, col: c }; });

  const promedioCol = col; col++;
  const finalCol = col; col++;

  ws.mergeCells(1,1,2,1);
  const studentHeader = ws.getCell(1,1);
  studentHeader.value = 'Estudiante';
  studentHeader.font = { bold:true, color:{argb:'FF2B2A3D'} };
  studentHeader.alignment = { vertical:'middle', horizontal:'center' };
  studentHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE9E6F5'} };

  blocks.forEach(b=>{
    ws.mergeCells(1, b.scoreCol, 1, b.notaCol);
    const header = ws.getCell(1, b.scoreCol);
    const gg = b.ev.gradeGroupId ? gradeGroups.find(g=>g.id===b.ev.gradeGroupId) : null;
    header.value = `${b.ev.name}${gg ? ' (' + gg.name + ')' : ' (' + (b.ev.weightType === 'weighted' ? 'pondera ' + b.ev.weightPercent + '%' : 'promedio simple') + ')'}`;
    header.font = { bold:true, size:10, color:{argb:'FF2B2A3D'} };
    header.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    for(let c=b.scoreCol; c<=b.notaCol; c++){
      ws.getCell(1,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
      ws.getCell(2,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
    }
    const subHeaders = ['Puntaje','Total','% Exig.','Nota'];
    [b.scoreCol,b.totalCol,b.exigCol,b.notaCol].forEach((c,i)=>{
      const cell = ws.getCell(2,c);
      cell.value = subHeaders[i];
      cell.font = { bold:true, size:9, color:{argb:'FF2B2A3D'} };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    });
  });

  groupSummaryCols.forEach(g=>{
    const groupColorObj = gradeGroupColor(g.gg.id);
    const bgHex = groupColorObj.bg.replace('#','');
    const textHex = groupColorObj.text.replace('#','');
    ws.mergeCells(1, g.col, 2, g.col);
    const cell = ws.getCell(1, g.col);
    cell.value = `${g.gg.name} (nota sumativa · ${g.gg.weightType === 'weighted' ? 'pondera ' + g.gg.weightPercent + '%' : 'promedio simple'})`;
    cell.font = { bold:true, size:9, color:{argb:'FF'+textHex} };
    cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+bgHex} };
  });

  ws.mergeCells(1, promedioCol, 2, promedioCol);
  const promHeader = ws.getCell(1, promedioCol);
  promHeader.value = 'Promedio simple';
  promHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  promHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  promHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  ws.mergeCells(1, finalCol, 2, finalCol);
  const finalHeader = ws.getCell(1, finalCol);
  finalHeader.value = 'Nota final';
  finalHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  finalHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  finalHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  group.students.forEach((student, si)=>{
    const rowNum = 3 + si;
    ws.getCell(rowNum, 1).value = student.name;
    ws.getCell(rowNum, 1).font = { bold:true };

    // notaCellByEvalId: referencia de celda "Nota" de cada evaluación, para poder agruparlas después
    const notaCellByEvalId = {};
    blocks.forEach(b=>{
      const scoreVal = b.ev.scores ? b.ev.scores[student.id] : null;
      const override = b.ev.overrides ? b.ev.overrides[student.id] : null;
      const totalVal = (override && override.totalScore != null) ? override.totalScore : b.ev.totalScore;
      const exigVal = (override && override.exigencia != null) ? override.exigencia : b.ev.exigencia;

      ws.getCell(rowNum, b.scoreCol).value = (scoreVal !== null && scoreVal !== undefined) ? scoreVal : null;
      ws.getCell(rowNum, b.totalCol).value = totalVal;
      ws.getCell(rowNum, b.exigCol).value = exigVal;
      [b.scoreCol, b.totalCol, b.exigCol].forEach(c=>{
        ws.getCell(rowNum, c).alignment = { horizontal:'center', vertical:'middle' };
      });

      const S = colLetter(b.scoreCol) + rowNum;
      const T = colLetter(b.totalCol) + rowNum;
      const E = colLetter(b.exigCol) + rowNum;
      const pExpr = `MIN(1,MAX(0,${S}/${T}))`;
      const exigExpr = `(${E}/100)`;
      const gradeFormula = `ROUND(MIN(7,MAX(1,IF(${pExpr}<=${exigExpr},1+3*(${pExpr}/${exigExpr}),4+3*(${pExpr}-${exigExpr})/(1-${exigExpr})))),1)`;
      const notaCell = ws.getCell(rowNum, b.notaCol);
      notaCell.value = { formula: `IF(OR(${S}="",${T}=0),"",${gradeFormula})` };
      notaCell.alignment = { horizontal:'center', vertical:'middle' };
      notaCell.font = { bold:true };
      notaCellByEvalId[b.ev.id] = colLetter(b.notaCol) + rowNum;
    });

    // Unidades de calificación: evaluaciones sueltas (su propia Nota) + grupos de notas (su columna "sumativa")
    const units = [];
    blocks.filter(b=> !b.ev.gradeGroupId).forEach(b=>{
      units.push({ ref: notaCellByEvalId[b.ev.id], weighted: b.ev.weightType === 'weighted', weightPercent: b.ev.weightPercent || 0 });
    });
    groupSummaryCols.forEach(g=>{
      const memberRefs = g.memberBlocks.map(b=> notaCellByEvalId[b.ev.id]);
      const sumCell = ws.getCell(rowNum, g.col);
      sumCell.value = { formula: `IFERROR(ROUND(AVERAGE(${memberRefs.join(',')}),1),"")` };
      sumCell.alignment = { horizontal:'center', vertical:'middle' };
      sumCell.font = { bold:true };
      units.push({ ref: colLetter(g.col) + rowNum, weighted: g.gg.weightType === 'weighted', weightPercent: g.gg.weightPercent || 0 });
    });

    // Promedio simple: promedio de TODAS las notas individuales (no de las unidades), igual que en la app
    const allNotaRefs = Object.values(notaCellByEvalId);
    const promCell = ws.getCell(rowNum, promedioCol);
    promCell.value = { formula: `IFERROR(ROUND(AVERAGE(${allNotaRefs.join(',')}),1),"")` };
    promCell.alignment = { horizontal:'center', vertical:'middle' };

    // Nota final: pondera las unidades (evaluaciones sueltas ponderadas + grupos ponderados),
    // reparte el % restante entre las unidades de "promedio simple" (sueltas o grupos)
    const weightedUnits = units.filter(u=>u.weighted);
    const simpleUnits = units.filter(u=>!u.weighted);
    const weightTotal = weightedUnits.reduce((s,u)=> s + (u.weightPercent/100), 0);
    const remaining = Math.max(0, 1 - weightTotal);

    let finalFormula;
    if(weightedUnits.length > 0 && simpleUnits.length > 0){
      const weightedTerms = weightedUnits.map(u=> `${u.ref}*${(u.weightPercent/100)}`).join('+');
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})+AVERAGE(${simpleUnits.map(u=>u.ref).join(',')})*${remaining})),1),"")`;
    } else if(weightedUnits.length > 0){
      const weightedTerms = weightedUnits.map(u=> `${u.ref}*${(u.weightPercent/100)}`).join('+');
      const divisor = (weightTotal > 0 && weightTotal < 1) ? `/${weightTotal}` : '';
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})${divisor})),1),"")`;
    } else {
      finalFormula = `IFERROR(ROUND(AVERAGE(${simpleUnits.map(u=>u.ref).join(',')}),1),"")`;
    }
    const finalCellObj = ws.getCell(rowNum, finalCol);
    finalCellObj.value = { formula: finalFormula };
    finalCellObj.alignment = { horizontal:'center', vertical:'middle' };
    finalCellObj.font = { bold:true, color:{argb:'FF6C4EE3'} };
  });

  ws.getColumn(1).width = 22;
  for(let c=2; c<=finalCol; c++){ ws.getColumn(c).width = 11; }
  ws.getRow(1).height = 34;
  ws.getRow(2).height = 26;
  return true;
}
