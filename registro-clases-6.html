/* ============ EXPORTAR A EXCEL (.xlsx con formato, con respaldo CSV sin conexión) ============ */
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportGroupToCSVFallback(group){
  const sessions = getActiveSessions(group).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sessions.length === 0){ showToast('No hay registros para exportar'); return; }

  const indicatorMap = new Map();
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    inds.forEach(ind=>{ if(!indicatorMap.has(ind.id)) indicatorMap.set(ind.id, ind.name); });
  });
  const indicatorIds = [...indicatorMap.keys()];

  const header = ['Fecha','Hora','Estudiante','Asistencia', ...indicatorIds.map(id=>indicatorMap.get(id)), 'Promedio','Observaciones'];
  const rows = [header];

  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    const indIdsInSession = new Set(inds.map(i=>i.id));
    group.students.forEach(student=>{
      const entry = session.entries.find(e=> e.studentId === student.id);
      if(!entry) return;
      const present = isEntryPresent(entry);
      let scoreSum = 0, scoreCount = 0;
      const indicatorValues = indicatorIds.map(id=>{
        if(present && indIdsInSession.has(id)){
          const v = entry.cotejo[id];
          if(v !== null && v !== undefined){ scoreSum += v; scoreCount++; return v; }
        }
        return '';
      });
      const promedio = (present && scoreCount > 0) ? Math.round((scoreSum/scoreCount)*10)/10 : '';
      rows.push([
        formatDate(session.date), session.time, student.name, present ? 'Presente' : 'Ausente',
        ...indicatorValues, promedio, entry.observaciones || ''
      ]);
    });
  });

  const csvContent = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeGroupName = group.name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
  a.href = url;
  a.download = `registro_${safeGroupName}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sin conexión: se exportó un .csv simple (sin colores). Ábrelo con Excel.');
}

function addAsistenciaSheet(workbook, group){
  const sessions = getActiveSessions(group).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sessions.length === 0) return false;

  const ws = workbook.addWorksheet('Asistencia');

  // Unión de todos los indicadores distintos usados en el periodo (por id, evita duplicar si cambió el nombre)
  const indicatorMap = new Map();
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    inds.forEach(ind=>{ if(!indicatorMap.has(ind.id)) indicatorMap.set(ind.id, ind.name); });
  });
  const indicatorIds = [...indicatorMap.keys()];
  const promedioCol = 5 + indicatorIds.length;
  const obsCol = promedioCol + 1;

  const headers = ['Fecha','Hora','Estudiante','Asistencia', ...indicatorIds.map(id=>indicatorMap.get(id)), 'Promedio','Observaciones'];
  headers.forEach((h,i)=>{
    const cell = ws.getCell(1, i+1);
    cell.value = h;
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF6C4EE3'} };
    cell.alignment = { wrapText:true, vertical:'middle' };
  });

  let rowNum = 2;
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    const indIdsInSession = new Set(inds.map(i=>i.id));
    group.students.forEach(student=>{
      const entry = session.entries.find(e=> e.studentId === student.id);
      if(!entry) return; // el estudiante no estaba en el curso al momento de esta clase

      const present = isEntryPresent(entry);
      ws.getCell(rowNum, 1).value = formatDate(session.date);
      ws.getCell(rowNum, 2).value = session.time;
      ws.getCell(rowNum, 3).value = student.name;

      const asistCell = ws.getCell(rowNum, 4);
      asistCell.value = present ? 'Presente' : 'Ausente';
      asistCell.font = present ? { bold:true, color:{argb:'FF22B573'} } : { bold:true, color:{argb:'FFD8493E'} };
      if(!present) asistCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFDECEA'} };

      let scoreSum = 0, scoreCount = 0;
      indicatorIds.forEach((id, i)=>{
        const col = 5 + i;
        if(present && indIdsInSession.has(id)){
          const v = entry.cotejo[id];
          ws.getCell(rowNum, col).value = (v !== null && v !== undefined) ? v : '';
          if(v !== null && v !== undefined){ scoreSum += v; scoreCount++; }
        }
      });

      ws.getCell(rowNum, promedioCol).value = (present && scoreCount > 0) ? Math.round((scoreSum/scoreCount)*10)/10 : '';
      ws.getCell(rowNum, obsCol).value = entry.observaciones || '';
      rowNum++;
    });
  });

  ws.getColumn(1).width = 12;
  ws.getColumn(2).width = 8;
  ws.getColumn(3).width = 24;
  ws.getColumn(4).width = 11;
  for(let i=0;i<indicatorIds.length;i++){ ws.getColumn(5+i).width = 14; }
  ws.getColumn(promedioCol).width = 11;
  ws.getColumn(obsCol).width = 30;
  ws.getRow(1).height = 26;

  // Hoja liviana con el resumen por estudiante (una sola fila cada uno)
  const wsSummary = workbook.addWorksheet('Asistencia - Resumen');
  ['Estudiante','Presentes','Ausentes','Obtenido','Posible','% Logro'].forEach((h,i)=>{
    const cell = wsSummary.getCell(1, i+1);
    cell.value = h;
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF6C4EE3'} };
  });
  group.students.forEach((student, i)=>{
    const stats = computeStudentStats(group, student.id);
    const row = 2 + i;
    wsSummary.getCell(row,1).value = student.name;
    wsSummary.getCell(row,2).value = stats.presentCount;
    wsSummary.getCell(row,3).value = stats.absentCount;
    wsSummary.getCell(row,4).value = stats.obtained;
    wsSummary.getCell(row,5).value = stats.maxPossible;
    wsSummary.getCell(row,6).value = stats.percent === null ? '' : stats.percent + '%';
  });
  wsSummary.getColumn(1).width = 26;
  for(let c=2;c<=6;c++){ wsSummary.getColumn(c).width = 12; }

  return true;
}

function safeFileName(name){
  return name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
}
async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function xmlEscapeWord(str){
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function wordCell(text, opts={}){
  const bold = opts.bold ? '<w:b/>' : '';
  return `<w:tc><w:tcPr></w:tcPr><w:p><w:pPr><w:rPr>${bold}</w:rPr></w:pPr><w:r><w:rPr>${bold}</w:rPr><w:t xml:space="preserve">${xmlEscapeWord(text)}</w:t></w:r></w:p></w:tc>`;
}
function wordRow(cellsHtml){
  return `<w:tr>${cellsHtml}</w:tr>`;
}
function wordHeading(text, size){
  return `<w:p><w:pPr><w:spacing w:before="240" w:after="120"/><w:rPr><w:b/><w:sz w:val="${size}"/></w:rPr></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEscapeWord(text)}</w:t></w:r></w:p>`;
}
function wordParagraph(text){
  return `<w:p><w:r><w:t xml:space="preserve">${xmlEscapeWord(text)}</w:t></w:r></w:p>`;
}
function wordTable(headers, rows, widths){
  const headerRow = wordRow(headers.map(h=> wordCell(h, { bold:true })).join(''));
  const dataRows = rows.map(r=> wordRow(r.map(c=> wordCell(c)).join(''))).join('');
  const grid = widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('');
  return `<w:tbl>
    <w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="5000" w:type="pct"/><w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>
    <w:tblGrid>${grid}</w:tblGrid>
    ${headerRow}
    ${dataRows}
  </w:tbl>`;
}
function wordPageBreak(){
  return `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
}

function buildDocxStylesXml(){
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="22"/><w:color w:val="000000"/></w:rPr></w:rPrDefault>
  </w:docDefaults>
  <w:style w:type="table" w:styleId="TableGrid">
    <w:name w:val="Table Grid"/>
    <w:tblPr><w:tblBorders>
      <w:top w:val="single" w:sz="4" w:color="auto"/>
      <w:left w:val="single" w:sz="4" w:color="auto"/>
      <w:bottom w:val="single" w:sz="4" w:color="auto"/>
      <w:right w:val="single" w:sz="4" w:color="auto"/>
      <w:insideH w:val="single" w:sz="4" w:color="auto"/>

</w:styles>`;

async function buildAndDownloadDocx(documentXml, filename, ctx){
  const blob = await buildDocxBlob(documentXml, ctx);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Usa la plantilla Word del profesor si existe; si no (o si falla), el formato simple */
async function buildDocxBlob(documentXml, ctx){
  ctx = ctx || { nombre: '', curso: (getActiveGroup() || {}).name || '' };
  try{
    const tpl = await getReportTemplateBuffer();
    if(tpl) return await mergeIntoTemplate(tpl, documentXml, ctx);
  }catch(e){
    console.error('Plantilla', e);
    showToast('No se pudo usar la plantilla Word (' + (e.message || 'error') + '); se usó el formato simple.');
  }
  return buildDefaultDocxBlob(documentXml);
}

async function buildDefaultDocxBlob(documentXml){
  const fullDocumentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${documentXml}</w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const documentRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml);
  zip.folder('_rels').file('.rels', relsXml);
  const wordFolder = zip.folder('word');
  wordFolder.file('document.xml', fullDocumentXml);
  wordFolder.file('styles.xml', buildDocxStylesXml());
  wordFolder.folder('_rels').file('document.xml.rels', documentRelsXml);

  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* opts: { omitObs: no incluir observaciones por clase, omitBitacora: no incluir la bitácora } */
function buildStudentHistoryBody(group, student, opts){
  opts = opts || {};
  const studentId = student.id;
  const stats = computeStudentStats(group, studentId);
  const gradeResult = computeStudentFinalGrade(group, studentId);
  const decimasTotal = computeStudentDecimasTotal(group, studentId);
  const decimasApplied = computeStudentDecimasApplied(group, studentId);

  let body = '';
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  let sec = 0;
  const section = (title)=> wordHeading(`${ROMAN[sec++]}. ${title}`, 24);
  body += wordHeading('Informe del estudiante', 32);
  body += wordParagraph(`Estudiante: ${student.name}`);
  body += wordParagraph(`Curso: ${group.name}`);
  body += wordParagraph(`Fecha de emisión: ${formatDate(toISODate(new Date()))}`);
  body += section('Resumen');
  body += wordTable(
    ['Indicador','Valor'],
    [
      ['Clases registradas', String(stats.total)],
      ['Presente', String(stats.presentCount)],
      ['Ausente', String(stats.absentCount)],
      ['Puntaje obtenido', `${stats.obtained} / ${stats.maxPossible}`],
      ['% de logro', stats.percent !== null ? stats.percent + '%' : '-'],
      ['Décimas (acumuladas / aplicadas)', `${decimasTotal} / ${decimasApplied}`],
      ['Puntos (ganados / canjeados / disponibles)', `${computeStudentPuntosTotal(group, studentId)} / ${computeStudentPuntosRedeemed(group, studentId)} / ${computeStudentPuntosAvailable(group, studentId)}`],
      ['Promedio simple (calificaciones)', gradeResult.promedioSimple !== null ? gradeResult.promedioSimple.toFixed(1) : '-'],
      ['Nota final', gradeResult.finalGrade !== null ? gradeResult.finalGrade.toFixed(1) : '-'],
    ],
    [3500,1500]
  );

  const sessions = getActiveSessions(group)
    .filter(s=> s.entries.some(e=>e.studentId===studentId))
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  body += section('Historial de clases');
  if(sessions.length === 0){
    body += wordParagraph('Sin registros.');
  } else {
    const rows = sessions.map(s=>{
      const entry = s.entries.find(e=>e.studentId===studentId);
      const present = isEntryPresent(entry);
      const inds = s.indicatorSnapshot || group.indicators;
      const scores = inds.map(i=> (entry.cotejo || {})[i.id]).filter(v=> v!==null && v!==undefined);
      const total = scores.length ? scores.reduce((a,b)=>a+b,0) : 0;
      const row = [formatDate(s.date), s.time || '', present ? 'Presente' : 'Ausente', present ? String(total) : '-'];
      if(!opts.omitObs) row.push(entry.observaciones || '');
      return row;
    });
    body += opts.omitObs
      ? wordTable(['Fecha','Hora','Asistencia','Puntaje'], rows, [1800,1400,1800,1400])
      : wordTable(['Fecha','Hora','Asistencia','Puntaje','Observaciones'], rows, [1200,1000,1200,1000,2600]);
  }

  const evals = getActiveEvaluations(group);
  body += section('Calificaciones');
  if(evals.length === 0){
    body += wordParagraph('Sin evaluaciones registradas.');
  } else {
    body += wordTable(
      ['Evaluación','Nota'],
      evals.map(e=>{
        const nota = computeStudentEvalGrade(e, studentId);
        return [e.name, nota !== null ? nota.toFixed(1) : '-'];
      }),
      [3500,1500]
    );
  }

  const decimaSessions = getActiveDecimas(group).filter(d=> d.values && d.values[studentId] !== null && d.values[studentId] !== undefined);
  body += section('Décimas');
  if(decimaSessions.length === 0){
    body += wordParagraph('Sin décimas registradas.');
  } else {
    body += wordTable(
      ['Fecha','Motivo','Valor'],
      decimaSessions.map(d=> [formatDate(d.date), d.note || '', String(d.values[studentId])]),
      [1500,2500,1000]
    );
  }

  const puntosSessions = getActivePuntos(group).filter(d=> d.values && d.values[studentId]);
  const canjesStudent = getActiveCanjes(group).filter(c=> c.studentId === studentId);
  body += section('Puntos');
  if(puntosSessions.length === 0 && canjesStudent.length === 0){
    body += wordParagraph('Sin puntos registrados.');
  } else {
    const movs = [
      ...puntosSessions.map(d=> ({ k: (d.date||''), row: [formatDate(d.date), d.note || 'Puntos', '+' + d.values[studentId]] })),
      ...canjesStudent.map(c=> ({ k: (c.date||'') + (c.time||''), row: [formatDate(c.date), 'Canje: ' + c.name, '-' + c.cost] })),
    ].sort((a,b)=> a.k.localeCompare(b.k)).map(m=> m.row);
    body += wordTable(['Fecha','Motivo / canje','Puntos'], movs, [1500,3500,1000]);
  }

  const entregas = getActiveEntregas(group);
  body += section('Entregas');
  if(entregas.length === 0){
    body += wordParagraph('Sin entregas registradas.');
  } else {
    body += wordTable(
      ['Guía / trabajo','Fecha','Estado'],
      entregas.map(e=>{
        const estado = e.estados ? e.estados[studentId] : null;
        return [e.name, formatDate(e.date), estado ? ENTREGA_ESTADOS[estado].label : 'No entregada'];
      }),
      [3000,1500,1500]
    );
  }

  if(opts.omitBitacora) return body;
  const bitacoraEntries = getActiveBitacora(group)
    .filter(e=> (e.studentIds||[]).length === 0 || e.studentIds.includes(studentId))
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  body += section('Bitácora');
  if(bitacoraEntries.length === 0){
    body += wordParagraph('Sin registros de bitácora.');
  } else {
    body += wordTable(
      ['Fecha','Categoría','Actividad pedagógica','Observaciones'],
      bitacoraEntries.map(e=> [formatDate(e.date), BITACORA_CATEGORIAS[e.categoria || ''], e.actividadPedagogica || '', e.observaciones || '']),
      [1200,1300,2500,2500]
    );
  }

  return body;
}

  const body = group.students.map((s, i)=>{
    const studentBody = buildStudentHistoryBody(group, s);
    return i < group.students.length - 1 ? studentBody + wordPageBreak() : studentBody;
  }).join('');
  await buildAndDownloadDocx(body, `historial_completo_${safeFileName(group.name)}_${new Date().toISOString().slice(0,10)}.docx`, { nombre: '', curso: group.name });
  showToast('Word con todo el curso exportado (un estudiante por página)');
}

async function exportAllToExcelPerStudent(group){
  if(typeof ExcelJS === 'undefined'){
    showToast('Se necesita conexión a internet para generar el Excel.');
    return;
  }
  if(group.students.length === 0){ showToast('No hay estudiantes en este curso'); return; }
  showToast('Generando Excel (una hoja por estudiante)…');
  const workbook = new ExcelJS.Workbook();
  const usedNames = new Set();

  group.students.forEach(student=>{
    let base = student.name.replace(/[\\/\?\*\[\]:]/g, '').slice(0, 31).trim() || 'Estudiante';
    let finalName = base;
    let i = 2;
    while(usedNames.has(finalName)){
      finalName = base.slice(0, 28) + '_' + i;
      i++;
    }
    usedNames.add(finalName);
    const ws = workbook.addWorksheet(finalName);

    let row = 1;
    const writeHeading = (text)=>{
      const cell = ws.getCell(row,1);
      cell.value = text;
      cell.font = { bold:true, size:13, color:{argb:'FF6C4EE3'} };
      row += 1;
    };
    const writeTableHeader = (headers)=>{
      headers.forEach((h,i)=>{
        const cell = ws.getCell(row, 1+i);
        cell.value = h;
        cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF6C4EE3'} };
      });
      row += 1;
    };
    const writeRow = (values)=>{
      values.forEach((v,i)=>{ ws.getCell(row, 1+i).value = v; });
      row += 1;
    };

    writeHeading(student.name);
    row += 1;

    writeHeading('Resumen');
    const stats = computeStudentStats(group, student.id);
    const gradeResult = computeStudentFinalGrade(group, student.id);
    const decimasTotal = computeStudentDecimasTotal(group, student.id);
    const decimasApplied = computeStudentDecimasApplied(group, student.id);
    writeTableHeader(['Indicador','Valor']);
    writeRow(['Clases registradas', stats.total]);
    writeRow(['Presente', stats.presentCount]);
    writeRow(['Ausente', stats.absentCount]);
    writeRow(['Puntaje obtenido', `${stats.obtained} / ${stats.maxPossible}`]);
    writeRow(['% de logro', stats.percent !== null ? stats.percent + '%' : '-']);
    writeRow(['Décimas (acumuladas / aplicadas)', `${decimasTotal} / ${decimasApplied}`]);
    writeRow(['Promedio simple', gradeResult.promedioSimple !== null ? gradeResult.promedioSimple.toFixed(1) : '-']);
    writeRow(['Nota final', gradeResult.finalGrade !== null ? gradeResult.finalGrade.toFixed(1) : '-']);
    row += 1;

    writeHeading('Historial de clases');
    const sessions = getActiveSessions(group).filter(s=> s.entries.some(e=>e.studentId===student.id)).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
    if(sessions.length === 0){ writeRow(['Sin registros.']); }
    else {
      writeTableHeader(['Fecha','Hora','Asistencia','Puntaje','Observaciones']);
      sessions.forEach(s=>{
        const entry = s.entries.find(e=>e.studentId===student.id);
        const present = isEntryPresent(entry);
        const inds = s.indicatorSnapshot || group.indicators;
        const scores = inds.map(i=> entry.cotejo[i.id]).filter(v=> v!==null && v!==undefined);
        const total = scores.length ? scores.reduce((a,b)=>a+b,0) : 0;
        writeRow([formatDate(s.date), s.time, present ? 'Presente' : 'Ausente', present ? total : '-', entry.observaciones || '']);
      });
    }
    row += 1;

    writeHeading('Calificaciones');
    const evals = getActiveEvaluations(group);
    if(evals.length === 0){ writeRow(['Sin evaluaciones registradas.']); }
    else {
      writeTableHeader(['Evaluación','Nota']);
      evals.forEach(e=>{
        const nota = computeStudentEvalGrade(e, student.id);
        writeRow([e.name, nota !== null ? nota.toFixed(1) : '-']);
      });
    }
    row += 1;

    writeHeading('Décimas');
    const decimaSessions = getActiveDecimas(group).filter(d=> d.values && d.values[student.id] !== null && d.values[student.id] !== undefined);
    if(decimaSessions.length === 0){ writeRow(['Sin décimas registradas.']); }
    else {
      writeTableHeader(['Fecha','Motivo','Valor']);
      decimaSessions.forEach(d=> writeRow([formatDate(d.date), d.note || '', d.values[student.id]]));
    }
    row += 1;

    writeHeading('Entregas');
    const entregas = getActiveEntregas(group);
    if(entregas.length === 0){ writeRow(['Sin entregas registradas.']); }
    else {
      writeTableHeader(['Guía / trabajo','Fecha','Estado']);
      entregas.forEach(e=>{
        const estado = e.estados ? e.estados[student.id] : null;
        writeRow([e.name, formatDate(e.date), estado ? ENTREGA_ESTADOS[estado].label : 'No entregada']);
      });
    }
    row += 1;

    writeHeading('Bitácora');
    const bitacoraEntries = getActiveBitacora(group).filter(e=> (e.studentIds||[]).length === 0 || e.studentIds.includes(student.id)).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    if(bitacoraEntries.length === 0){ writeRow(['Sin registros de bitácora.']); }
    else {
      writeTableHeader(['Fecha','Categoría','Actividad pedagógica','Observaciones']);
      bitacoraEntries.forEach(e=> writeRow([formatDate(e.date), BITACORA_CATEGORIAS[e.categoria || ''], e.actividadPedagogica || '', e.observaciones || '']));
    }

    ws.getColumn(1).width = 26;
    for(let c=2;c<=5;c++){ ws.getColumn(c).width = 20; }
  });

  await downloadWorkbook(workbook, `curso_por_estudiante_${safeFileName(group.name)}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel exportado (una hoja por estudiante)');
}

/* ============ EXPORTAR CSV SIMPLE (respaldo sin conexión) ============ */
function csvEscapeSimple(val){
  const s = String(val ?? '');
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportSimpleCSV(filenameBase, headers, rows){
  const allRows = [headers, ...rows];
  const csvContent = allRows.map(r=> r.map(csvEscapeSimple).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filenameBase}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Archivo exportado');
}

/* ============ UTILIDADES ============ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

/* ============ RECORDATORIO DE FIN DE CLASE ============ */
function loadReminderSettings(){
  try{
    const raw = localStorage.getItem('reminderSettings');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { enabled: false, minutesBefore: 5 };
}
function saveReminderSettings(settings){
  localStorage.setItem('reminderSettings', JSON.stringify(settings));
}
function getFiredReminders(){
  try{
    const raw = localStorage.getItem('firedReminders');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function markReminderFired(key){
  const fired = getFiredReminders();
  fired[key] = true;
  const todayISO = toISODate(new Date());
  Object.keys(fired).forEach(k=>{ if(!k.endsWith(todayISO)) delete fired[k]; });
  localStorage.setItem('firedReminders', JSON.stringify(fired));
}

function playAlarmSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }, delay);
    };
    beep(0); beep(400); beep(800);
  }catch(e){ console.log('No se pudo reproducir el sonido', e); }
}

let alarmLoopIntervalId = null;

function startAlarmLoop(){
  if(alarmLoopIntervalId) return;
  const pulse = ()=>{
    playAlarmSound();
    if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
  };
  pulse();
  alarmLoopIntervalId = setInterval(pulse, 2200);
}

function stopAlarmLoop(){
  if(alarmLoopIntervalId){
    clearInterval(alarmLoopIntervalId);
    alarmLoopIntervalId = null;
  }
  if(navigator.vibrate) navigator.vibrate(0);
  closeAlarmBanner();
}

function closeAlarmBanner(){
  const overlay = document.getElementById('alarmBannerOverlay');
  if(overlay) overlay.remove();
}

function showAlarmBanner(group, entry, minutesBefore){
  closeAlarmBanner();
  const groupName = group ? group.name : 'Tu clase';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'alarmBannerOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="text-align:center;">
      <div style="font-size:2.4rem;">🔔</div>
      <h2 style="border:none; padding-bottom:0;">${escapeHtml(groupName)}</h2>
      <p class="muted">Termina en ${minutesBefore} minutos — no olvides registrar la clase.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn btn-accent" onclick="stopAlarmAndRegister('${group ? group.id : ''}','${entry.id}')">📝 Registrar ahora</button>
        <button class="btn btn-outline" onclick="stopAlarmLoop()">🔕 Detener alarma</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function stopAlarmAndRegister(groupId, entryId){
  stopAlarmLoop();
  const entry = state.schedule.find(e=>e.id===entryId);
  if(entry) goToClass(entryId);
}

function triggerClassReminder(group, entry, minutesBefore){
  startAlarmLoop();
  showAlarmBanner(group, entry, minutesBefore);
  const groupName = group ? group.name : 'Tu clase';
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Clase por terminar', {
        body: `${groupName} termina en ${minutesBefore} minutos. No olvides registrar la clase.`,
        icon: './icon-192.png'
      });
    }catch(e){}
  }
}

function checkClassReminders(){
  const settings = loadReminderSettings();
  if(!settings.enabled) return;
  const now = new Date();
  const todayISO = toISODate(now);
  const todayWeekday = jsWeekdayToOurDay(now.getDay());
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const fired = getFiredReminders();

  state.schedule.forEach(entry=>{
    if(entry.day !== todayWeekday || !entry.endTime) return;
    const [eh, em] = entry.endTime.split(':').map(Number);
    const endMinutes = eh*60 + em;
    const alertMinutes = endMinutes - (settings.minutesBefore || 5);
    const key = entry.id + '_' + todayISO;
    if(fired[key]) return;
    if(nowMinutes >= alertMinutes && nowMinutes < endMinutes){
      const group = state.groups.find(g=>g.id===entry.groupId);
      triggerClassReminder(group, entry, settings.minutesBefore || 5);
      markReminderFired(key);
    }
  });
}

function showEntregaAlarmBanner(group, entrega, pendientes){
  closeAlarmBanner();
  const dl = getEntregaDeadline(entrega);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'alarmBannerOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="text-align:center;">
      <div style="font-size:2.4rem;">🔔</div>
      <h2 style="border:none; padding-bottom:0;">${escapeHtml(entrega.name)}</h2>
      <p class="muted">${escapeHtml(group.name)} · se cumplió el plazo (${dl ? formatDate(dl.fecha) + ' ' + dl.hora : ''}) y quedan ${pendientes} estudiante(s) sin marcar.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn btn-accent" onclick="stopAlarmAndGoToEntrega('${group.id}','${entrega.id}')">📥 Ir a completar</button>
        <button class="btn btn-outline" onclick="stopAlarmLoop()">🔕 Detener alarma</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function stopAlarmAndGoToEntrega(groupId, entregaId){
  stopAlarmLoop();
  entregaActiveId = entregaId;
  goToEntregasForGroup(groupId);
}
function triggerEntregaReminder(group, entrega, pendientes){
  startAlarmLoop();
  showEntregaAlarmBanner(group, entrega, pendientes);
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Plazo de entrega cumplido', {
        body: `${entrega.name} (${group.name}): quedan ${pendientes} estudiante(s) sin marcar.`,
        icon: './icon-192.png'
      });
    }catch(e){}
  }
}
function checkEntregaReminders(){
  const settings = loadReminderSettings();
  if(!settings.enabled) return;
  const now = new Date();
  const todayISO = toISODate(now);
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const fired = getFiredReminders();

  state.groups.forEach(group=>{
    (group.entregas || []).forEach(entrega=>{
      const dl = getEntregaDeadline(entrega);
      if(!dl || dl.fecha !== todayISO) return;
      const [hh, mm] = dl.hora.split(':').map(Number);
      const limitMinutes = hh*60 + mm;
      if(nowMinutes < limitMinutes) return;
      const key = 'entrega_' + entrega.id + '_' + todayISO;
      if(fired[key]) return;
      const marcados = entrega.estados ? Object.keys(entrega.estados).length : 0;
      const pendientes = Math.max(0, group.students.length - marcados);
      if(pendientes > 0){
        triggerEntregaReminder(group, entrega, pendientes);
      }
      markReminderFired(key);
    });
  });
}

function openReminderSettings(){
  const settings = loadReminderSettings();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'reminderModalOverlay';

      <label style="margin-top:10px; display:flex; align-items:center; gap:8px;">

      </div>
      <p class="muted" style="font-size:0.74rem; margin-top:10px;">Solo funciona mientras la app esté abierta (en primer o segundo plano) — si la cierras por completo, no sonará. La vibración solo está disponible en Android (Chrome), no en iPhone. Además, solo avisa para clases que tengan configurada una "Hora de término" en el Horario.</p>
    </div>
  `;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeReminderSettings(); });
  document.body.appendChild(overlay);
}
function closeReminderSettings(){
  const overlay = document.getElementById('reminderModalOverlay');
  if(overlay) overlay.remove();
}
function saveReminderSettingsFromModal(){
  const enabled = document.getElementById('reminderEnabled').checked;

    Notification.requestPermission();
  }

/* ============ TEMA CLARO / OSCURO ============ */
function applyThemeIcon(){
  const btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('themePreference', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('themePreference', 'dark');
  }
  applyThemeIcon();
  applyThemeColor(loadThemeColorName());
}

/* ============ COLOR DEL TEMA ============ */
const THEME_COLOR_LABELS = {
  purple: '🟣 Morado (original)',
  blue: '🔵 Azul',
  green: '🟢 Verde',
  orange: '🟠 Naranjo',
  pink: '🌸 Rosa',
  teal: '🩵 Teal',
  red: '🔴 Rojo',
  indigo: '🔷 Índigo',
  gold: '🟡 Dorado',
  cyan: '🩵 Cian',
  lime: '🟢 Lima',
  brown: '🟤 Terracota',
};
function loadThemeColorName(){
  return localStorage.getItem('themeColorName') || 'purple';
}
function applyThemeColor(colorName){
  const preset = THEME_COLOR_PRESETS[colorName] || THEME_COLOR_PRESETS.purple;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const vars = isDark ? preset.dark : preset.light;
  const root = document.documentElement.style;
  root.setProperty('--primary', vars.primary);
  root.setProperty('--primary-dark', vars.primaryDark);
  root.setProperty('--primary-light', vars.primaryLight);
  root.setProperty('--primary-border', vars.primaryBorder);
}
function changeThemeColor(colorName){
  localStorage.setItem('themeColorName', colorName);
  applyThemeColor(colorName);
  closeThemeColorPicker();
  showToast('Color del tema actualizado');
}
function openThemeColorPicker(){

        ${Object.keys(THEME_COLOR_PRESETS).map(name=>{

              ${THEME_COLOR_LABELS[name]}${isActive ? ' ✓' : ''}
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeThemeColorPicker(); });
  document.body.appendChild(overlay);
}
function closeThemeColorPicker(){
  const overlay = document.getElementById('themeColorPickerOverlay');
  if(overlay) overlay.remove();
}
