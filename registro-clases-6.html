          <button class="btn btn-outline btn-sm" onclick="toggleAllIndicators(getActiveGroup(), ${selectedIndicators.length < group.indicators.length})">

          <button class="btn btn-accent btn-sm" onclick="openQuickIndicatorForm()">+ Nuevo indicador</button>
        </div>
      </div>
      <p class="muted">Elige del banco de indicadores cuáles aplican a esta clase específica.</p>
      ${indicatorThemes.length > 0 ? `
        <label style="margin-top:6px;">Filtrar por unidad/tema</label>
        <select onchange="changeRegistrarThemeFilter(this.value)">
          <option value="">Todos los temas</option>

      <div style="margin-top:8px;">
        ${indicatorsToShow.length === 0 ? '<p class="muted">No hay indicadores para este tema. Crea uno con "+ Nuevo indicador".</p>' :

                <td><input type="checkbox" data-attendance-student="${s.id}" style="width:auto;" ${wasPresent ? 'checked' : ''}></td>

      <div style="overflow-x:auto;">

function entregaCellHtml(entrega, studentId){
  const estado = entrega.estados ? entrega.estados[studentId] : null;
  const info = estado ? ENTREGA_ESTADOS[estado] : null;
  return `
    <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
      <button class="btn btn-sm" style="${info ? `background:${info.color.bg}; color:${info.color.text}; border:1px solid ${info.color.border};` : ''}" onclick="toggleEntregaDeliveredInline('${entrega.id}','${studentId}')">
        ${info ? info.label : (entregaIsOpen(entrega) ? '⏳ En plazo · Marcar' : '⬜ Marcar')}
      </button>
      ${estado !== 'en_plazo' ? `<button class="btn btn-outline btn-sm" onclick="markEntregaExceptionInline('${entrega.id}','${studentId}')" title="Marcar en plazo por excepción">🔓</button>` : ''}
    </div>
  `;
}

function toggleAttendanceOnlyMode(checked){

function markAllMaxScores(){
  const group = getActiveGroup();
  const selectedIndicators = group.indicators.filter(i=> registrarIndicatorSelection.includes(i.id));
  group.students.forEach(s=>{
    selectedIndicators.forEach(ind=>{
      const sel = document.querySelector(`select[data-student="${s.id}"][data-indicator="${ind.id}"]`);
      if(sel) sel.value = String(ind.levels || 5);
    });
  });
  showToast('Todos marcados con la nota máxima. Ajusta las excepciones.');
}

function repeatLastClass(){
  const group = getActiveGroup();
  const excludeId = registrarCurrentSessionToEdit ? registrarCurrentSessionToEdit.id : null;
  const sessions = getActiveSessions(group)
    .filter(s=> s.id !== excludeId)
    .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  const last = sessions[0];
  if(!last){ showToast('No hay una clase anterior para repetir'); return; }

  const lastIndIds = (last.indicatorSnapshot || []).map(i=>i.id).filter(id=> group.indicators.some(ind=>ind.id===id));
  if(lastIndIds.length){
    registrarIndicatorSelection = lastIndIds;
    renderRegistrar(group, registrarCurrentSessionToEdit, registrarCurrentPrefill);
  }

  setTimeout(()=>{
    group.students.forEach(s=>{
      const prevEntry = last.entries.find(e=>e.studentId===s.id);
      if(!prevEntry) return;
      registrarIndicatorSelection.forEach(indId=>{
        const sel = document.querySelector(`select[data-student="${s.id}"][data-indicator="${indId}"]`);
        if(sel && prevEntry.cotejo[indId] !== undefined && prevEntry.cotejo[indId] !== null){
          sel.value = String(prevEntry.cotejo[indId]);
        }
      });
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      if(obsEl && prevEntry.observaciones) obsEl.value = prevEntry.observaciones;
    });
    showToast('Se copiaron los valores de la clase anterior (' + formatDate(last.date) + ')');
  }, 30);
}

function handleSaveSession(){
  const group = getActiveGroup();
  const sessionToEdit = registrarCurrentSessionToEdit;
  const isEdit = !!sessionToEdit;
  const selectedIndicators = group.indicators.filter(i=> registrarIndicatorSelection.includes(i.id));

  const date = document.getElementById('sessionDate').value;
  const time = document.getElementById('sessionTime').value;
  const selectedProcessId = document.getElementById('sessionProcess').value || null;
  if(!date || !time){ showToast('Indica fecha y horario'); return; }
  if(!registrarAttendanceOnly && selectedIndicators.length === 0){
    showToast('Selecciona al menos un indicador, o activa "Registrar solo asistencia"');
    return;
  }

  const currentStudentIds = new Set(group.students.map(s=>s.id));
  let newEntries, indicatorSnapshot;

  if(registrarAttendanceOnly){
    newEntries = group.students.map(s=>{
      const checkbox = document.querySelector(`input[type="checkbox"][data-attendance-student="${s.id}"]`);
      const presente = checkbox ? checkbox.checked : true;
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      return { studentId: s.id, cotejo: {}, presente, observaciones: obsEl ? obsEl.value.trim() : '' };
    });
    indicatorSnapshot = [];
  } else {
    newEntries = group.students.map(s=>{
      const cotejo = {};
      selectedIndicators.forEach(ind=>{
        const sel = document.querySelector(`select[data-student="${s.id}"][data-indicator="${ind.id}"]`);
        cotejo[ind.id] = sel && sel.value ? Number(sel.value) : null;
      });
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      return { studentId: s.id, cotejo, observaciones: obsEl ? obsEl.value.trim() : '' };
    });
    indicatorSnapshot = selectedIndicators.map(i=>({id:i.id, name:i.name, levels:i.levels || 5}));
  }

  // Conservar datos de estudiantes que ya no están en el grupo pero tenían registro previo
  const preservedEntries = isEdit ? sessionToEdit.entries.filter(e=> !currentStudentIds.has(e.studentId)) : [];
  const entries = [...newEntries, ...preservedEntries];

  if(isEdit){
    const idx = group.sessions.findIndex(s=>s.id===sessionToEdit.id);
    if(idx !== -1){
      group.sessions[idx] = { ...group.sessions[idx], date, time, entries, indicatorSnapshot, processId: selectedProcessId };
    }
    showToast('Registro actualizado correctamente');
  } else {
    group.sessions.push({ id: uid(), date, time, entries, indicatorSnapshot, periodId: state.activePeriodId, processId: selectedProcessId });
    showToast('Clase registrada correctamente');
  }
  if(!registrarAttendanceOnly) group.lastUsedIndicatorIds = registrarIndicatorSelection.slice();
  saveState();
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  goToTab('historial');
}

function editSession(sessionId){
  const group = getActiveGroup();
  const session = group.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  currentTab = 'registrar';
  currentModule = moduleForTab('registrar');
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  renderNav();
  renderRegistrar(group, session);
}

function deleteSession(id){
  const group = getActiveGroup();
  if(!confirm('¿Eliminar este registro de clase?')) return;
  group.sessions = group.sessions.filter(s=>s.id!==id);
  saveState();
  renderHistorial(group);
}

/* ============ TAB: DÉCIMAS (puntos extra) ============ */
function computeStudentDecimasTotal(group, studentId){
  const entries = getActiveDecimas(group);
  let total = 0;
  entries.forEach(d=>{
    if(d.values){
      total += (d.values[studentId] || 0);
    } else if(d.studentId === studentId){
      total += (d.value || 0);
    }
  });
  return Math.round(total * 10) / 10;
}

function computeStudentDecimasApplied(group, studentId){
  let total = 0;
  getActiveEvaluations(group).forEach(ev=>{
    const amt = ev.decimasAplicadas ? ev.decimasAplicadas[studentId] : null;
    if(amt) total += amt;
  });
  return Math.round(total * 10) / 10;
}

function computeStudentDecimasAvailable(group, studentId){
  return Math.round((computeStudentDecimasTotal(group, studentId) - computeStudentDecimasApplied(group, studentId)) * 10) / 10;
}

function applyDecimasToEval(studentId){
  const group = getActiveGroup();
  const evalId = document.getElementById('decimasApplyEval').value;
  const amount = Number(document.getElementById('decimasApplyAmount').value);
  if(!evalId){ showToast('Selecciona una evaluación'); return; }
  if(!amount || amount <= 0){ showToast('Ingresa una cantidad de décimas válida'); return; }
  const available = computeStudentDecimasAvailable(group, studentId);
  if(amount > available + 0.001){ showToast('No tiene suficientes décimas disponibles (dispone de ' + available.toFixed(1) + ')'); return; }
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  if(!ev.decimasAplicadas) ev.decimasAplicadas = {};
  ev.decimasAplicadas[studentId] = Math.round(((ev.decimasAplicadas[studentId] || 0) + amount) * 10) / 10;
  saveState();
  openStudentDetail(studentId);
  showToast('Décimas aplicadas a "' + ev.name + '"');
}

function removeDecimasFromEval(studentId, evalId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev || !ev.decimasAplicadas) return;
  delete ev.decimasAplicadas[studentId];
  saveState();
  openStudentDetail(studentId);
  showToast('Se revirtió la aplicación de décimas — volvieron a estar disponibles');
}

/* ============ APLICAR DÉCIMAS A UNA EVALUACIÓN (vista rápida, todos los estudiantes) ============ */
function openDecimasBulkForm(evalId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  const evaluations = getActiveEvaluations(group);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'decimasBulkFormOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="max-width:540px;">
      <button class="modal-close" onclick="closeDecimasBulkForm()">✕</button>
      <h2 style="border:none; padding-bottom:0;">🎯 Aplicar décimas</h2>
      <p class="muted">"${escapeHtml(ev.name)}" · 1 décima = 0,1 en la nota.</p>

      <p class="muted" style="font-weight:600; margin-top:10px; margin-bottom:4px;">¿Qué evaluación necesita décimas?</p>
      <div style="display:flex; flex-direction:column; gap:4px; max-height:130px; overflow-y:auto;">
        ${evaluations.map(otherEv=>{
          let reprobados = 0, pendientes = 0;
          group.students.forEach(s=>{
            const nota = computeStudentEvalGrade(otherEv, s.id);
            if(nota === null) pendientes++;
            else if(nota < 4) reprobados++;
          });
          const isActive = otherEv.id === evalId;
          return `
            <button class="btn btn-sm ${isActive ? 'btn-accent' : 'btn-outline'}" style="display:flex; justify-content:space-between; align-items:center;" onclick="openDecimasBulkForm('${otherEv.id}')">
              <span>${escapeHtml(otherEv.name)}</span>
              <span>${reprobados > 0 ? `🔴 ${reprobados}` : ''}${pendientes > 0 ? ` ⏳ ${pendientes}` : ''}${reprobados===0 && pendientes===0 ? '✅' : ''}</span>
            </button>
          `;
        }).join('')}
      </div>

      <p class="muted" style="font-weight:600; margin-top:10px; margin-bottom:4px;">Décimas por estudiante (total · usadas · restantes)</p>
      <div style="display:flex; flex-wrap:wrap; gap:6px; max-height:110px; overflow-y:auto;">
        ${group.students.map(s=>{
          const total = computeStudentDecimasTotal(group, s.id);
          const usadas = computeStudentDecimasApplied(group, s.id);
          const disponible = computeStudentDecimasAvailable(group, s.id);
          return `<span class="pill" style="${disponible>0 ? 'color:var(--success); border-color:var(--success-border); background:var(--success-light);' : ''}">${escapeHtml(s.name)}: ${total} · ${usadas} · ${disponible}</span>`;
        }).join('')}
      </div>

      <div class="row" style="margin:10px 0;">
        <button class="btn btn-ink btn-sm" onclick="applyDecimasBulkAllAvailable('${evalId}')" title="A cada estudiante le aplica solo lo necesario para llegar a la nota 7,0 (o el máximo disponible si no le alcanza) — a quien ya está en 7,0 no se le toca nada, y nunca se desperdician décimas de más">🎯 Aplicar el máximo necesario (tope 7,0)</button>
      </div>
      <div style="max-height:40vh; overflow-y:auto;">
      <table>
        <thead><tr><th>Estudiante</th><th>Disp.</th><th>Aquí</th><th>Aplicar</th></tr></thead>
        <tbody>
          ${group.students.map(s=>{
            const disponible = computeStudentDecimasAvailable(group, s.id);
            const aplicadasAqui = (ev.decimasAplicadas && ev.decimasAplicadas[s.id]) || 0;
            return `
              <tr>
                <td>${escapeHtml(s.name)}</td>
                <td style="color:var(--success); font-weight:700;">${disponible}</td>
                <td>${aplicadasAqui || '-'}</td>
                <td>
                  <div class="row" style="gap:4px; flex-wrap:nowrap;">
                    <input type="number" id="decBulkAmt-${s.id}" step="1" min="0" max="${disponible}" value="${disponible > 0 ? Math.min(disponible,1) : 0}" style="width:56px;" ${disponible<=0 ? 'disabled' : ''}>
                    <button class="btn btn-accent btn-sm" onclick="applyDecimasBulkRow('${evalId}','${s.id}')" ${disponible<=0 ? 'disabled' : ''}>+</button>
                    ${aplicadasAqui ? `<button class="btn btn-outline btn-sm" onclick="removeDecimasBulkRow('${evalId}','${s.id}')">↩️</button>` : ''}
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeDecimasBulkForm(){
  const overlay = document.getElementById('decimasBulkFormOverlay');
  if(overlay) overlay.remove();
}
function applyDecimasBulkRow(evalId, studentId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  const input = document.getElementById(`decBulkAmt-${studentId}`);
  const amount = Number(input.value);
  if(!amount || amount <= 0){ showToast('Ingresa una cantidad válida'); return; }
  const available = computeStudentDecimasAvailable(group, studentId);
  if(amount > available + 0.001){ showToast('No tiene suficientes décimas disponibles (dispone de ' + available + ')'); return; }
  if(!ev.decimasAplicadas) ev.decimasAplicadas = {};
  ev.decimasAplicadas[studentId] = Math.round(((ev.decimasAplicadas[studentId] || 0) + amount) * 10) / 10;
  saveState();
  openDecimasBulkForm(evalId);
}
function removeDecimasBulkRow(evalId, studentId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev || !ev.decimasAplicadas) return;
  delete ev.decimasAplicadas[studentId];
  saveState();
  openDecimasBulkForm(evalId);
}
function applyDecimasBulkAllAvailable(evalId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  if(!ev.decimasAplicadas) ev.decimasAplicadas = {};
  let count = 0, skippedNoNeed = 0, skippedNoDecimas = 0;
  group.students.forEach(s=>{
    const currentGrade = computeStudentEvalGrade(ev, s.id);
    if(currentGrade === null) return; // sin puntaje aún: no hay nota que corregir
    const roundedGrade = Math.round(currentGrade * 10) / 10; // la misma nota que se muestra en pantalla (1 decimal)
    if(roundedGrade >= 7.0){ skippedNoNeed++; return; } // ya se ve como 7.0: no se le aplica nada
    const available = computeStudentDecimasAvailable(group, s.id);
    if(available <= 0){ skippedNoDecimas++; return; } // no tiene décimas: no se le aplica nada
    const deficit = Math.round((7.0 - roundedGrade) * 100) / 100; // lo que le falta para llegar al techo (7.0), sobre la nota ya redondeada
    const needed = Math.ceil(deficit * 10 - 1e-9); // décimas necesarias para llegar justo a 7.0, sin pasarse ni desperdiciar
    const toApply = Math.min(needed, available); // nunca más de lo que necesita, ni más de lo disponible
    if(toApply <= 0) return; // por seguridad: si el cálculo da 0, no se toca nada
    ev.decimasAplicadas[s.id] = Math.round(((ev.decimasAplicadas[s.id] || 0) + toApply) * 10) / 10;
    count++;
  });
  saveState();
  openDecimasBulkForm(evalId);
  showToast(count > 0
    ? `Se aplicó el máximo necesario a ${count} estudiante(s), sin pasarse del 7,0 ni desperdiciar décimas`
    : 'Nadie necesitaba décimas (ya estaban en el 7,0, no tenían puntaje, o no tenían décimas disponibles)');
}

function openDecimaValues(sessionId){

}
function closeDecimaValues(){

}

function renderDecimaValues(group, session){

      <div class="row" style="margin-bottom:10px;">
        <input type="number" id="decimaBulkValue" step="1" placeholder="Cantidad" style="width:100px;">

          }).join('')}

function applyDecimaToAll(sessionId){
  const group = getActiveGroup();
  const session = group.decimas.find(d=>d.id===sessionId);
  if(!session) return;
  const raw = document.getElementById('decimaBulkValue').value;
  const value = raw === '' ? null : Number(raw);
  if(value === null || isNaN(value)){ showToast('Ingresa un valor primero'); return; }
  if(!session.values) session.values = {};
  group.students.forEach(s=>{ session.values[s.id] = value; });
  saveState();
  renderDecimaValues(group, session);
  showToast('Se asignó ' + value + ' a todo el curso');
}

function saveDecimaValue(sessionId, studentId, value){
  const group = getActiveGroup();
  const session = group.decimas.find(d=>d.id===sessionId);
  if(!session) return;
  if(!session.values) session.values = {};
  const num = value === '' ? null : Number(value);
  session.values[studentId] = (num === null || isNaN(num)) ? null : num;
  saveState();
}

function deleteDecima(id){
  const group = getActiveGroup();
  if(!confirm('¿Eliminar este registro de décimas?')) return;
  group.decimas = group.decimas.filter(d=>d.id!==id);
  if(decActiveSessionId === id) decActiveSessionId = null;
  saveState();
  renderDecimas(group);
}

/* ============ TARJETAS QR, PUNTOS Y CANJES ============ */
/* Al escanear se asignan PUNTOS (moneda aparte de las décimas).
   Los puntos se canjean por premios o por décimas; las décimas obtenidas por canje
   quedan registradas en el módulo Décimas (motivo "Canje de puntos"). */
const QR_PREFIX = 'RCQR:';
const CARD_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin 0/O ni 1/I para evitar confusiones al escribir el código a mano
const SCAN_QUICK_AMOUNTS = [1, 2, 5];
const CANJE_DECIMAS_NOTE = 'Canje de puntos';
const DEFAULT_MOTIVOS = [
  { id:'mot_participacion', name:'Participación', value:1 },
  { id:'mot_ayuda', name:'Ayuda a un compañero', value:2 },
  { id:'mot_trabajo', name:'Trabajo destacado', value:3 },
  { id:'mot_convivencia', name:'Buena convivencia', value:1 },
];
const DEFAULT_PREMIOS = [
  { id:'pre_dec1', name:'1 décima', cost:5, type:'decimas', decimas:1 },
  { id:'pre_dec3', name:'3 décimas', cost:12, type:'decimas', decimas:3 },
  { id:'pre_puesto', name:'Elegir puesto por una clase', cost:10, type:'premio' },
  { id:'pre_musica', name:'Elegir la música de la clase', cost:10, type:'premio' },
  { id:'pre_tiempo', name:'10 minutos extra en una evaluación', cost:15, type:'premio' },
  { id:'pre_comodin', name:'Comodín: una tarea sin entregar', cost:25, type:'premio' },
];
const DEFAULT_CARD_CONFIG = { size:'estandar', title:'Tarjeta de puntos', school:'', logo:null, decorate:false, showAlias:true, frame:'none', backside:true };
const CARD_SIZES = {
  estandar: { label:'Estándar · 8 por hoja', perPage:8 },
  pequena: { label:'Pequeña · 10 por hoja', perPage:10 },
  carnet: { label:'Carnet vertical (para colgar) · 4 por hoja', perPage:4 },
};
const CARD_FRAMES = [
  ['none','Sin color'], ['#A8D5BA','Verde'], ['#F6C6A8','Durazno'], ['#A9CCE3','Celeste'],
  ['#C9B6E4','Lila'], ['#F7E1A0','Amarillo'], ['#F4B6C2','Rosado'], ['#76C7B7','Turquesa'],
  ['#E59866','Naranjo'], ['#7FA7D9','Azul'], ['#2E5E4E','Verde oscuro'], ['#1F3A5F','Azul marino'],
  ['#7A1F3D','Burdeo'], ['#555555','Gris oscuro'],
];

function ensureRewardsConfig(){
  if(!Array.isArray(state.decimaMotivos)) state.decimaMotivos = JSON.parse(JSON.stringify(DEFAULT_MOTIVOS));
  if(!Array.isArray(state.premios)) state.premios = JSON.parse(JSON.stringify(DEFAULT_PREMIOS));
  if(!state.premiosV2){
    // Versión anterior: los premios no tenían tipo. Se marcan como premio y se agregan las opciones de canje por décimas.
    state.premios.forEach(p=>{ if(!p.type) p.type = 'premio'; });
    if(!state.premios.some(p=> p.type === 'decimas')){
      state.premios.unshift(...JSON.parse(JSON.stringify(DEFAULT_PREMIOS.filter(p=> p.type === 'decimas'))));
    }
    state.premiosV2 = true;
  }
  if(!state.cardConfig) state.cardConfig = { ...DEFAULT_CARD_CONFIG };
}

/* ---- Puntos ---- */
function getActivePuntos(group){
  return (group.puntos || []).filter(d=> !state.activePeriodId || d.periodId === state.activePeriodId);
}
function getActiveCanjes(group){
  return (group.canjes || []).filter(c=> !state.activePeriodId || c.periodId === state.activePeriodId);
}
function computeStudentPuntosTotal(group, studentId){
  let total = 0;
  getActivePuntos(group).forEach(d=>{ total += (d.values && d.values[studentId]) || 0; });
  return Math.round(total * 10) / 10;
}
function computeStudentPuntosRedeemed(group, studentId){
  let total = 0;
  getActiveCanjes(group).forEach(c=>{ if(c.studentId === studentId) total += (c.cost || 0); });
  return Math.round(total * 10) / 10;
}
function computeStudentPuntosAvailable(group, studentId){
  return Math.round((computeStudentPuntosTotal(group, studentId) - computeStudentPuntosRedeemed(group, studentId)) * 10) / 10;
}

/* ---- Códigos de tarjeta ---- */
function allCardCodes(){
  const set = new Set();
  state.groups.forEach(g=> (g.students || []).forEach(s=>{ if(s.card) set.add(s.card); }));
  return set;
}
function generateCardCode(existing){
  let code;
  do{
    code = '';
    for(let i=0; i<6; i++) code += CARD_ALPHABET[Math.floor(Math.random() * CARD_ALPHABET.length)];
  } while(existing.has(code));
  existing.add(code);
  return code;
}
function ensureAllCards(){
  const existing = allCardCodes();
  let changed = false;
  state.groups.forEach(g=> (g.students || []).forEach(s=>{
    if(!s.card){ s.card = generateCardCode(existing); changed = true; }
  }));
  if(changed) saveState();
}
function normalizeCardCode(raw){
  let code = String(raw || '').trim().toUpperCase();
  if(code.startsWith(QR_PREFIX)) code = code.slice(QR_PREFIX.length);
  return code.replace(/[^A-Z0-9]/g, '');
}
function findStudentByCard(raw){
  // Acepta el QR del portal (https://…/consulta.html#f=…&t=CLAVE) o el código simple; el curso activo tiene prioridad
  return findAllByCard(raw)[0] || null;
}
function qrSvgForCode(code){ return qrSvgForData(QR_PREFIX + code); }
function qrSvgForData(data){
  const qr = qrcode(0, 'M');
  qr.addData(data);
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

/* ---- Imágenes de fondo por estudiante (frente y reverso) ----
   Se guardan en este dispositivo (IndexedDB), no en Drive: son pesadas y solo se necesitan al imprimir. */
const CARD_IMG_DB = 'registroClasesCardImages';
let cardImgKeys = new Set();   // claves "studentId|front" y "studentId|back" que tienen imagen
let cardImgDbPromise = null;

function cardImgDb(){
  if(cardImgDbPromise) return cardImgDbPromise;
  cardImgDbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('Este navegador no permite guardar imágenes')); return; }
    const req = indexedDB.open(CARD_IMG_DB, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('imgs');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=>{ cardImgDbPromise = null; reject(req.error); };
  });
  return cardImgDbPromise;
}
function cardImgTx(mode, fn){
  return cardImgDb().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction('imgs', mode);
    const store = tx.objectStore('imgs');
    const req = fn(store);
    tx.oncomplete = ()=> resolve(req ? req.result : undefined);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error);
  }));
}
function cardImgKey(studentId, side){ return studentId + '|' + side; }
function cardImgGet(studentId, side){ return cardImgTx('readonly', st=> st.get(cardImgKey(studentId, side))).catch(()=> null); }
function cardImgSet(studentId, side, dataUrl){
  return cardImgTx('readwrite', st=> st.put(dataUrl, cardImgKey(studentId, side))).then(()=> cardImgKeys.add(cardImgKey(studentId, side)));
}
function cardImgDel(studentId, side){
  return cardImgTx('readwrite', st=> st.delete(cardImgKey(studentId, side))).then(()=> cardImgKeys.delete(cardImgKey(studentId, side)));
}
function loadCardImgKeys(){
  return cardImgTx('readonly', st=> st.getAllKeys()).then(keys=>{ cardImgKeys = new Set(keys || []); }).catch(()=>{});
}
function studentHasCardImg(studentId, side){
  if(side) return cardImgKeys.has(cardImgKey(studentId, side));
  return cardImgKeys.has(cardImgKey(studentId, 'front')) || cardImgKeys.has(cardImgKey(studentId, 'back'));
}
/* Carga las imágenes de un conjunto de tarjetas: { studentId: { front, back } } */
async function loadCardImagesFor(cards){
  const out = {};
  for(const c of cards){
    if(!c.studentId || !studentHasCardImg(c.studentId)) continue;
    const [front, back] = await Promise.all([
      studentHasCardImg(c.studentId, 'front') ? cardImgGet(c.studentId, 'front') : null,
      studentHasCardImg(c.studentId, 'back') ? cardImgGet(c.studentId, 'back') : null,
    ]);
    out[c.studentId] = { front, back };
  }
  return out;
}
/* Reduce la imagen al tamaño de impresión de una tarjeta (~300 ppp) y la pasa a JPEG */
function compressCardImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1400;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); // las imágenes con transparencia quedan sobre blanco
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=> reject(new Error('No se pudo leer esa imagen'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/* ---- Diseño e impresión de tarjetas (tamaño carta) ---- */
function cssUrl(dataUrl){ return `url('${String(dataUrl).replace(/'/g, '%27')}')`; }

/* ---- Diseño de cada tarjeta: el general (state.cardConfig) o uno propio por estudiante (s.cardDesign) ---- */
const CARD_BGS = [
  ['none','Blanco'], ['#EAF6EE','Verde claro'], ['#FDEFE5','Durazno claro'], ['#E8F1F9','Celeste claro'],
  ['#F1EAF8','Lila claro'], ['#FDF6DC','Amarillo claro'], ['#FCE8EE','Rosado claro'], ['#EFEFEF','Gris claro'],
];
const CARD_LAYOUTS = [['izq','QR a la izquierda'], ['der','QR a la derecha'], ['arriba','QR arriba'], ['abajo','QR abajo']];
const CARD_QR_SIZES = [['S','Pequeño'], ['M','Normal'], ['L','Grande']];
const CARD_ALIGNS = [['left','Izquierda'], ['center','Centro'], ['right','Derecha']];
const CARD_HEADPOS = [['top','Arriba'], ['bottom','Abajo']];
const CARD_BACK_PHRASES = [
  '📱 Escanea el código QR con tu celular para ver tu registro.',
  '🔒 Esta tarjeta es personal: no la prestes.',
  'Si encuentras esta tarjeta, entrégala a tu profesor.',
  '⭐ Suma puntos participando, ayudando a tus compañeros y trabajando en clases.',
];
/* Tamaño del QR en pulgadas según tarjeta, distribución y tamaño elegido (S/M/L) */
const CARD_QR_INCHES = {
  estandar: { row: [1.3, 1.6, 1.85], col: [0.8, 0.95, 1.1] },
  pequena:  { row: [1.1, 1.35, 1.55], col: [0.62, 0.72, 0.82] },
  carnet:   { row: [1.2, 1.45, 1.6], col: [1.4, 1.75, 2.05] },
};
function defaultLayoutFor(size){ return size === 'carnet' ? 'abajo' : 'izq'; }
function effectiveDesign(cfg, design){
  const d = design && design.custom ? design : {};
  const has = v=> v !== undefined && v !== null && v !== '';
  const pick = (k, def)=> has(d[k]) ? d[k] : (has(cfg[k]) ? cfg[k] : def);
  return {
    frame: pick('frame', 'none'),
    bg: pick('bg', 'none'),
    layout: pick('layout', defaultLayoutFor(cfg.size)),
    qrSize: pick('qrSize', 'M'),
    align: pick('align', cfg.size === 'carnet' ? 'center' : 'left'),
    headPos: pick('headPos', 'top'),
  };
}
function qrInches(size, layout, qrSize){
  const t = CARD_QR_INCHES[size] || CARD_QR_INCHES.estandar;
  const arr = (layout === 'izq' || layout === 'der') ? t.row : t.col;
  return arr[{ S:0, M:1, L:2 }[qrSize] ?? 1];
}

function buildCardHtml(c, cfg, imgs){
  const des = effectiveDesign(cfg, c.design);
  const front = imgs && imgs.front;
  const frameCss = des.frame !== 'none' ? `border:0.09in solid ${des.frame};` : '';
  const bgCss = front
    ? `background-image:${cssUrl(front)}; background-size:cover; background-position:center;`
    : (des.bg !== 'none' ? `background-color:${des.bg};` : '');
  const head = (cfg.logo || cfg.title || cfg.school) ? `
    <div class="head">
      ${cfg.logo ? `<img class="logo" src="${cfg.logo}" alt="">` : ''}
      <div class="head-text">
        ${cfg.title ? `<div class="kicker">${escapeHtml(cfg.title)}</div>` : ''}
        ${cfg.school ? `<div class="school">${escapeHtml(cfg.school)}</div>` : ''}
      </div>
    </div>` : '';
  const alias = cfg.showAlias && c.alias ? `<div class="alias">“${escapeHtml(c.alias)}”</div>` : '';
  // Si el estudiante tiene imagen de frente, esa imagen ya es su personalización: no se agrega el recuadro para dibujar
  const deco = cfg.decorate && !front ? `<div class="deco"><span>${cfg.size === 'carnet' ? 'Dibuja aquí tu avatar' : 'Mi avatar'}</span></div>` : '';
  const q = qrInches(cfg.size, des.layout, des.qrSize);
  const qr = `<div class="qr" style="width:${q}in; height:${q}in;">${qrSvgForData(c.qr || (QR_PREFIX + c.code))}</div>`;
  const txt = `
    <div class="txt">
      ${des.headPos === 'top' ? head : ''}
      <div class="name">${escapeHtml(c.name)}</div>
      ${alias}
      <div class="course">${escapeHtml(c.course)} · <span class="code">${c.code}</span></div>
      ${des.headPos === 'bottom' ? head : ''}
    </div>`;
  const orient = cfg.size === 'carnet' ? 'v' : 'h';
  return `<div class="card ${orient} L-${des.layout} A-${des.align}${front ? ' has-img' : ''}" style="${frameCss}${bgCss}">
    ${cfg.size === 'carnet' ? '<div class="hole"></div>' : ''}
    <div class="main">${qr}<div class="side">${txt}${deco}</div></div>
  </div>`;
}

/* Texto del reverso (igual para todas las tarjetas, más el nombre si se elige) */
function backContentHtml(cfg, c){
  const parts = [];
  if(cfg.backShowName && c) parts.push(`<div class="back-name">${escapeHtml(c.name)}</div>`);
  if(cfg.backText && String(cfg.backText).trim()) parts.push(`<div class="back-text">${escapeHtml(String(cfg.backText).trim()).replace(/\n/g, '<br>')}</div>`);
  if(cfg.backCatalog){
    const list = (state.premios || []).slice().sort((a,b)=> a.cost - b.cost);
    if(list.length) parts.push(`<div class="back-cat"><div class="back-cat-title">Canjes</div>${list.map(p=> `<div class="back-cat-row"><span>${p.type === 'decimas' ? '➕' : '🎁'} ${escapeHtml(p.name)}</span><span>${p.cost} pts</span></div>`).join('')}</div>`);
  }
  return parts.length ? `<div class="back-content"><div class="back-box">${parts.join('')}</div></div>` : '';
}
/* Reverso de una tarjeta: imagen del estudiante (si tiene) o su color (marco o fondo), más el texto del reverso.
   El color y la imagen se extienden 0,05" fuera del borde (sangrado) por si la impresora corre la hoja. */
function buildBackCell(cfg, imgs, gridStyle, c){
  const des = effectiveDesign(cfg, c && c.design);
  const color = des.frame !== 'none' ? des.frame : (des.bg !== 'none' ? des.bg : null);
  const back = imgs && imgs.back;
  const colorCss = color ? `background:${color}; box-shadow:0 0 0 0.05in ${color};` : '';
  const img = back ? `<div class="back-img" style="background-image:${cssUrl(back)};"></div>` : '';
  return `<div class="card back ${cfg.size === 'carnet' ? 'v' : 'h'}" style="${gridStyle || ''}${colorCss}">${img}${backContentHtml(cfg, c)}</div>`;
}

/* Hoja de reverso: la misma grilla, pero con las columnas invertidas (espejo), porque al girar la hoja
   por el borde largo la tarjeta de la izquierda queda a la derecha. */
function buildBackSheet(pageCards, size, cfg, images){
  const cols = 2;
  const cells = pageCards.map((c, i)=>{
    const row = Math.floor(i / cols) + 1;
    const col = cols - (i % cols);
    return buildBackCell(cfg, images[c.studentId], `grid-row:${row}; grid-column:${col};`, c);
  });
  return `<div class="sheet ${size}">${cells.join('')}</div>`;
}

function cardsNeedBack(cards, cfg, images){
  if(cfg.backside === false) return false;
  if((cfg.backText && String(cfg.backText).trim()) || cfg.backCatalog || cfg.backShowName) return true;
  return cards.some(c=>{
    const des = effectiveDesign(cfg, c.design);
    return des.frame !== 'none' || des.bg !== 'none' || (images[c.studentId] && images[c.studentId].back);
  });
}

/* opts: { preview:bool, showBack:bool (solo en vista previa: muestra el reverso bajo el frente) } */
function buildCardsDocument(cards, cfg, images, opts){
  images = images || {};
  opts = opts || {};
  const preview = !!opts.preview;
  const size = CARD_SIZES[cfg.size] ? cfg.size : 'estandar';
  const perPage = CARD_SIZES[size].perPage;
  const pages = [];
  for(let i=0; i<cards.length; i+=perPage) pages.push(cards.slice(i, i+perPage));
  const withBack = !preview && cardsNeedBack(cards, cfg, images);
  let content;
  if(preview){
    content = `<div class="sheet ${size}">${cards.map(c=> buildCardHtml(c, cfg, images[c.studentId])).join('')}</div>`;
    if(opts.showBack){
      content = `<div class="pv-label">Frente</div>${content}<div class="pv-label">Reverso</div><div class="sheet ${size}">${cards.map(c=> buildBackCell(cfg, images[c.studentId], '', c)).join('')}</div>`;
    }
  } else {
    content = pages.map(pg=> `<div class="sheet ${size}">${pg.map(c=> buildCardHtml(c, cfg, images[c.studentId])).join('')}</div>`
      + (withBack ? buildBackSheet(pg, size, cfg, images) : '')).join('');
  }
  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
    <title>Tarjetas QR</title>
    <style>
      @page { size: letter; margin: 0.5in; }
      *{ box-sizing:border-box; }
      html, body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body{ margin:0; font-family: Calibri, Carlito, Arial, sans-serif; color:#000; background:#fff; }
      .toolbar{ padding:12px; text-align:center; font-size:14px; }
      .toolbar button{ font-size:16px; padding:8px 18px; cursor:pointer; }
      .toolbar .tip{ font-size:12.5px; color:#444; max-width:560px; margin:6px auto 0; line-height:1.35; }
      .sheet{ display:grid; justify-content:center; align-content:start; padding:0.06in 0; page-break-after:always; break-after:page; page-break-inside:avoid; break-inside:avoid; }
      .sheet:last-child{ page-break-after:auto; break-after:auto; }
      .sheet.estandar{ grid-template-columns: repeat(2, 3.5in); grid-auto-rows: 2.3in; gap:0.1in 0.3in; }

/* Muestra un documento de tarjetas en un iframe, escalado para que quepa en el ancho disponible */
function setCardPreviewFrame(frame, html){
  frame.onload = ()=>{
    try{
      const doc = frame.contentDocument;
      const sheets = [...doc.querySelectorAll('.sheet')];
      const widest = Math.max(...sheets.map(s=> s.scrollWidth));
      const avail = frame.clientWidth - 16;
      const scale = Math.min(1, avail / widest);
      doc.body.style.zoom = scale;
      frame.style.height = Math.ceil(doc.body.scrollHeight * scale + 20) + 'px';
    }catch(e){}
  };
  frame.srcdoc = html;
}

let cardDesignTarget = null; // { groupIds, onlyStudentId }

function collectCardsForTarget(target){
  if(ensurePortalConfig().enabled) ensureWebTokens();
  const cards = [];
  const seenCodes = new Set();
  state.groups.filter(g=> target.groupIds.includes(g.id)).forEach(g=>{
    (g.students || []).forEach(s=>{
      if(target.onlyStudentId && s.id !== target.onlyStudentId) return;
      // Un estudiante vinculado en varios cursos lleva una sola tarjeta, con todos sus cursos
      if(s.card && seenCodes.has(s.card)) return;
      if(s.card) seenCodes.add(s.card);
      cards.push({ studentId: s.id, name: s.name, course: s.card ? coursesLabelForCard(s.card) : g.name, code: s.card, alias: s.cardAlias || '', qr: cardQrData(s), design: s.cardDesign || null });
    });
  });
  return cards;
}

function addCardBackPhrase(i){
  const cur = String(state.cardConfig.backText || '').trim();

}

function updateCardConfig(field, value){

function uploadCardLogo(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      // Se reduce para no inflar el respaldo en Drive
      const max = 256;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      updateCardConfig('logo', c.toDataURL('image/png'));
      showToast('Logo agregado');
    };
    img.onerror = ()=> showToast('No se pudo leer esa imagen');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
async function refreshCardPreview(){
  const frame = document.getElementById('cardPreviewFrame');
  if(!frame || !cardDesignTarget) return;
  const cards = collectCardsForTarget(cardDesignTarget);
  // Para ver el diseño general se prefiere una tarjeta sin diseño propio
  const general = cards.filter(c=> !(c.design && c.design.custom));
  const pool = general.length ? general : cards;
  const sample = pool.find(c=> studentHasCardImg(c.studentId)) || pool.find(c=> c.alias) || pool[0];
  if(!sample) return;
  const images = await loadCardImagesFor([sample]);
  const cfg = state.cardConfig;
  const showBack = cardsNeedBack([sample], cfg, images);
  setCardPreviewFrame(frame, buildCardsDocument([sample], cfg, images, { preview:true, showBack }));
}

async function printDesignedCards(){
  if(!cardDesignTarget) return;
  const cards = collectCardsForTarget(cardDesignTarget);
  // La ventana se abre antes de cargar las imágenes (si se abre después, el navegador la bloquea)
  const win = window.open('', '_blank');
  if(!win){ showToast('El navegador bloqueó la ventana de impresión. Permite ventanas emergentes e inténtalo de nuevo.'); return; }
  win.document.write('<p style="font-family:sans-serif; text-align:center; margin-top:40px;">Preparando tarjetas…</p>');
  const images = await loadCardImagesFor(cards);
  win.document.open();
  win.document.write(buildCardsDocument(cards, state.cardConfig, images, { preview:false }));
  win.document.close();
  setTimeout(()=>{ try{ win.focus(); win.print(); }catch(e){} }, 700);
}

function stepStudentCardImages(dir){
  if(!cardImgStudent) return;

  const idx = group.students.findIndex(s=> s.id === cardImgStudent.studentId);

  openStudentCardImages(next.id);

  if(!cardImgStudent) return null;
  const group = state.groups.find(g=> g.id === cardImgStudent.groupId);

  return s ? { group, s } : null;

/* El diseño se comparte entre los registros vinculados (misma tarjeta en varios cursos) */

  const linked = linkedRecords(s);
  (linked.length ? linked : [{ student: s }]).forEach(({ student })=> fn(student));

  const cur = currentCardStudent();
  if(!cur) return;
  const base = { custom: true, ...effectiveDesign(state.cardConfig, cur.s.cardDesign) };
  forEachLinkedStudent(cur.s, st=>{ if(on) st.cardDesign = { ...base }; else delete st.cardDesign; });
  saveState();
  renderStudentCardImages();

  const cur = currentCardStudent();

  forEachLinkedStudent(cur.s, st=>{

    st.cardDesign[field] = value;
  });
  saveState();
  renderStudentCardImages();
}

/* ---- Escáner con la cámara ---- */
const qrScanner = { stream:null, detector:null, timer:null, canvas:null, busy:false, wanted:false, lastCode:null, lastTime:0 };
let scanCurrent = null;          // { groupId, studentId }
let scanAutoAction = '';         // '' = mostrar opciones; 'q:1' = +1 automático; 'm:<id>' = motivo automático
let scanLog = [];                // movimientos de esta sesión de escaneo (para deshacer)
let jsQRLoading = null;

function loadJsQR(){
  if(typeof jsQR !== 'undefined') return Promise.resolve(true);
  if(jsQRLoading) return jsQRLoading;
  jsQRLoading = new Promise(resolve=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload = ()=> resolve(true);
    s.onerror = ()=>{ jsQRLoading = null; resolve(false); };
    document.head.appendChild(s);
  });
  return jsQRLoading;
}

function setScanStatus(msg){
  const el = document.getElementById(scanEls().status);
  if(el) el.textContent = msg;
}

async function startQrScanner(){
  const video = document.getElementById(scanEls().video);
  if(!video) return;
  stopQrScanner();
  qrScanner.wanted = true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanStatus('Este navegador no permite usar la cámara. Abre la app desde Chrome (en https) o usa el código escrito.');
    return;
  }
  setScanStatus('Iniciando cámara…');
  try{
    qrScanner.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  }catch(e){
    qrScanner.wanted = false;
    setScanStatus('No se pudo abrir la cámara (permiso denegado o cámara en uso). Revisa los permisos del sitio en Chrome.');
    renderScanCameraButtons();
    return;
  }
  // Si el usuario ya salió de la pantalla mientras se pedía el permiso, se apaga de inmediato
  if(!document.body.contains(video)){ stopQrScanner(); return; }
  video.srcObject = qrScanner.stream;
  video.setAttribute('playsinline', '');
  video.muted = true;
  try{ await video.play(); }catch(e){}
  document.getElementById(scanEls().wrap)?.classList.add('active');

  qrScanner.detector = null;
  if('BarcodeDetector' in window){
    try{
      const formats = await BarcodeDetector.getSupportedFormats();
      if(formats.includes('qr_code')) qrScanner.detector = new BarcodeDetector({ formats: ['qr_code'] });
    }catch(e){}
  }
  if(!qrScanner.detector){
    const ok = await loadJsQR();
    if(!ok){
      setScanStatus('Este dispositivo necesita internet la primera vez para leer QR. Mientras tanto, usa el código escrito o elige al estudiante.');
      return;
    }
  }
  setScanStatus('Apunta la cámara al código QR de la tarjeta');
  renderScanCameraButtons();
  scanTick();
}

function stopQrScanner(){
  if(qrScanner.timer){ clearTimeout(qrScanner.timer); qrScanner.timer = null; }
  if(qrScanner.stream){ qrScanner.stream.getTracks().forEach(t=> t.stop()); qrScanner.stream = null; }
  ['qrVideo','kioskVideo'].forEach(id=>{ const v = document.getElementById(id); if(v) v.srcObject = null; });
  ['qrVideoWrap','kioskVideoWrap'].forEach(id=> document.getElementById(id)?.classList.remove('active'));
}

function turnOffQrScanner(){
  qrScanner.wanted = false;
  stopQrScanner();
  setScanStatus('Cámara apagada');
  renderScanCameraButtons();
}

async function scanTick(){
  qrScanner.timer = null;
  const video = document.getElementById(scanEls().video);
  if(!qrScanner.stream || !video || !document.body.contains(video)){ stopQrScanner(); return; }
  const paused = kioskActive ? document.hidden : document.hidden || document.getElementById('studentModalOverlay') || document.getElementById('decimasBulkFormOverlay') || document.getElementById('cardDesignerOverlay') || document.getElementById('cardImgOverlay');
  if(!paused && video.readyState >= 2 && !qrScanner.busy){
    qrScanner.busy = true;
    try{
      let raw = null;
      if(qrScanner.detector){
        const codes = await qrScanner.detector.detect(video);
        if(codes && codes.length) raw = codes[0].rawValue;
      } else if(typeof jsQR !== 'undefined'){
        const w = video.videoWidth, h = video.videoHeight;
        if(w && h){
          const scale = Math.min(1, 640 / Math.max(w, h));
          const cw = Math.round(w * scale), ch = Math.round(h * scale);
          if(!qrScanner.canvas) qrScanner.canvas = document.createElement('canvas');
          const c = qrScanner.canvas;
          c.width = cw; c.height = ch;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, cw, ch);
          const img = ctx.getImageData(0, 0, cw, ch);
          const res = jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
          if(res && res.data) raw = res.data;
        }
      }
      if(raw) handleScannedCode(raw);
    }catch(e){ /* un cuadro fallido no detiene el escáner */ }
    qrScanner.busy = false;
  }
  if(qrScanner.stream) qrScanner.timer = setTimeout(scanTick, 180);
}

function scanFeedback(ok){
  try{ if(navigator.vibrate) navigator.vibrate(ok ? 60 : [40, 60, 40]); }catch(e){}
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!scanFeedback.ctx) scanFeedback.ctx = new Ctx();
    const ctx = scanFeedback.ctx;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = ok ? 1175 : 330;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.16);
  }catch(e){}
}

function handleScannedCode(raw){
  const code = normalizeCardCode(raw);
  const now = Date.now();
  // La misma tarjeta frente a la cámara se ignora por unos segundos (evita sumar dos veces sin querer)
  if(code === qrScanner.lastCode && now - qrScanner.lastTime < 3000) return;
  qrScanner.lastCode = code; qrScanner.lastTime = now;
  if(kioskActive){ showKioskStudent(raw); return; }
  selectScanStudentByCode(raw, true);
}

function selectScanStudentByCode(code, fromCamera){
  const matches = findAllByCard(code);
  if(matches.length === 0){
    scanFeedback(false);
    setScanStatus(String(code || '').trim() ? `Tarjeta no reconocida (${normalizeCardCode(code) || 'sin código'}). ¿Es de otra cuenta o de un estudiante eliminado?` : 'Escribe un código');
    return;
  }
  scanFeedback(true);
  // Estudiante en varios cursos: si está en el curso activo se usa ese; si no, hay que elegir la asignatura
  const inActive = matches.find(m=> m.group.id === state.activeGroupId);
  const pick = inActive || matches[0];
  const ambiguous = !inActive && matches.length > 1;
  selectScanStudent(pick.group.id, pick.student.id, fromCamera && !ambiguous);
  if(ambiguous){
    flashScanResult('Está en ' + matches.length + ' cursos: elige la asignatura arriba');
    if(fromCamera && scanAutoAction) showToast('No se sumó automáticamente: este estudiante está en varios cursos. Elige la asignatura.');
  }
}

function selectScanStudent(groupId, studentId, fromScan){
  if(!groupId || !studentId) return;
  if(state.activeGroupId !== groupId){
    state.activeGroupId = groupId;
    renderGroupSelect();
    renderScanPicker();
  }
  scanCurrent = { groupId, studentId };
  if(fromScan && scanAutoAction){
    const [kind, val] = scanAutoAction.split(':');
    if(kind === 'q') assignScanPuntos(Number(val), null);
    else if(kind === 'm') assignScanPuntosMotivo(val);
    return;
  }
  renderScanResult();
}

function getScanCurrent(){
  if(!scanCurrent) return null;
  const group = state.groups.find(g=> g.id === scanCurrent.groupId);
  const student = group ? group.students.find(s=> s.id === scanCurrent.studentId) : null;
  return (group && student) ? { group, student } : null;
}

function assignScanPuntosMotivo(motivoId){
  ensureRewardsConfig();
  const m = state.decimaMotivos.find(x=> x.id === motivoId);
  if(!m){ showToast('Ese motivo ya no existe'); return; }
  assignScanPuntos(Number(m.value) || 0, m.name);
}

/* Suma (o resta, si amount es negativo) puntos a un estudiante. Lo del mismo día y motivo queda en un solo registro. */
function addPuntosEntry(group, student, amount, note){
  if(!group.puntos) group.puntos = [];
  const today = toISODate(new Date());
  const period = state.activePeriodId || null;
  let session = group.puntos.find(d=> d.values && d.date === today && (d.note || '') === note && (d.periodId || null) === period);
  if(!session){
    session = { id: uid(), date: today, note, periodId: state.activePeriodId, values: {} };
    group.puntos.push(session);
  }
  session.values[student.id] = Math.round(((session.values[student.id] || 0) + amount) * 10) / 10;
  return session;
}
/* Antes de quitar puntos: avisa si el estudiante quedaría con saldo negativo */
function confirmPuntosRemoval(group, student, amount){
  if(amount >= 0) return true;
  const disp = computeStudentPuntosAvailable(group, student.id);
  const after = Math.round((disp + amount) * 10) / 10;
  if(after >= 0) return true;
  return confirm(`${student.name} tiene ${disp} punto(s) disponible(s). Si le quitas ${Math.abs(amount)}, quedará con ${after} (saldo negativo).\n\n¿Quitar igual?`);
}
function removeScanPuntos(n){
  assignScanPuntos(-Math.abs(n), 'Descuento de puntos');
}
function customScanPuntos(sign){
  const amount = Math.abs(Math.round(Number(document.getElementById('scanCustomAmount')?.value)));
  if(!amount){ showToast('Escribe la cantidad de puntos'); return; }
  const note = (document.getElementById('scanCustomNote')?.value || '').trim() || (sign > 0 ? 'Puntos (manual)' : 'Descuento de puntos');
  assignScanPuntos(sign * amount, note);
}

function assignScanPuntos(amount, motivoName){
  const cur = getScanCurrent();
  if(!cur){ showToast('Primero escanea una tarjeta'); return; }
  if(!amount){ showToast('La cantidad debe ser distinta de 0'); return; }
  const { group, student } = cur;
  const note = motivoName || 'Escaneo rápido';
  if(!confirmPuntosRemoval(group, student, amount)) return;
  const session = addPuntosEntry(group, student, amount, note);
  scanLog.unshift({ id: uid(), type:'punto', groupId: group.id, studentId: student.id, studentName: student.name, sessionId: session.id, amount, note, time: Date.now() });
  scanLog = scanLog.slice(0, 20);
  saveState();
  renderScanResult();
  flashScanResult(`${amount > 0 ? '+' : ''}${amount} punto(s) · ${note}`);
}

/* Registra las décimas ganadas por un canje en el módulo Décimas */
function addCanjeDecimas(group, studentId, amount, date, periodId){
  if(!group.decimas) group.decimas = [];
  let session = group.decimas.find(d=> d.values && d.date === date && d.note === CANJE_DECIMAS_NOTE && (d.periodId || null) === (periodId || null));
  if(!session){
    session = { id: uid(), date, note: CANJE_DECIMAS_NOTE, periodId, values: {}, source: 'canje' };
    group.decimas.push(session);
  }
  session.values[studentId] = Math.round(((session.values[studentId] || 0) + amount) * 10) / 10;
  return session.id;
}
function removeCanjeDecimas(group, canje){
  const session = (group.decimas || []).find(d=> d.id === canje.decimaSessionId)
    || (group.decimas || []).find(d=> d.values && d.date === canje.date && d.note === CANJE_DECIMAS_NOTE && (d.periodId || null) === (canje.periodId || null));
  if(!session || !session.values) return;
  const nuevo = Math.round(((session.values[canje.studentId] || 0) - (canje.decimas || 0)) * 10) / 10;
  if(nuevo === 0) delete session.values[canje.studentId];
  else session.values[canje.studentId] = nuevo;
  const vacio = Object.values(session.values).every(v=> v === null || v === undefined || v === 0);
  if(vacio && session.source === 'canje') group.decimas = group.decimas.filter(d=> d.id !== session.id);
}
/* Devuelve true si se revirtió; false si no se puede (décimas ya usadas en una nota) */
function revertCanjeData(group, canjeId){
  const canje = (group.canjes || []).find(c=> c.id === canjeId);
  if(!canje) return true;
  if(canje.type === 'decimas' && canje.decimas){
    const disponibles = computeStudentDecimasAvailable(group, canje.studentId);
    if(disponibles < canje.decimas){
      showToast('No se puede revertir: esas décimas ya se aplicaron a una nota. Revierte primero la aplicación en la ficha del estudiante.');
      return false;
    }
    removeCanjeDecimas(group, canje);
  }
  group.canjes = group.canjes.filter(c=> c.id !== canjeId);
  return true;
}

function canjearPremioScan(premioId){
  const cur = getScanCurrent();
  if(!cur){ showToast('Primero escanea una tarjeta'); return; }
  ensureRewardsConfig();
  const premio = state.premios.find(p=> p.id === premioId);
  if(!premio) return;
  const { group, student } = cur;
  const disponible = computeStudentPuntosAvailable(group, student.id);
  if(disponible < premio.cost){ showToast(`No le alcanza: tiene ${disponible} puntos y cuesta ${premio.cost}`); return; }
  const esDecimas = premio.type === 'decimas';
  const detalle = esDecimas ? `recibe ${premio.decimas} décima(s)` : `"${premio.name}"`;
  if(!confirm(`¿Canjear para ${student.name}?\n\nSe descuentan ${premio.cost} puntos (le quedarán ${Math.round((disponible - premio.cost)*10)/10}) y ${detalle}.`)) return;
  if(!group.canjes) group.canjes = [];
  const date = toISODate(new Date());
  const canje = { id: uid(), date, time: new Date().toTimeString().slice(0,5), studentId: student.id, premioId: premio.id, name: premio.name, cost: premio.cost, type: esDecimas ? 'decimas' : 'premio', periodId: state.activePeriodId };
  if(esDecimas){
    canje.decimas = premio.decimas;
    canje.decimaSessionId = addCanjeDecimas(group, student.id, premio.decimas, date, state.activePeriodId);
  }
  group.canjes.push(canje);
  scanLog.unshift({ id: uid(), type:'canje', groupId: group.id, studentId: student.id, studentName: student.name, canjeId: canje.id, amount: -premio.cost, note: premio.name, time: Date.now() });
  scanLog = scanLog.slice(0, 20);
  saveState();
  renderScanResult();
  flashScanResult(esDecimas ? `➕ ${premio.decimas} décima(s) agregada(s)` : `🎁 Canjeado: ${premio.name}`);
}

function undoScanLog(logId){
  const item = scanLog.find(l=> l.id === logId);
  if(!item) return;
  const group = state.groups.find(g=> g.id === item.groupId);
  if(group){
    if(item.type === 'punto'){
      const session = (group.puntos || []).find(d=> d.id === item.sessionId);
      if(session && session.values){
        const nuevo = Math.round(((session.values[item.studentId] || 0) - item.amount) * 10) / 10;
        if(nuevo === 0) delete session.values[item.studentId];
        else session.values[item.studentId] = nuevo;
        const vacio = Object.values(session.values).every(v=> v === null || v === undefined || v === 0);
        if(vacio) group.puntos = group.puntos.filter(d=> d.id !== session.id);
      }
    } else if(item.type === 'canje'){
      if(!revertCanjeData(group, item.canjeId)) return;
    }
  }
  scanLog = scanLog.filter(l=> l.id !== logId);
  saveState();
  renderScanResult();
  showToast('Movimiento deshecho');
}

function openPuntosAdjust(studentId){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  document.getElementById('puntosAdjustOverlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'puntosAdjustOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="max-width:420px;">
      <button class="modal-close" onclick="document.getElementById('puntosAdjustOverlay').remove()">✕</button>
      <h2 style="border:none; padding-bottom:0;">± Ajustar puntos</h2>
      <p class="muted"><strong>${escapeHtml(s.name)}</strong> · Disponibles: <strong>${computeStudentPuntosAvailable(group, s.id)}</strong></p>
      <label>Cantidad</label>
      <input type="number" id="adjAmount" min="1" step="1" placeholder="Ej. 3">
      <label style="margin-top:8px;">Motivo (opcional)</label>
      <input type="text" id="adjNote" placeholder="Ej. Corrección, descuento acordado…">
      <div class="row" style="gap:6px; margin-top:14px; justify-content:center;">
        <button class="btn btn-accent" onclick="applyPuntosAdjust('${s.id}', 1)">+ Sumar</button>
        <button class="btn btn-danger" onclick="applyPuntosAdjust('${s.id}', -1)">− Quitar</button>
      </div>
      <p class="muted" style="font-size:0.75rem; margin-top:10px;">Queda registrado como un movimiento más (con fecha de hoy y el motivo), visible en la ficha, el informe y el portal del estudiante.</p>
    </div>`;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

}
function applyPuntosAdjust(studentId, sign){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  const amount = Math.abs(Math.round(Number(document.getElementById('adjAmount').value)));
  if(!amount){ showToast('Escribe la cantidad de puntos'); return; }
  const note = document.getElementById('adjNote').value.trim() || (sign > 0 ? 'Puntos (manual)' : 'Descuento de puntos');
  if(!confirmPuntosRemoval(group, s, sign * amount)) return;
  addPuntosEntry(group, s, sign * amount, note);
  saveState();
  document.getElementById('puntosAdjustOverlay')?.remove();
  renderPremios(group);
  showToast(`${sign > 0 ? '+' : '−'}${amount} punto(s) a ${s.name}`);
}

/* ---- Pestaña Puntos: saldos, tarjetas, catálogo, motivos y canjes ---- */
function addPremio(type){
  const pre = type === 'decimas' ? 'premioDec' : 'premioNew';
  const cost = Math.round(Number(document.getElementById(pre + 'Cost').value));
  if(!cost || cost <= 0){ showToast('El costo en puntos debe ser mayor que 0'); return; }
  ensureRewardsConfig();
  if(type === 'decimas'){
    const dec = Math.round(Number(document.getElementById('premioDecAmount').value));
    if(!dec || dec <= 0){ showToast('Indica cuántas décimas entrega'); return; }
    state.premios.push({ id: uid(), name: `${dec} décima${dec === 1 ? '' : 's'}`, cost, type:'decimas', decimas: dec });
  } else {
    const name = document.getElementById('premioNewName').value.trim();
    if(!name){ showToast('Escribe el nombre del premio'); return; }
    state.premios.push({ id: uid(), name, cost, type:'premio' });
  }
  saveState();
  renderPremios(getActiveGroup());
}
function updatePremio(id, field, value){
  const p = (state.premios || []).find(x=> x.id === id);
  if(!p) return;
  if(field === 'name'){ const v = String(value).trim(); if(v) p.name = v; }
  if(field === 'cost'){ const n = Math.round(Number(value)); if(n > 0) p.cost = n; }
  if(field === 'decimas'){ const n = Math.round(Number(value)); if(n > 0){ p.decimas = n; p.name = `${n} décima${n === 1 ? '' : 's'}`; } }
  saveState();
}
function deletePremio(id){
  if(!confirm('¿Quitar esta opción del catálogo? Los canjes ya hechos se conservan.')) return;
  state.premios = (state.premios || []).filter(p=> p.id !== id);
  saveState();
  renderPremios(getActiveGroup());
}
function addMotivo(){
  const name = document.getElementById('motivoNewName').value.trim();
  const value = Number(document.getElementById('motivoNewValue').value);
  if(!name){ showToast('Escribe el nombre del motivo'); return; }
  if(!value){ showToast('Los puntos deben ser distintos de 0'); return; }
  ensureRewardsConfig();
  state.decimaMotivos.push({ id: uid(), name, value: Math.round(value) });
  saveState();
  renderPremios(getActiveGroup());
}
function updateMotivo(id, field, value){
  const m = (state.decimaMotivos || []).find(x=> x.id === id);
  if(!m) return;
  if(field === 'name'){ const v = String(value).trim(); if(v) m.name = v; }
  if(field === 'value'){ const n = Math.round(Number(value)); if(n) m.value = n; }
  saveState();
}
function deleteMotivo(id){
  if(!confirm('¿Quitar este motivo? Los puntos ya asignados se conservan.')) return;
  state.decimaMotivos = (state.decimaMotivos || []).filter(m=> m.id !== id);
  saveState();
  renderPremios(getActiveGroup());
}
function revertCanje(canjeId){
  const group = getActiveGroup();
  const c = (group.canjes || []).find(x=> x.id === canjeId);
  if(!c) return;
  const st = group.students.find(s=> s.id === c.studentId);
  const extra = c.type === 'decimas' ? ` y se le quitan las ${c.decimas} décima(s) del canje` : '';
  if(!confirm(`¿Revertir el canje "${c.name}"${st ? ' de ' + st.name : ''}? Se le devuelven ${c.cost} puntos${extra}.`)) return;
  if(!revertCanjeData(group, canjeId)) return;
  saveState();
  renderPremios(group);
  showToast('Canje revertido');
}
function regenerateStudentCard(studentId){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  const linked = linkedRecords(s);
  if(!confirm(`¿Generar un código nuevo para ${s.name}?\n\nLa tarjeta anterior dejará de funcionar (útil si la perdió o se la prestó a otro), también en el portal desde tu próxima publicación.${linked.length > 1 ? ' El cambio aplica a sus ' + linked.length + ' cursos vinculados.' : ''} Tendrás que imprimirle una nueva.`)) return;
  const newCard = generateCardCode(allCardCodes());
  // También cambia la clave del portal: la tarjeta antigua deja de abrir su registro desde la próxima publicación
  const toks = new Set(); state.groups.forEach(g=> (g.students||[]).forEach(x=>{ if(x.webToken) toks.add(x.webToken); }));
  const newToken = generateWebToken(toks);
  (linked.length ? linked : [{ student: s }]).forEach(({ student })=>{ student.card = newCard; student.webToken = newToken; });
  saveState();
  renderPremios(group);
  showToast('Código nuevo generado: ' + s.card);
}
function updateStudentAlias(studentId, value){
  const group = getActiveGroup();
  const s = group.students.find(x=> x.id === studentId);
  if(!s) return;
  const alias = String(value || '').trim().slice(0, 40);
  const linked = linkedRecords(s);
  (linked.length ? linked : [{ student: s }]).forEach(({ student })=>{ student.cardAlias = alias; });
  saveState();
}

function puntosExportData(group){
  const resumen = group.students.map(s=> [s.name, computeStudentPuntosTotal(group, s.id), computeStudentPuntosRedeemed(group, s.id), computeStudentPuntosAvailable(group, s.id)]);
  const movimientos = [];
  getActivePuntos(group).slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'')).forEach(d=>{
    group.students.forEach(s=>{
      const v = d.values ? d.values[s.id] : null;
      if(v) movimientos.push([formatDate(d.date), d.note || '', s.name, v]);
    });
  });
  const nameOf = id=> (group.students.find(s=> s.id === id) || {}).name || '(estudiante eliminado)';
  const canjes = getActiveCanjes(group).slice().sort((a,b)=> ((a.date||'') + (a.time||'')).localeCompare((b.date||'') + (b.time||'')))
    .map(c=> [formatDate(c.date) + (c.time ? ' ' + c.time : ''), nameOf(c.studentId), c.name, c.cost, c.type === 'decimas' ? c.decimas : '']);
  return { resumen, movimientos, canjes };
}
async function exportPuntosToExcel(group){
  if(typeof ExcelJS === 'undefined'){ showToast('Se necesita conexión a internet para exportar esta hoja.'); return; }
  const { resumen, movimientos, canjes } = puntosExportData(group);
  const wb = new ExcelJS.Workbook();
  const addSheet = (name, headers, rows, widths)=>{
    const ws = wb.addWorksheet(name);
    ws.addRow(headers).font = { bold:true };
    rows.forEach(r=> ws.addRow(r));
    widths.forEach((w, i)=> ws.getColumn(i+1).width = w);
  };
  addSheet('Puntos', ['Estudiante','Ganados','Canjeados','Disponibles'], resumen, [28,12,12,12]);
  addSheet('Movimientos', ['Fecha','Motivo','Estudiante','Puntos'], movimientos, [14,26,28,10]);
  addSheet('Canjes', ['Fecha','Estudiante','Canje','Puntos','Décimas recibidas'], canjes, [18,28,32,10,16]);
  await downloadWorkbook(wb, `puntos_${safeFileName(group.name)}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Puntos exportados');
}
async function exportPuntosToWord(group){
  if(typeof JSZip === 'undefined'){ showToast('Se necesita conexión a internet para exportar a Word.'); return; }
  const { resumen, canjes } = puntosExportData(group);
  let body = wordHeading(`Puntos - ${group.name}`, 32);
  body += wordTable(['Estudiante','Ganados','Canjeados','Disponibles'], resumen.map(r=> r.map(String)), [3600,1500,1500,1500]);
  if(canjes.length){
    body += wordHeading('Canjes', 24);
    body += wordTable(['Fecha','Estudiante','Canje','Puntos','Décimas'], canjes.map(r=> r.map(String)), [1700,2500,2600,900,900]);
  }
  await buildAndDownloadDocx(body, `puntos_${safeFileName(group.name)}_${new Date().toISOString().slice(0,10)}.docx`);
  showToast('Puntos exportados a Word');
}

const KIOSK_FLAG = 'registroClases_kioskMode';
let kioskActive = false;
let kioskClearTimer = null;
let kioskExitTimer = null;
let kioskWakeLock = null;

function validKioskPin(pin){ return /^\d{4,6}$/.test(pin); }
function saveKioskPinAndEnter(){
  const a = document.getElementById('kioskPinA').value.trim();
  const b = document.getElementById('kioskPinB').value.trim();
  const msg = document.getElementById('kioskPinMsg');
  if(!validKioskPin(a)){ msg.textContent = 'El PIN debe tener entre 4 y 6 dígitos (solo números).'; return; }
  if(a !== b){ msg.textContent = 'Los PIN no coinciden.'; return; }
  state.consultaPin = a;
  saveState();
  document.getElementById('kioskPinOverlay')?.remove();
  enterKiosk();
}
function changeKioskPin(){
  const input = document.getElementById('kioskPinNew');

  saveState();

  showToast('PIN actualizado');
}
function toggleKioskPinVisible(btn){
  const el = document.getElementById('kioskPinShown');

  el.textContent = hidden ? (state.consultaPin || '—') : '••••';

}

async function requestKioskWakeLock(){
  try{
    if('wakeLock' in navigator && !document.hidden) kioskWakeLock = await navigator.wakeLock.request('screen');
  }catch(e){ kioskWakeLock = null; }
}

function enterKiosk(){
  kioskActive = true;
  try{ localStorage.setItem(KIOSK_FLAG, '1'); }catch(e){}
  // Se apaga la cámara de la pantalla Escanear y se cierra cualquier ventana abierta
  const wasEscanear = document.getElementById('qrVideo');
  if(wasEscanear){ wasEscanear.srcObject = null; }
  if(qrScanner.stream){ qrScanner.stream.getTracks().forEach(t=> t.stop()); qrScanner.stream = null; }
  if(qrScanner.timer){ clearTimeout(qrScanner.timer); qrScanner.timer = null; }
  ['studentModalOverlay','decimasBulkFormOverlay','cardDesignerOverlay','kioskPinOverlay'].forEach(id=> document.getElementById(id)?.remove());
  document.getElementById('kioskOverlay')?.remove();

  const ov = document.createElement('div');
  ov.id = 'kioskOverlay';
  ov.className = 'kiosk-overlay app-font';
  ov.innerHTML = `
    <div class="kiosk-inner">
      <div class="kiosk-top">
        <div>
          <div class="kiosk-title">⭐ Consulta tus puntos</div>
          <div class="muted">Acerca tu tarjeta a la cámara</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="askKioskExit()">🔒 Salir</button>
      </div>
      <div id="kioskExitBox"></div>
      <div id="kioskResult"></div>
      <div class="qr-video-wrap kiosk-video" id="kioskVideoWrap">
        <video id="kioskVideo" playsinline muted></video>
        <div class="qr-frame"></div>
      </div>
      <p class="muted" id="kioskStatus" style="text-align:center; margin:8px 0 0;">Iniciando cámara…</p>
      <div id="kioskCameraButtons" style="text-align:center; margin-top:8px;"></div>
      <div class="row" style="justify-content:center; gap:6px; margin-top:12px; flex-wrap:nowrap;">
        <input type="text" id="kioskManualCode" placeholder="¿Sin cámara? Escribe tu código" autocomplete="off" style="text-transform:uppercase; max-width:260px;" onkeydown="if(event.key==='Enter') submitKioskManualCode()">
        <button class="btn btn-outline btn-sm" onclick="submitKioskManualCode()">Ver</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  try{ history.pushState({ kiosk:true }, ''); }catch(e){}
  requestKioskWakeLock();
  try{
    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }catch(e){}
  showKioskIdle();
  startQrScanner();
}

  clearKioskTimers();

function kioskMovements(group, studentId){
  const out = [];
  getActivePuntos(group).forEach(d=>{
    const v = d.values ? d.values[studentId] : null;
    if(v) out.push({ date: d.date || '', time: '', text: d.note || 'Puntos', amount: v });
  });
  getActiveCanjes(group).forEach(c=>{
    if(c.studentId === studentId) out.push({ date: c.date || '', time: c.time || '', text: 'Canje: ' + c.name, amount: -c.cost });
  });
  out.sort((a,b)=> (b.date + b.time).localeCompare(a.date + a.time));
  return out;
}

function kioskCourseBlockHtml(group, student, showCourse){
  const disp = computeStudentPuntosAvailable(group, student.id);
  const ganados = computeStudentPuntosTotal(group, student.id);
  const canjeados = computeStudentPuntosRedeemed(group, student.id);
  const decDisp = computeStudentDecimasAvailable(group, student.id);
  const movs = kioskMovements(group, student.id);
  const alcanza = state.premios.filter(p=> p.cost <= disp).sort((a,b)=> a.cost - b.cost);
  const proximo = state.premios.filter(p=> p.cost > disp).sort((a,b)=> a.cost - b.cost)[0];
  const premioLabel = p=> (p.type === 'decimas' ? '➕ ' : '🎁 ') + escapeHtml(p.name) + ' · ' + p.cost + ' pts';
  const nMovs = showCourse ? 4 : 8;
  return `
    ${showCourse ? `<div class="kiosk-course-title">${escapeHtml(group.name)}</div>` : ''}
    <div style="text-align:center;">
      <div class="kiosk-big">${disp}</div>
      <div class="muted" style="font-weight:600;">puntos disponibles</div>
      <div class="muted" style="font-size:0.8rem; margin-top:4px;">Ganados ${ganados} · canjeados ${canjeados}${decDisp > 0 ? ' · décimas por aplicar a una nota: ' + decDisp : ''}</div>
    </div>
    <p class="scan-section-label">Te alcanza para</p>
    ${alcanza.length ? `<div class="scan-chip-row">${alcanza.map(p=> `<span class="kiosk-chip">${premioLabel(p)}</span>`).join('')}</div>` : '<div class="muted" style="font-size:0.85rem;">Todavía nada del catálogo, ¡sigue sumando!</div>'}
    ${proximo ? `<div class="muted" style="font-size:0.85rem; margin-top:6px;">Te faltan <strong>${Math.round((proximo.cost - disp) * 10) / 10}</strong> punto(s) para: ${premioLabel(proximo)}</div>` : ''}
    <p class="scan-section-label">Últimos movimientos</p>
    ${movs.length === 0 ? '<div class="muted" style="font-size:0.85rem;">Aún no tienes movimientos.</div>' :
      movs.slice(0, nMovs).map(m=> `
        <div class="kiosk-mov">
          <span>${formatDate(m.date)}${m.time ? ' ' + m.time : ''} · ${escapeHtml(m.text)}</span>
          <strong class="${m.amount > 0 ? 'kiosk-pos' : 'kiosk-neg'}">${m.amount > 0 ? '+' : ''}${m.amount}</strong>
        </div>`).join('')}
    ${movs.length > nMovs ? `<div class="muted" style="font-size:0.78rem; margin-top:4px;">y ${movs.length - nMovs} movimiento(s) más antiguos</div>` : ''}`;
}

function showKioskStudent(raw){
  const box = document.getElementById('kioskResult');
  if(!box) return;
  const matches = findAllByCard(raw);
  if(matches.length === 0){
    scanFeedback(false);
    box.innerHTML = `
      <div class="kiosk-card kiosk-idle">
        <div style="font-size:2rem;">🤔</div>
        <div style="font-weight:700;">No reconozco esa tarjeta</div>
        <div class="muted">Revisa el código o pídele ayuda a tu profesor.</div>
        <div class="kiosk-timer"><div id="kioskTimerBar"></div></div>
      </div>`;
    scheduleKioskClear(6);
    return;
  }
  scanFeedback(true);
  ensureRewardsConfig();
  // En el orden de los cursos (no del curso activo)
  const order = state.groups.map(g=> g.id);
  matches.sort((a,b)=> order.indexOf(a.group.id) - order.indexOf(b.group.id));
  const student = matches[0].student;
  const multi = matches.length > 1;
  box.innerHTML = `
    <div class="kiosk-card">
      <div style="text-align:center;">
        <div class="kiosk-name">${escapeHtml(student.name)}</div>
        <div class="muted">${multi ? matches.length + ' asignaturas' : escapeHtml(matches[0].group.name)}${student.cardAlias ? ' · “' + escapeHtml(student.cardAlias) + '”' : ''}</div>
      </div>
      ${matches.map(m=> kioskCourseBlockHtml(m.group, m.student, multi)).join(multi ? '<hr class="divider">' : '')}
      <div class="row" style="justify-content:center; margin-top:12px;">
        <button class="btn btn-accent" onclick="showKioskIdle()">Listo ✓</button>
      </div>
      <div class="kiosk-timer"><div id="kioskTimerBar"></div></div>
    </div>`;
  document.getElementById('kioskOverlay')?.scrollTo({ top: 0, behavior: 'smooth' });
  scheduleKioskClear(multi ? 25 : 15);
}

function submitKioskManualCode(){
  const input = document.getElementById('kioskManualCode');
  if(!input) return;
  const val = input.value;
  input.value = '';
  input.blur();
  if(!val.trim()) return;
  showKioskStudent(val);
}

function askKioskExit(){
  const box = document.getElementById('kioskExitBox');
  if(!box) return;
  if(!state.consultaPin){ exitKiosk(); return; }
  box.innerHTML = `
    <div class="kiosk-card" style="text-align:center;">
      <div style="font-weight:700; margin-bottom:6px;">PIN del profesor para salir</div>
      <div class="row" style="justify-content:center; gap:6px; flex-wrap:nowrap;">
        <input type="password" id="kioskExitPin" inputmode="numeric" maxlength="6" autocomplete="off" style="max-width:140px; text-align:center; letter-spacing:4px;" onkeydown="if(event.key==='Enter') confirmKioskExit()">
        <button class="btn btn-accent btn-sm" onclick="confirmKioskExit()">Salir</button>
        <button class="btn btn-outline btn-sm" onclick="closeKioskExitBox()">Cancelar</button>
      </div>
      <p class="muted" id="kioskExitMsg" style="color:var(--danger); min-height:1.2em; margin:6px 0 0;"></p>
    </div>`;
  setTimeout(()=> document.getElementById('kioskExitPin')?.focus(), 50);
  if(kioskExitTimer) clearTimeout(kioskExitTimer);
  kioskExitTimer = setTimeout(closeKioskExitBox, 20000);
}
function closeKioskExitBox(){
  if(kioskExitTimer){ clearTimeout(kioskExitTimer); kioskExitTimer = null; }
  const box = document.getElementById('kioskExitBox');
  if(box) box.innerHTML = '';
}
function confirmKioskExit(){
  const input = document.getElementById('kioskExitPin');
  if(!input) return;
  if(input.value.trim() === String(state.consultaPin || '')){
    exitKiosk();
  } else {
    input.value = '';
    const msg = document.getElementById('kioskExitMsg');
    if(msg) msg.textContent = 'PIN incorrecto';
    scanFeedback(false);
  }
}

function exitKiosk(){
  kioskActive = false;
  try{ localStorage.removeItem(KIOSK_FLAG); }catch(e){}
  clearKioskTimers();
  closeKioskExitBox();
  qrScanner.wanted = false;
  if(qrScanner.timer){ clearTimeout(qrScanner.timer); qrScanner.timer = null; }
  if(qrScanner.stream){ qrScanner.stream.getTracks().forEach(t=> t.stop()); qrScanner.stream = null; }
  document.getElementById('kioskOverlay')?.remove();
  document.body.style.overflow = '';
  try{ if(kioskWakeLock){ kioskWakeLock.release(); } }catch(e){}
  kioskWakeLock = null;
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  renderMain();
  showToast('Saliste del modo consulta');
}

/* ============ ENVÍO DE INFORMES POR CORREO (Gmail) ============ */
/* El permiso para enviar correos se pide aparte y solo al momento de enviar (no afecta la conexión con Drive). */
const GMAIL_SEND_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
const DEFAULT_MAIL_TEMPLATE = {
  subject: 'Informe de {curso} – {nombre}',
  body: 'Hola {primer_nombre}:\n\nTe envío adjunto tu informe de {curso}, con el registro de tu asistencia, trabajo en clases, calificaciones, entregas, décimas y puntos al {fecha}.\n\nSi tienes dudas sobre algún registro, lo conversamos en clases.\n\nSaludos cordiales.',
  includeObs: false,
  includeBitacora: false,
};
let gmailToken = null;          // { access_token, expires_at } — solo en memoria
let mailSendState = null;       // { groupId, selected:Set, status:{studentId:{state,msg}}, sending, confirming }

function ensureMailTemplate(){
  if(!state.mailTemplate) state.mailTemplate = { ...DEFAULT_MAIL_TEMPLATE };
  return state.mailTemplate;
}
const DEFAULT_CARD_MAIL_TEMPLATE = {
  subject: 'Tu tarjeta de puntos digital – {curso}',
  body: 'Hola {primer_nombre}:\n\nTe envío tu tarjeta de puntos digital. Guárdala en tu celular: puedes mostrarla en clases en lugar de la tarjeta impresa para sumar puntos y hacer canjes.\n\n{enlace}\n\nLa tarjeta es personal: no la compartas.\n\nSaludos cordiales.',
};
function ensureCardMailTemplate(){
  if(!state.cardMailTemplate) state.cardMailTemplate = { ...DEFAULT_CARD_MAIL_TEMPLATE };
  return state.cardMailTemplate;
}
/* Plantilla del envío abierto: informe (Word) o tarjeta digital (imagen) */
function mailTpl(){ return mailSendState && mailSendState.kind === 'card' ? ensureCardMailTemplate() : ensureMailTemplate(); }
function mailSentField(){ return mailSendState && mailSendState.kind === 'card' ? 'lastCardSent' : 'lastReportSent'; }
function isValidEmail(email){ return /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/.test(String(email || '').trim()); }
function normalizePersonName(n){ return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function fillMailPlaceholders(text, group, student){
  const first = (student.name || '').trim().split(/\s+/)[0] || '';
  return String(text || '')
    .replace(/\{nombre\}/gi, student.name)
    .replace(/\{primer_nombre\}/gi, first)
    .replace(/\{curso\}/gi, group.name)
