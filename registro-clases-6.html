function openEvalOverride(evalId, studentId){
  const group = getActiveGroup();
  const ev = group.evaluations.find(e=>e.id===evalId);
  if(!ev) return;
  const student = group.students.find(s=>s.id===studentId);
  if(!ev.overrides) ev.overrides = {};
  const current = ev.overrides[studentId] || {};
  const newTotal = prompt(`Puntaje total para ${student ? student.name : 'este estudiante'} (adecuación curricular). Deja vacío para usar el valor por defecto (${ev.totalScore}):`, current.totalScore !== undefined ? current.totalScore : '');
  if(newTotal === null) return;
  const newExigencia = prompt(`% de exigencia para ${student ? student.name : 'este estudiante'}. Deja vacío para usar el valor por defecto (${ev.exigencia}%):`, current.exigencia !== undefined ? current.exigencia : '');
  if(newExigencia === null) return;
  const override = {};
  if(newTotal.trim() !== '' && Number(newTotal) > 0) override.totalScore = Number(newTotal);
  if(newExigencia.trim() !== '' && Number(newExigencia) > 0) override.exigencia = Number(newExigencia);
  if(Object.keys(override).length === 0){
    delete ev.overrides[studentId];
  } else {
    ev.overrides[studentId] = override;
  }
  saveState();
  renderEvalScores(group, ev);
  showToast('Adecuación curricular guardada');
}

/* ============ EXPORTAR CALIFICACIONES A EXCEL (con fórmulas editables) ============ */
function colLetter(n){
  let s = '';
  while(n > 0){
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function addCalificacionesSheet(workbook, group){
  const evals = getActiveEvaluations(group);
  const gradeGroups = getActiveGradeGroups(group);
  if(evals.length === 0 || group.students.length === 0) return false;

  const ws = workbook.addWorksheet('Calificaciones');
  const blockColors = ['F1ECFC','E6F8EF','FDF3DE','E7F1FC','FCEAF3'];

  let col = 2;
  let standaloneColorIdx = 0;
  const blocks = evals.map((ev)=>{
    const scoreCol = col, totalCol = col+1, exigCol = col+2, notaCol = col+3;
    col += 4;
    let color;
    if(ev.gradeGroupId){
      const gg = gradeGroups.find(g=>g.id===ev.gradeGroupId);
      color = gg ? gradeGroupColor(gg.id).bg.replace('#','') : blockColors[0];
    } else {
      color = blockColors[standaloneColorIdx % blockColors.length];
      standaloneColorIdx++;
    }
    return { ev, scoreCol, totalCol, exigCol, notaCol, color };
  });

  // Una columna extra por cada grupo de notas: su "nota sumativa" (promedio de sus evaluaciones miembro)
  const groupSummaryCols = gradeGroups
    .map(gg=>({ gg, memberBlocks: blocks.filter(b=> b.ev.gradeGroupId === gg.id) }))
    .filter(g=> g.memberBlocks.length > 0)
    .map(g=>{ const c = col; col++; return { ...g, col: c }; });

  const promedioCol = col; col++;
  const finalCol = col; col++;

  ws.mergeCells(1,1,2,1);
  const studentHeader = ws.getCell(1,1);
  studentHeader.value = 'Estudiante';
  studentHeader.font = { bold:true, color:{argb:'FF2B2A3D'} };
  studentHeader.alignment = { vertical:'middle', horizontal:'center' };
  studentHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE9E6F5'} };

  blocks.forEach(b=>{
    ws.mergeCells(1, b.scoreCol, 1, b.notaCol);
    const header = ws.getCell(1, b.scoreCol);
    const gg = b.ev.gradeGroupId ? gradeGroups.find(g=>g.id===b.ev.gradeGroupId) : null;
    header.value = `${b.ev.name}${gg ? ' (' + gg.name + ')' : ' (' + (b.ev.weightType === 'weighted' ? 'pondera ' + b.ev.weightPercent + '%' : 'promedio simple') + ')'}`;
    header.font = { bold:true, size:10, color:{argb:'FF2B2A3D'} };
    header.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    for(let c=b.scoreCol; c<=b.notaCol; c++){
      ws.getCell(1,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
      ws.getCell(2,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+b.color} };
    }
    const subHeaders = ['Puntaje','Total','% Exig.','Nota'];
    [b.scoreCol,b.totalCol,b.exigCol,b.notaCol].forEach((c,i)=>{
      const cell = ws.getCell(2,c);
      cell.value = subHeaders[i];
      cell.font = { bold:true, size:9, color:{argb:'FF2B2A3D'} };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    });
  });

  groupSummaryCols.forEach(g=>{
    const groupColorObj = gradeGroupColor(g.gg.id);
    const bgHex = groupColorObj.bg.replace('#','');
    const textHex = groupColorObj.text.replace('#','');
    ws.mergeCells(1, g.col, 2, g.col);
    const cell = ws.getCell(1, g.col);
    cell.value = `${g.gg.name} (nota sumativa · ${g.gg.weightType === 'weighted' ? 'pondera ' + g.gg.weightPercent + '%' : 'promedio simple'})`;
    cell.font = { bold:true, size:9, color:{argb:'FF'+textHex} };
    cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF'+bgHex} };
  });

  ws.mergeCells(1, promedioCol, 2, promedioCol);
  const promHeader = ws.getCell(1, promedioCol);
  promHeader.value = 'Promedio simple';
  promHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  promHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  promHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  ws.mergeCells(1, finalCol, 2, finalCol);
  const finalHeader = ws.getCell(1, finalCol);
  finalHeader.value = 'Nota final';
  finalHeader.font = { bold:true, color:{argb:'FFFFFFFF'} };
  finalHeader.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  finalHeader.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2B2A3D'} };

  group.students.forEach((student, si)=>{
    const rowNum = 3 + si;
    ws.getCell(rowNum, 1).value = student.name;
    ws.getCell(rowNum, 1).font = { bold:true };

    // notaCellByEvalId: referencia de celda "Nota" de cada evaluación, para poder agruparlas después
    const notaCellByEvalId = {};
    blocks.forEach(b=>{
      const scoreVal = b.ev.scores ? b.ev.scores[student.id] : null;
      const override = b.ev.overrides ? b.ev.overrides[student.id] : null;
      const totalVal = (override && override.totalScore != null) ? override.totalScore : b.ev.totalScore;
      const exigVal = (override && override.exigencia != null) ? override.exigencia : b.ev.exigencia;

      ws.getCell(rowNum, b.scoreCol).value = (scoreVal !== null && scoreVal !== undefined) ? scoreVal : null;
      ws.getCell(rowNum, b.totalCol).value = totalVal;
      ws.getCell(rowNum, b.exigCol).value = exigVal;
      [b.scoreCol, b.totalCol, b.exigCol].forEach(c=>{
        ws.getCell(rowNum, c).alignment = { horizontal:'center', vertical:'middle' };
      });

      const S = colLetter(b.scoreCol) + rowNum;
      const T = colLetter(b.totalCol) + rowNum;
      const E = colLetter(b.exigCol) + rowNum;
      const pExpr = `MIN(1,MAX(0,${S}/${T}))`;
      const exigExpr = `(${E}/100)`;
      const gradeFormula = `ROUND(MIN(7,MAX(1,IF(${pExpr}<=${exigExpr},1+3*(${pExpr}/${exigExpr}),4+3*(${pExpr}-${exigExpr})/(1-${exigExpr})))),1)`;
      const notaCell = ws.getCell(rowNum, b.notaCol);
      notaCell.value = { formula: `IF(OR(${S}="",${T}=0),"",${gradeFormula})` };
      notaCell.alignment = { horizontal:'center', vertical:'middle' };
      notaCell.font = { bold:true };
      notaCellByEvalId[b.ev.id] = colLetter(b.notaCol) + rowNum;
    });

    // Unidades de calificación: evaluaciones sueltas (su propia Nota) + grupos de notas (su columna "sumativa")
    const units = [];
    blocks.filter(b=> !b.ev.gradeGroupId).forEach(b=>{
      units.push({ ref: notaCellByEvalId[b.ev.id], weighted: b.ev.weightType === 'weighted', weightPercent: b.ev.weightPercent || 0 });
    });
    groupSummaryCols.forEach(g=>{
      const memberRefs = g.memberBlocks.map(b=> notaCellByEvalId[b.ev.id]);
      const sumCell = ws.getCell(rowNum, g.col);
      sumCell.value = { formula: `IFERROR(ROUND(AVERAGE(${memberRefs.join(',')}),1),"")` };
      sumCell.alignment = { horizontal:'center', vertical:'middle' };
      sumCell.font = { bold:true };
      units.push({ ref: colLetter(g.col) + rowNum, weighted: g.gg.weightType === 'weighted', weightPercent: g.gg.weightPercent || 0 });
    });

    // Promedio simple: promedio de TODAS las notas individuales (no de las unidades), igual que en la app
    const allNotaRefs = Object.values(notaCellByEvalId);
    const promCell = ws.getCell(rowNum, promedioCol);
    promCell.value = { formula: `IFERROR(ROUND(AVERAGE(${allNotaRefs.join(',')}),1),"")` };
    promCell.alignment = { horizontal:'center', vertical:'middle' };

    // Nota final: pondera las unidades (evaluaciones sueltas ponderadas + grupos ponderados),
    // reparte el % restante entre las unidades de "promedio simple" (sueltas o grupos)
    const weightedUnits = units.filter(u=>u.weighted);
    const simpleUnits = units.filter(u=>!u.weighted);
    const weightTotal = weightedUnits.reduce((s,u)=> s + (u.weightPercent/100), 0);
    const remaining = Math.max(0, 1 - weightTotal);

    let finalFormula;
    if(weightedUnits.length > 0 && simpleUnits.length > 0){
      const weightedTerms = weightedUnits.map(u=> `${u.ref}*${(u.weightPercent/100)}`).join('+');
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})+AVERAGE(${simpleUnits.map(u=>u.ref).join(',')})*${remaining})),1),"")`;
    } else if(weightedUnits.length > 0){
      const weightedTerms = weightedUnits.map(u=> `${u.ref}*${(u.weightPercent/100)}`).join('+');
      const divisor = (weightTotal > 0 && weightTotal < 1) ? `/${weightTotal}` : '';
      finalFormula = `IFERROR(ROUND(MIN(7,MAX(1,(${weightedTerms})${divisor})),1),"")`;
    } else {
      finalFormula = `IFERROR(ROUND(AVERAGE(${simpleUnits.map(u=>u.ref).join(',')}),1),"")`;
    }
    const finalCellObj = ws.getCell(rowNum, finalCol);
    finalCellObj.value = { formula: finalFormula };
    finalCellObj.alignment = { horizontal:'center', vertical:'middle' };
    finalCellObj.font = { bold:true, color:{argb:'FF6C4EE3'} };
  });

  ws.getColumn(1).width = 22;
  for(let c=2; c<=finalCol; c++){ ws.getColumn(c).width = 11; }
  ws.getRow(1).height = 34;
  ws.getRow(2).height = 26;
  return true;
}

  showToast('Excel de calificaciones exportado');
}

/* ============ EXPORTAR A EXCEL (.xlsx con formato, con respaldo CSV sin conexión) ============ */
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportGroupToCSVFallback(group){
  const sessions = getActiveSessions(group).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sessions.length === 0){ showToast('No hay registros para exportar'); return; }

  const indicatorMap = new Map();
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    inds.forEach(ind=>{ if(!indicatorMap.has(ind.id)) indicatorMap.set(ind.id, ind.name); });
  });
  const indicatorIds = [...indicatorMap.keys()];

  const header = ['Fecha','Hora','Estudiante','Asistencia', ...indicatorIds.map(id=>indicatorMap.get(id)), 'Promedio','Observaciones'];
  const rows = [header];

  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    const indIdsInSession = new Set(inds.map(i=>i.id));
    group.students.forEach(student=>{
      const entry = session.entries.find(e=> e.studentId === student.id);
      if(!entry) return;
      const present = isEntryPresent(entry);
      let scoreSum = 0, scoreCount = 0;
      const indicatorValues = indicatorIds.map(id=>{
        if(present && indIdsInSession.has(id)){
          const v = entry.cotejo[id];
          if(v !== null && v !== undefined){ scoreSum += v; scoreCount++; return v; }
        }
        return '';
      });
      const promedio = (present && scoreCount > 0) ? Math.round((scoreSum/scoreCount)*10)/10 : '';
      rows.push([
        formatDate(session.date), session.time, student.name, present ? 'Presente' : 'Ausente',
        ...indicatorValues, promedio, entry.observaciones || ''
      ]);
    });
  });

  const csvContent = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeGroupName = group.name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
  a.href = url;
  a.download = `registro_${safeGroupName}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sin conexión: se exportó un .csv simple (sin colores). Ábrelo con Excel.');
}

  const indicatorMap = new Map();
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    inds.forEach(ind=>{ if(!indicatorMap.has(ind.id)) indicatorMap.set(ind.id, ind.name); });
  });
  const indicatorIds = [...indicatorMap.keys()];
  const promedioCol = 5 + indicatorIds.length;
  const obsCol = promedioCol + 1;

  const headers = ['Fecha','Hora','Estudiante','Asistencia', ...indicatorIds.map(id=>indicatorMap.get(id)), 'Promedio','Observaciones'];
  headers.forEach((h,i)=>{

    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF6C4EE3'} };
    cell.alignment = { wrapText:true, vertical:'middle' };
  });

  let rowNum = 2;
  sessions.forEach(session=>{
    const inds = session.indicatorSnapshot || group.indicators;
    const indIdsInSession = new Set(inds.map(i=>i.id));
    group.students.forEach(student=>{
      const entry = session.entries.find(e=> e.studentId === student.id);
      if(!entry) return; // el estudiante no estaba en el curso al momento de esta clase

      const present = isEntryPresent(entry);
      ws.getCell(rowNum, 1).value = formatDate(session.date);
      ws.getCell(rowNum, 2).value = session.time;
      ws.getCell(rowNum, 3).value = student.name;

      const asistCell = ws.getCell(rowNum, 4);
      asistCell.value = present ? 'Presente' : 'Ausente';
      asistCell.font = present ? { bold:true, color:{argb:'FF22B573'} } : { bold:true, color:{argb:'FFD8493E'} };
      if(!present) asistCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFDECEA'} };

      let scoreSum = 0, scoreCount = 0;
      indicatorIds.forEach((id, i)=>{
        const col = 5 + i;
        if(present && indIdsInSession.has(id)){
          const v = entry.cotejo[id];
          ws.getCell(rowNum, col).value = (v !== null && v !== undefined) ? v : '';
          if(v !== null && v !== undefined){ scoreSum += v; scoreCount++; }
        }
      });

      ws.getCell(rowNum, promedioCol).value = (present && scoreCount > 0) ? Math.round((scoreSum/scoreCount)*10)/10 : '';
      ws.getCell(rowNum, obsCol).value = entry.observaciones || '';
      rowNum++;
    });
  });

  ws.getColumn(1).width = 12;
  ws.getColumn(2).width = 8;
  ws.getColumn(3).width = 24;
  ws.getColumn(4).width = 11;
  for(let i=0;i<indicatorIds.length;i++){ ws.getColumn(5+i).width = 14; }
  ws.getColumn(promedioCol).width = 11;
  ws.getColumn(obsCol).width = 30;
  ws.getRow(1).height = 26;

  // Hoja liviana con el resumen por estudiante (una sola fila cada uno)
  const wsSummary = workbook.addWorksheet('Asistencia - Resumen');
  ['Estudiante','Presentes','Ausentes','Obtenido','Posible','% Logro'].forEach((h,i)=>{
    const cell = wsSummary.getCell(1, i+1);
    cell.value = h;
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF6C4EE3'} };
  });
  group.students.forEach((student, i)=>{
    const stats = computeStudentStats(group, student.id);
    const row = 2 + i;
    wsSummary.getCell(row,1).value = student.name;
    wsSummary.getCell(row,2).value = stats.presentCount;
    wsSummary.getCell(row,3).value = stats.absentCount;
    wsSummary.getCell(row,4).value = stats.obtained;
    wsSummary.getCell(row,5).value = stats.maxPossible;
    wsSummary.getCell(row,6).value = stats.percent === null ? '' : stats.percent + '%';
  });
  wsSummary.getColumn(1).width = 26;
  for(let c=2;c<=6;c++){ wsSummary.getColumn(c).width = 12; }

  return true;
}

function safeFileName(name){
  return name.replace(/[^a-zA-Z0-9_\-]+/g,'_');
}
async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function xmlEscapeWord(str){
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function wordCell(text, opts={}){
  const bold = opts.bold ? '<w:b/>' : '';
  const shading = opts.shade ? `<w:shd w:val="clear" w:fill="${opts.shade}"/>` : '';
  const color = opts.color ? `<w:color w:val="${opts.color}"/>` : '';
  return `<w:tc><w:tcPr>${shading}</w:tcPr><w:p><w:pPr><w:rPr>${bold}${color}</w:rPr></w:pPr><w:r><w:rPr>${bold}${color}</w:rPr><w:t xml:space="preserve">${xmlEscapeWord(text)}</w:t></w:r></w:p></w:tc>`;
}
function wordRow(cellsHtml){
  return `<w:tr>${cellsHtml}</w:tr>`;
}

  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>

  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const documentRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr><w:sz w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults>

      <w:right w:val="single" w:sz="4" w:color="auto"/>
      <w:insideH w:val="single" w:sz="4" w:color="auto"/>

  wordFolder.file('document.xml', documentXml);
  wordFolder.file('styles.xml', stylesXml);

async function exportStudentHistoryToWord(studentId){
  if(typeof JSZip === 'undefined'){
    showToast('Se necesita conexión a internet para exportar a Word.');
    return;
  }
  const group = getActiveGroup();
  const student = group.students.find(s=>s.id===studentId);
  if(!student) return;

  const stats = computeStudentStats(group, studentId);
  const gradeResult = computeStudentFinalGrade(group, studentId);
  const decimasTotal = computeStudentDecimasTotal(group, studentId);

  let body = '';
  body += wordHeading(`Historial completo - ${student.name}`, 32);
  body += wordParagraph(`Curso: ${group.name}`);
  body += wordHeading('Resumen', 24);
  body += wordTable(
    ['Indicador','Valor'],
    [
      ['Clases registradas', String(stats.total)],
      ['Presente', String(stats.presentCount)],
      ['Ausente', String(stats.absentCount)],
      ['Puntaje obtenido', `${stats.obtained} / ${stats.maxPossible}`],
      ['% de logro', stats.percent !== null ? stats.percent + '%' : '-'],
      ['Décimas acumuladas', '+' + decimasTotal.toFixed(1)],
      ['Promedio simple (calificaciones)', gradeResult.promedioSimple !== null ? gradeResult.promedioSimple.toFixed(1) : '-'],
      ['Nota final', gradeResult.finalGrade !== null ? gradeResult.finalGrade.toFixed(1) : '-'],
    ],
    [3500,1500]
  );

  const sessions = getActiveSessions(group)
    .filter(s=> s.entries.some(e=>e.studentId===studentId))
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  body += wordHeading('Historial de clases', 24);
  if(sessions.length === 0){
    body += wordParagraph('Sin registros.');
  } else {
    body += wordTable(
      ['Fecha','Hora','Asistencia','Puntaje','Observaciones'],
      sessions.map(s=>{
        const entry = s.entries.find(e=>e.studentId===studentId);
        const present = isEntryPresent(entry);
        const inds = s.indicatorSnapshot || group.indicators;
        const scores = inds.map(i=> entry.cotejo[i.id]).filter(v=> v!==null && v!==undefined);
        const total = scores.length ? scores.reduce((a,b)=>a+b,0) : 0;
        return [formatDate(s.date), s.time, present ? 'Presente' : 'Ausente', present ? String(total) : '-', entry.observaciones || ''];
      }),
      [1200,1000,1200,1000,2600]
    );
  }

  const evals = getActiveEvaluations(group);
  body += wordHeading('Calificaciones', 24);
  if(evals.length === 0){
    body += wordParagraph('Sin evaluaciones registradas.');
  } else {
    body += wordTable(
      ['Evaluación','Nota'],
      evals.map(e=>{
        const nota = computeStudentEvalGrade(e, studentId);
        return [e.name, nota !== null ? nota.toFixed(1) : '-'];
      }),
      [3500,1500]
    );
  }

  const decimaSessions = getActiveDecimas(group).filter(d=> d.values && d.values[studentId] !== null && d.values[studentId] !== undefined);
  body += wordHeading('Décimas', 24);
  if(decimaSessions.length === 0){
    body += wordParagraph('Sin décimas registradas.');
  } else {
    body += wordTable(
      ['Fecha','Motivo','Valor'],
      decimaSessions.map(d=> [formatDate(d.date), d.note || '', '+' + (d.values[studentId]).toFixed(1)]),
      [1500,2500,1000]
    );
  }

  const bitacoraEntries = getActiveBitacora(group)
    .filter(e=> (e.studentIds||[]).length === 0 || e.studentIds.includes(studentId))
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  body += wordHeading('Bitácora', 24);
  if(bitacoraEntries.length === 0){
    body += wordParagraph('Sin registros de bitácora.');
  } else {
    body += wordTable(
      ['Fecha','Categoría','Actividad pedagógica','Observaciones'],
      bitacoraEntries.map(e=> [formatDate(e.date), BITACORA_CATEGORIAS[e.categoria || ''], e.actividadPedagogica || '', e.observaciones || '']),
      [1200,1300,2500,2500]
    );
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${body}</w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const documentRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr><w:sz w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults>
  <w:style w:type="table" w:styleId="TableGrid">
    <w:name w:val="Table Grid"/>
    <w:tblPr><w:tblBorders>
      <w:top w:val="single" w:sz="4" w:color="auto"/>
      <w:left w:val="single" w:sz="4" w:color="auto"/>
      <w:bottom w:val="single" w:sz="4" w:color="auto"/>
      <w:right w:val="single" w:sz="4" w:color="auto"/>
      <w:insideH w:val="single" w:sz="4" w:color="auto"/>
      <w:insideV w:val="single" w:sz="4" w:color="auto"/>
    </w:tblBorders></w:tblPr>
  </w:style>
</w:styles>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml);
  zip.folder('_rels').file('.rels', relsXml);
  const wordFolder = zip.folder('word');
  wordFolder.file('document.xml', documentXml);
  wordFolder.file('styles.xml', stylesXml);
  wordFolder.folder('_rels').file('document.xml.rels', documentRelsXml);

  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historial_${safeFileName(student.name)}_${new Date().toISOString().slice(0,10)}.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Historial del estudiante exportado a Word');
}

async function exportAllToExcel(group){
  if(typeof ExcelJS === 'undefined'){
    showToast('Se necesita conexión a internet para generar el Excel completo.');
    return;
  }
  showToast('Generando Excel completo del curso…');
  const workbook = new ExcelJS.Workbook();
  let any = false;
  any = addEstudiantesSheet(workbook, group) || any;
  any = addIndicadoresSheet(workbook, group) || any;
  any = addHorarioSheet(workbook, group) || any;
  any = addAsistenciaSheet(workbook, group) || any;
  any = addCalificacionesSheet(workbook, group) || any;
  any = addDecimasSheet(workbook, group) || any;
  any = addEntregasSheet(workbook, group) || any;
  any = addBitacoraSheet(workbook, group) || any;
  if(!any){ showToast('Este curso todavía no tiene datos para exportar'); return; }

  showToast('Excel completo del curso exportado');
}

/* ============ EXPORTAR CSV SIMPLE (respaldo sin conexión) ============ */
function csvEscapeSimple(val){
  const s = String(val ?? '');
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportSimpleCSV(filenameBase, headers, rows){
  const allRows = [headers, ...rows];
  const csvContent = allRows.map(r=> r.map(csvEscapeSimple).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filenameBase}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Archivo exportado');
}

/* ============ UTILIDADES ============ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

/* ============ RECORDATORIO DE FIN DE CLASE ============ */
function loadReminderSettings(){
  try{
    const raw = localStorage.getItem('reminderSettings');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { enabled: false, minutesBefore: 5 };
}
function saveReminderSettings(settings){
  localStorage.setItem('reminderSettings', JSON.stringify(settings));
}
function getFiredReminders(){
  try{
    const raw = localStorage.getItem('firedReminders');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function markReminderFired(key){
  const fired = getFiredReminders();
  fired[key] = true;
  const todayISO = toISODate(new Date());
  Object.keys(fired).forEach(k=>{ if(!k.endsWith(todayISO)) delete fired[k]; });
  localStorage.setItem('firedReminders', JSON.stringify(fired));
}

function playAlarmSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }, delay);
    };
    beep(0); beep(400); beep(800);
  }catch(e){ console.log('No se pudo reproducir el sonido', e); }
}

let alarmLoopIntervalId = null;

function startAlarmLoop(){
  if(alarmLoopIntervalId) return;
  const pulse = ()=>{
    playAlarmSound();
    if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
  };
  pulse();
  alarmLoopIntervalId = setInterval(pulse, 2200);
}

function stopAlarmLoop(){
  if(alarmLoopIntervalId){
    clearInterval(alarmLoopIntervalId);
    alarmLoopIntervalId = null;
  }
  if(navigator.vibrate) navigator.vibrate(0);
  closeAlarmBanner();
}

function closeAlarmBanner(){
  const overlay = document.getElementById('alarmBannerOverlay');
  if(overlay) overlay.remove();
}

function showAlarmBanner(group, entry, minutesBefore){
  closeAlarmBanner();
  const groupName = group ? group.name : 'Tu clase';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'alarmBannerOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="text-align:center;">
      <div style="font-size:2.4rem;">🔔</div>
      <h2 style="border:none; padding-bottom:0;">${escapeHtml(groupName)}</h2>
      <p class="muted">Termina en ${minutesBefore} minutos — no olvides registrar la clase.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn btn-accent" onclick="stopAlarmAndRegister('${group ? group.id : ''}','${entry.id}')">📝 Registrar ahora</button>
        <button class="btn btn-outline" onclick="stopAlarmLoop()">🔕 Detener alarma</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function stopAlarmAndRegister(groupId, entryId){
  stopAlarmLoop();
  const entry = state.schedule.find(e=>e.id===entryId);
  if(entry) goToClass(entryId);
}

function triggerClassReminder(group, entry, minutesBefore){
  startAlarmLoop();
  showAlarmBanner(group, entry, minutesBefore);
  const groupName = group ? group.name : 'Tu clase';
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Clase por terminar', {
        body: `${groupName} termina en ${minutesBefore} minutos. No olvides registrar la clase.`,
        icon: './icon-192.png'
      });
    }catch(e){}
  }
}

function checkClassReminders(){
  const settings = loadReminderSettings();
  if(!settings.enabled) return;
  const now = new Date();
  const todayISO = toISODate(now);
  const todayWeekday = jsWeekdayToOurDay(now.getDay());
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const fired = getFiredReminders();

  state.schedule.forEach(entry=>{
    if(entry.day !== todayWeekday || !entry.endTime) return;
    const [eh, em] = entry.endTime.split(':').map(Number);
    const endMinutes = eh*60 + em;
    const alertMinutes = endMinutes - (settings.minutesBefore || 5);
    const key = entry.id + '_' + todayISO;
    if(fired[key]) return;
    if(nowMinutes >= alertMinutes && nowMinutes < endMinutes){
      const group = state.groups.find(g=>g.id===entry.groupId);
      triggerClassReminder(group, entry, settings.minutesBefore || 5);
      markReminderFired(key);
    }
  });
}

function showEntregaAlarmBanner(group, entrega, pendientes){
  closeAlarmBanner();
  const dl = getEntregaDeadline(entrega);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'alarmBannerOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font" style="text-align:center;">
      <div style="font-size:2.4rem;">🔔</div>
      <h2 style="border:none; padding-bottom:0;">${escapeHtml(entrega.name)}</h2>
      <p class="muted">${escapeHtml(group.name)} · se cumplió el plazo (${dl ? formatDate(dl.fecha) + ' ' + dl.hora : ''}) y quedan ${pendientes} estudiante(s) sin marcar.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn btn-accent" onclick="stopAlarmAndGoToEntrega('${group.id}','${entrega.id}')">📥 Ir a completar</button>
        <button class="btn btn-outline" onclick="stopAlarmLoop()">🔕 Detener alarma</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function stopAlarmAndGoToEntrega(groupId, entregaId){
  stopAlarmLoop();
  entregaActiveId = entregaId;
  goToEntregasForGroup(groupId);
}
function triggerEntregaReminder(group, entrega, pendientes){
  startAlarmLoop();
  showEntregaAlarmBanner(group, entrega, pendientes);
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Plazo de entrega cumplido', {
        body: `${entrega.name} (${group.name}): quedan ${pendientes} estudiante(s) sin marcar.`,
        icon: './icon-192.png'
      });
    }catch(e){}
  }
}
function checkEntregaReminders(){
  const settings = loadReminderSettings();
  if(!settings.enabled) return;
  const now = new Date();
  const todayISO = toISODate(now);
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const fired = getFiredReminders();

  state.groups.forEach(group=>{
    (group.entregas || []).forEach(entrega=>{
      const dl = getEntregaDeadline(entrega);
      if(!dl || dl.fecha !== todayISO) return;
      const [hh, mm] = dl.hora.split(':').map(Number);
      const limitMinutes = hh*60 + mm;
      if(nowMinutes < limitMinutes) return;
      const key = 'entrega_' + entrega.id + '_' + todayISO;
      if(fired[key]) return;
      const marcados = entrega.estados ? Object.keys(entrega.estados).length : 0;
      const pendientes = Math.max(0, group.students.length - marcados);
      if(pendientes > 0){
        triggerEntregaReminder(group, entrega, pendientes);
      }
      markReminderFired(key);
    });
  });
}

function openReminderSettings(){
  const settings = loadReminderSettings();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'reminderModalOverlay';
  overlay.innerHTML = `
    <div class="modal-box app-font">
      <button class="modal-close" onclick="closeReminderSettings()">✕</button>
      <h2 style="border:none; padding-bottom:0;">🔔 Recordatorio de clases</h2>
      <p class="muted">Suena en bucle con vibración (y notificación, si la permites), hasta que tú la detengas: unos minutos antes de que termine cada clase, y también cuando se cumpla la "hora límite" que fijes en una entrega si aún quedan estudiantes sin marcar.</p>
      <label style="margin-top:10px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="reminderEnabled" style="width:auto;" ${settings.enabled ? 'checked' : ''}> Activar recordatorio
      </label>
      <label style="margin-top:10px;">Minutos antes de que termine la clase</label>
      <input type="number" id="reminderMinutes" min="1" max="60" value="${settings.minutesBefore || 5}">
      <div class="row" style="margin-top:14px;">
        <button class="btn btn-accent btn-sm" onclick="saveReminderSettingsFromModal()">Guardar</button>
        <button class="btn btn-outline btn-sm" onclick="playAlarmSound()">🔊 Probar sonido</button>
      </div>
      <p class="muted" style="font-size:0.74rem; margin-top:10px;">Solo funciona mientras la app esté abierta (en primer o segundo plano) — si la cierras por completo, no sonará. La vibración solo está disponible en Android (Chrome), no en iPhone. Además, solo avisa para clases que tengan configurada una "Hora de término" en el Horario.</p>
    </div>
  `;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeReminderSettings(); });
  document.body.appendChild(overlay);
}
function closeReminderSettings(){
  const overlay = document.getElementById('reminderModalOverlay');
  if(overlay) overlay.remove();
}
function saveReminderSettingsFromModal(){
  const enabled = document.getElementById('reminderEnabled').checked;
  const minutesBefore = Number(document.getElementById('reminderMinutes').value) || 5;
  saveReminderSettings({ enabled, minutesBefore });
  if(enabled && 'Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  showToast('Preferencias de recordatorio guardadas');
  closeReminderSettings();
}

/* ============ TEMA CLARO / OSCURO ============ */
function applyThemeIcon(){
  const btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('themePreference', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('themePreference', 'dark');
  }
  applyThemeIcon();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=> console.log('No se pudo registrar el service worker', err));
  });
}
