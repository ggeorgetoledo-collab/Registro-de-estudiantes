<!DOCTYPE html>
<html lang="es">
<head>
<script>
  (function(){
    try{
      var t = localStorage.getItem('themePreference');
      if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Clases</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C4EE3">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --primary:#6C4EE3;
    --primary-dark:#5638C4;
    --primary-light:#F1ECFC;
    --primary-border:rgba(108,78,227,0.3);
    --bg:#F6F5FB;
    --card-bg:#FFFFFF;
    --text:#2B2A3D;
    --text-dim:#7C7A94;
    --border:#E9E6F5;
    --border-strong:#DAD4F0;
    --success:#22B573;
    --success-light:#E6F8EF;
    --success-border:rgba(34,181,115,0.35);
    --danger:#F0554A;
    --danger-light:#FDECEA;
    --danger-border:rgba(240,85,74,0.35);
    --shadow: 0 6px 20px rgba(76,60,150,0.08);
    --radius: 12px;
  }
  :root[data-theme="dark"]{
    --primary:#A78BFA;
    --primary-dark:#C4B5FD;
    --primary-light:rgba(167,139,250,0.16);
    --primary-border:rgba(167,139,250,0.4);
    --bg:#17141F;
    --card-bg:#221E2E;
    --text:#EDEAF5;
    --text-dim:#A79FC4;
    --border:#332C47;
    --border-strong:#453A5E;
    --success:#34D399;
    --success-light:rgba(52,211,153,0.16);
    --success-border:rgba(52,211,153,0.4);
    --danger:#F87171;
    --danger-light:rgba(248,113,113,0.16);
    --danger-border:rgba(248,113,113,0.4);
    --shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app-font{ font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  h1, h2, .heading-font{ font-family:'Poppins', 'Inter', sans-serif; }
  header{
    background:var(--card-bg);
    color:var(--text);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:1px solid var(--border);
    box-shadow: 0 2px 10px rgba(76,60,150,0.05);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.1px;
    color:var(--primary-dark);
  }
  header .subtitle{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    color:var(--text-dim);
    margin-top:2px;
    letter-spacing:0.1px;
  }
  #icon-actions-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Inter', sans-serif;
    flex-wrap:wrap;
  }
  #selector-bar{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:10px 24px;
    font-family:'Inter', sans-serif;
  }
  .selector-group{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .selector-label{
    font-size:0.72rem;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-right:2px;
  }
  select, input, textarea, button{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
  }
  select#groupSelect{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--card-bg);
    color:var(--text);
    min-width:180px;
  }
  nav.tabs{
    display:flex;
    gap:0;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:0 16px;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Inter', sans-serif;
    background:none;
    border:none;
    padding:14px 18px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:0.92rem;
    font-weight:600;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    letter-spacing:0.1px;
  }
  nav.tabs button.active{
    color:var(--primary);
    border-bottom:3px solid var(--primary);
    font-weight:700;
  }
  nav.subtabs{
    background:var(--bg);
    padding:0 16px;
  }
  nav.subtabs button{
    font-size:0.84rem;
    padding:10px 14px;
  }
  main{
    max-width:980px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .card h2{
    margin-top:0;
    font-size:1.08rem;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.1px;
    padding-bottom:12px;
    margin-bottom:14px;
    border-bottom:2px solid var(--primary-light);
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  label{
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    color:var(--text-dim);
    display:block;
    margin-bottom:4px;
    font-weight:500;
  }
  input[type=text], input[type=date], input[type=time], input[type=number], textarea, select{
    padding:9px 10px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    background:var(--card-bg);
    color:var(--text);
    width:100%;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
  }
  input::placeholder, textarea::placeholder{ color:#B4B0C9; }
  textarea{ min-height:60px; resize:vertical; font-family:'Inter', sans-serif; }
  .btn{
    font-family:'Inter', sans-serif;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
    font-size:0.88rem;
    transition:transform .05s ease, filter .1s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-accent{ background:var(--primary); color:#fff; }
  .btn-accent:hover{ background:var(--primary-dark); }
  .btn-ink{ background:#2B2A3D; color:#fff; }
  .btn-ink:hover{ filter:brightness(1.2); }
  .btn-outline{ background:transparent; color:var(--primary); border:1px solid var(--border-strong); }
  .btn-outline:hover{ background:var(--primary-light); border-color:var(--primary-border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger-border); }
  .btn-danger:hover{ background:var(--danger-light); }
  .btn-sm{ padding:5px 10px; font-size:0.78rem; }
  table{ width:100%; border-collapse:collapse; font-family:'Inter', sans-serif; font-size:0.88rem; }
  th, td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text); }
  th{ color:var(--text-dim); font-weight:700; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; }
  tr:last-child td{ border-bottom:none; }
  .pill{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:2px 10px;
    border-radius:20px;
    font-size:0.75rem;
    font-family:'Inter', sans-serif;
    font-weight:700;
    border:1px solid var(--primary-border);
  }
  .pill-success{ background:var(--success-light); color:var(--success); border-color:var(--success-border); }
  .pill-danger{ background:var(--danger-light); color:var(--danger); border-color:var(--danger-border); }

    text-align:center;
    padding:30px 10px;
    color:var(--text-dim);
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
  }
  .score-select{
    width:64px;
    padding:6px;

  }
  .indicator-header-name{ max-width:110px; color:var(--text-dim); }
  .flex-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .accordion-header{ cursor:pointer; user-select:none; }
  .accordion-header:hover{ opacity:0.85; }
  .accordion-chevron{ display:inline-block; width:14px; color:var(--primary); font-weight:700; }
  .quick-links-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));

  .quick-link-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:16px 8px;
    font-size:1.5rem;
    line-height:1.3;
    text-align:center;
  }
  .quick-link-btn span{ font-size:0.72rem; font-weight:700; }
  .muted{ color:var(--text-dim); font-family:'Inter', sans-serif; font-size:0.82rem; }
  .divider{ border:none; border-top:1px solid var(--border); margin:16px 0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--primary);
    color:#fff;
    padding:10px 20px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    font-weight:700;
    box-shadow:0 4px 16px rgba(76,60,150,0.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:999;
  }
  .toast.show{ opacity:1; }
  .indicator-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--primary-light);
    color:var(--text);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--primary-border);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    margin:4px 6px 4px 0;
  }
  .indicator-tag button{
    background:none; border:none; color:var(--danger); cursor:pointer; font-weight:700; padding:0;
  }
  .file-drop{
    border:2px dashed var(--border-strong);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-family:'Inter', sans-serif;
    color:var(--text-dim);
    font-size:0.85rem;
    cursor:pointer;
  }
  .file-drop:hover{ background:var(--primary-light); border-color:var(--primary); }
  .student-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-family:'Inter', sans-serif;
  }
  .student-name-link{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--primary-dark); font-weight:600; font-size:0.92rem; text-align:left;
    font-family:'Inter', sans-serif;
  }
  .student-name-link:hover{ text-decoration:underline; }
  .avg-badge{
    font-weight:700;
    color:var(--primary);
  }
  .calendar-grid{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:6px;
    font-family:'Inter', sans-serif;
  }
  .calendar-day{
    min-width:130px;
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
  }
  .calendar-day-header{
    font-size:0.76rem;
    font-weight:700;
    color:var(--text);
    text-align:center;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--border-strong);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .calendar-empty{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    padding:10px 0;
  }
  .calendar-block{
    border:1px solid;
    border-radius:7px;
    padding:7px 8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .08s ease, filter .1s ease;
  }
  .calendar-block:hover{ transform:translateY(-2px); filter:brightness(0.97); }
  .calendar-block-time{ font-size:0.72rem; font-weight:700; opacity:0.85; }
  .calendar-block-group{ font-size:0.85rem; font-weight:700; margin-top:2px; }
  .calendar-block-note{ font-size:0.72rem; opacity:0.75; margin-top:2px; }

  /* Calendario mensual */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav h3{ margin:0; font-family:'Poppins', sans-serif; font-size:1rem; color:var(--text); text-transform:capitalize; }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    font-family:'Inter', sans-serif;
  }
  .month-grid-header{
    text-align:center;
    font-size:0.68rem;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .month-cell{
    min-height:64px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px;
    cursor:pointer;
    background:var(--card-bg);
    transition:background .12s ease;
    position:relative;
  }
  .month-cell:hover{ background:var(--primary-light); }
  .month-cell.other-month{ opacity:0.35; }
  .month-cell.is-today{ border-color:var(--primary); border-width:2px; }
  .month-cell.is-selected{ background:var(--primary-light); }
  .month-cell-num{ font-size:0.78rem; font-weight:700; color:var(--text); }
  .month-cell-dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
  .month-dot{ width:7px; height:7px; border-radius:50%; }
  .month-dot.pending{ background:transparent; border:1.5px solid currentColor; }
  .month-dot.done{ background:currentColor; border:1.5px solid currentColor; }
  .day-detail-list{ margin-top:6px; }
  .day-detail-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer;
    border:1px solid;
  }

  /* Modal de detalle de estudiante */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,42,61,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:16px;
  }
  .modal-box{
    background:var(--card-bg); border-radius:14px; padding:24px;
    max-width:420px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    font-family:'Inter', sans-serif;
  }
  .modal-close{
    float:right; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-dim);
  }
  .pie-chart{
    width:140px; height:140px; border-radius:50%; margin:14px auto;
  }
  .stat-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .stat-row:last-child{ border-bottom:none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Registro de Clases</h1>
    <div class="subtitle">Asistencia, observaciones y cotejo por indicadores — funciona sin conexión</div>
    <div class="subtitle" id="driveHeaderStatus" style="font-weight:700; margin-top:2px;"></div>
  </div>
  <div id="icon-actions-wrap">
    <button class="btn btn-outline btn-sm" id="driveSettingsBtn" onclick="openDriveSettings()" title="Google Drive">☁️ Drive</button>
    <button class="btn btn-outline btn-sm" id="reminderSettingsBtn" onclick="openReminderSettings()" title="Recordatorio de clases">🔔</button>
    <button class="btn btn-outline btn-sm" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
  </div>
</header>

<div id="selector-bar">
  <details id="periodoDetails" class="selector-group">
    <summary class="selector-label" style="cursor:pointer;">⚙️ Más opciones (Periodo) ▾</summary>
    <div class="selector-group" style="margin-top:8px;">
      <select id="periodSelect" onchange="changePeriod(this.value)" title="Periodo lectivo"></select>
      <button class="btn btn-accent btn-sm" onclick="createPeriod()" title="Crear nuevo periodo">+</button>
      <button class="btn btn-outline btn-sm" onclick="editPeriod()" title="Editar periodo actual">✎</button>
      <button class="btn btn-danger btn-sm" onclick="deletePeriod()" title="Eliminar periodo actual">🗑</button>
    </div>
  </details>
  <div class="selector-group">
    <span class="selector-label">Curso</span>
    <select id="groupSelect"></select>
    <button class="btn btn-accent btn-sm" id="newGroupBtn">+ Curso</button>
  </div>
</div>

<nav class="tabs app-font" id="modulesNav">
  <button data-module="inicio" class="active">🏠 Inicio</button>
  <button data-module="horario">📅 Horario</button>
  <button data-module="cursos">👥 Cursos</button>
  <button data-module="trabajo">📝 Trabajo en clases</button>
  <button data-module="calificaciones">🎯 Calificaciones</button>
  <button data-module="bitacora">📓 Bitácora</button>
</nav>
<nav class="tabs subtabs app-font" id="subTabsNav" style="display:none;"></nav>

<main id="main"></main>

<div class="toast app-font" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ============ ESTADO Y PERSISTENCIA (100% local, sin conexión) ============ */
const STORAGE_KEY = 'registroClasesApp_v1';

function getStorageKeyForEmail(email){
  return email ? `${STORAGE_KEY}::${email}` : STORAGE_KEY;
}
let currentStorageKey = getStorageKeyForEmail(localStorage.getItem('gdrive_email'));

function loadState(){
  try{
    const raw = localStorage.getItem(currentStorageKey);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Error leyendo almacenamiento', e); }
  return { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
}

let state = loadState();

function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem(currentStorageKey, JSON.stringify(state));
  }catch(e){
    console.error('Error guardando', e);
    showToast('No se pudo guardar (almacenamiento lleno o bloqueado por el navegador)');
  }
  pushToDrive();
}

// Separa el almacenamiento local cuando se detecta una cuenta de Google distinta a la última usada en este dispositivo
function switchAccountStorage(oldEmail, newEmail){
  if(!oldEmail){
    // Primera vez que se conecta una cuenta: los datos actuales pasan a pertenecer a esta cuenta (no se pierde nada)
    currentStorageKey = getStorageKeyForEmail(newEmail);
    try{ localStorage.setItem(currentStorageKey, JSON.stringify(state)); }catch(e){}
    return;
  }
  // Cambio real de cuenta: se guarda lo de la cuenta anterior tal cual, y se aíslan los datos de la nueva
  const oldKey = getStorageKeyForEmail(oldEmail);
  try{ localStorage.setItem(oldKey, JSON.stringify(state)); }catch(e){}

  const newKey = getStorageKeyForEmail(newEmail);
  let newState;
  try{
    const raw = localStorage.getItem(newKey);
    newState = raw ? JSON.parse(raw) : { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
  }catch(e){
    newState = { groups: [], activeGroupId: null, schedule: [], periods: [], activePeriodId: null };
  }
  currentStorageKey = newKey;
  state = newState;
  ensureDefaultGroup();
}

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ============ SINCRONIZACIÓN CON GOOGLE DRIVE ============ */
const DRIVE_FILE_NAME = 'registro-clases-data.json';
let driveFileId = null;
let driveTokenClient = null;

const DEFAULT_CLIENT_ID = '305499160088-dk14k2puhdaso68o8hv7500kkct5savn.apps.googleusercontent.com';
function loadDriveClientId(){ return localStorage.getItem('gdrive_client_id') || DEFAULT_CLIENT_ID; }
function saveDriveClientId(id){ localStorage.setItem('gdrive_client_id', id); }

function loadStoredDriveToken(){
  try{
    const raw = localStorage.getItem('gdrive_token');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function storeDriveToken(tok){ localStorage.setItem('gdrive_token', JSON.stringify(tok)); }
function clearDriveToken(){ localStorage.removeItem('gdrive_token'); }
function isDriveTokenValid(tok){ return !!(tok && tok.access_token && tok.expires_at && Date.now() < tok.expires_at - 60000); }

let driveLastKnownConnected = null;

function setDriveStatus(status){
  const map = {
    connected: '☁️ Conectado',
    syncing: '☁️ Sincronizando…',
    error: '⚠️ Error de sincronización',
    disconnected: 'No conectado'
  };
  const text = map[status] || map.disconnected;
  const modalEl = document.getElementById('driveStatusText');
  if(modalEl) modalEl.textContent = text;
  updateDriveHeaderBadge();
}

function updateDriveHeaderBadge(){
  const badge = document.getElementById('driveHeaderStatus');
  if(!badge) return;
  const stored = loadStoredDriveToken();
  const connected = isDriveTokenValid(stored);
  const email = localStorage.getItem('gdrive_email');
  if(connected){
    badge.textContent = email ? `☁️ ${email}` : '☁️ Conectado';
    badge.style.color = 'var(--success)';
  } else {
    badge.textContent = '⚠️ Drive desconectado';
    badge.style.color = 'var(--danger)';
  }
  if(driveLastKnownConnected === true && connected === false){
    showToast('⚠️ Se cerró tu sesión de Google Drive. Tus cambios NO se están respaldando hasta que vuelvas a conectar.');
  }
  driveLastKnownConnected = connected;
}

async function fetchConnectedEmail(){
  try{
    const stored = loadStoredDriveToken();
    if(!isDriveTokenValid(stored)) return;
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${stored.access_token}` }
    });
    if(!res.ok) return;
    const data = await res.json();
    if(!data.email) return;
    const previousEmail = localStorage.getItem('gdrive_email');
    if(data.email !== previousEmail){
      const isRealSwitch = !!previousEmail;
      switchAccountStorage(previousEmail, data.email);
      localStorage.setItem('gdrive_email', data.email);
      driveFileId = null; // el archivo de Drive de la cuenta anterior ya no aplica
      renderAll();
      if(isRealSwitch){
        showToast('Cuenta de Google distinta detectada (' + data.email + ') — se separaron los datos de cada cuenta.');
      }
    }
    updateDriveHeaderBadge();
  }catch(e){ /* no crítico */ }
}

function connectDrive(){
  const clientId = loadDriveClientId();
  if(!clientId){ showToast('Primero ingresa y guarda tu Client ID de Google'); return; }
  if(typeof google === 'undefined' || !google.accounts){
    showToast('No se pudo cargar Google (revisa tu conexión o que el archivo esté alojado en https)');
    return;
  }
  const stored = loadStoredDriveToken();
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp)=>{
      if(resp.error){
        showToast('No se pudo conectar con Google Drive');
        setDriveStatus('error');
        return;
      }
      const tok = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000) };
      storeDriveToken(tok);
      setDriveStatus('connected');
      showToast('Conectado a Google Drive');
      await fetchConnectedEmail();
      syncFromDrive();
    }
  });
  driveTokenClient.requestAccessToken({ prompt: stored ? '' : 'consent' });
}

function disconnectDrive(){
  clearDriveToken();
  driveFileId = null;
  // Mantenemos gdrive_email para no perder de vista de quién son los datos guardados en este dispositivo
  setDriveStatus('disconnected');
  showToast('Se desconectó Google Drive (tus datos siguen guardados en este navegador)');
}

async function driveFetch(url, options={}){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) throw new Error('token-expired');
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), Authorization: `Bearer ${stored.access_token}` }
  });
  if(res.status === 401) throw new Error('token-expired');
  if(!res.ok) throw new Error('drive-error-' + res.status);
  return res;
}

async function findDriveFile(){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id)`);
  const data = await res.json();
  return (data.files && data.files.length > 0) ? data.files[0] : null;
}

async function downloadDriveFile(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return JSON.parse(await res.text());
}

async function uploadDriveFile(fileId, data){
  const body = JSON.stringify(data);
  if(fileId){
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body
    });
    return fileId;
  }
  const metadata = { name: DRIVE_FILE_NAME, parents:['appDataFolder'] };
  const boundary = 'registroClasesBoundary';
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
    method:'POST',
    headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
    body: multipartBody
  });
  const created = await res.json();
  return created.id;
}

async function syncFromDrive(){
  try{
    setDriveStatus('syncing');
    const file = await findDriveFile();
    if(file){
      driveFileId = file.id;
      const remote = await downloadDriveFile(file.id);
      const localUpdated = state.updatedAt || 0;
      const remoteUpdated = remote.updatedAt || 0;
      if(remoteUpdated > localUpdated){
        state = remote;
        if(!state.schedule) state.schedule = [];
        ensureDefaultGroup();
        localStorage.setItem(currentStorageKey, JSON.stringify(state));
        renderAll();
        showToast('Datos actualizados desde Google Drive');
      } else if(localUpdated > remoteUpdated){
        await uploadDriveFile(driveFileId, state);
      }
    } else {
      driveFileId = await uploadDriveFile(null, state);
    }
    setDriveStatus('connected');
  }catch(e){
    console.error('Error de sincronización con Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

async function pushToDrive(){
  const stored = loadStoredDriveToken();
  if(!isDriveTokenValid(stored)) return;
  try{
    setDriveStatus('syncing');
    if(!driveFileId){
      const file = await findDriveFile();
      if(file) driveFileId = file.id;
    }
    if(driveFileId){
      // Antes de sobrescribir, revisamos si otro dispositivo subió algo más nuevo mientras tanto
      const remote = await downloadDriveFile(driveFileId);
      if(remote && remote.updatedAt && remote.updatedAt > (state.updatedAt || 0)){
        state = remote;
        if(!state.schedule) state.schedule = [];
        if(!state.periods) state.periods = [];
        ensureDefaultGroup();
        localStorage.setItem(currentStorageKey, JSON.stringify(state));
        renderAll();
        showToast('⚠️ Otro dispositivo sincronizó cambios más recientes. Se cargaron esos en vez de sobrescribirlos.');
        setDriveStatus('connected');
        return;
      }
    }
    driveFileId = await uploadDriveFile(driveFileId, state);
    setDriveStatus('connected');
  }catch(e){
    console.error('Error subiendo a Drive', e);
    setDriveStatus(String(e.message).includes('token-expired') ? 'disconnected' : 'error');
  }
}

function isEntryPresent(entry){
  if(!entry) return false;
  if(entry.presente !== undefined && entry.presente !== null) return !!entry.presente;
  if(!entry.cotejo) return false;
  return Object.values(entry.cotejo).some(v => v !== null && v !== undefined);
}

function computeStudentStatsForSessions(group, studentId, sessions){
  let presentCount = 0, absentCount = 0, obtained = 0, maxPossible = 0;
  sessions.forEach(session=>{
    const entry = session.entries.find(e=> e.studentId === studentId);
    if(!entry) return;
    const inds = session.indicatorSnapshot || group.indicators;
    if(isEntryPresent(entry)){
      presentCount++;
      inds.forEach(ind=>{
        const v = entry.cotejo[ind.id];
        if(v !== null && v !== undefined){
          obtained += v;
          maxPossible += (ind.levels || 5);
        }
      });
    } else {
      absentCount++;
    }
  });
  const total = presentCount + absentCount;
  const percent = maxPossible > 0 ? Math.round((obtained / maxPossible) * 100) : null;
  return { presentCount, absentCount, total, obtained, maxPossible, percent };
}
function computeStudentStats(group, studentId){
  return computeStudentStatsForSessions(group, studentId, getActiveSessions(group));
}

/* ============ CALIFICACIONES: ESCALA CHILENA 1.0 - 7.0 (aprobación 4.0) ============ */
function computeChileGrade(scoreObtained, totalScore, exigenciaPercent){
  if(scoreObtained === null || scoreObtained === undefined || !totalScore || totalScore <= 0) return null;
  let exigencia = (exigenciaPercent || 60) / 100;
  if(exigencia <= 0.01) exigencia = 0.01;
  if(exigencia >= 0.99) exigencia = 0.99;
  let p = scoreObtained / totalScore;
  if(p < 0) p = 0;
  if(p > 1) p = 1;
  let nota;
  if(p <= exigencia){
    nota = 1 + 3 * (p / exigencia);
  } else {
    nota = 4 + 3 * (p - exigencia) / (1 - exigencia);
  }
  nota = Math.min(7, Math.max(1, nota));
  return Math.round(nota * 10) / 10;
}

const GRADE_GROUP_PALETTE = [
  {bg:'#F1ECFC', text:'#6C4EE3', border:'#D4C4F5'},
  {bg:'#E6F8EF', text:'#1F9D64', border:'#B9EBD1'},
  {bg:'#FDF3DE', text:'#C6871A', border:'#F5DFA8'},
  {bg:'#FDECEA', text:'#D8493E', border:'#F5C4BE'},

  {bg:'#FCEAF3', text:'#C93E85', border:'#F5C1DC'},
];

  return GRADE_GROUP_PALETTE[idx >= 0 ? idx % GRADE_GROUP_PALETTE.length : 0];
}

// "Unidades de calificación": cada evaluación suelta cuenta como una unidad;
// las evaluaciones que pertenecen a un grupo de notas se promedian y forman UNA sola
// unidad ("nota sumativa"), que usa el tipo/ponderación del grupo (no de cada evaluación).
function getGradingUnits(group){
  const evals = getActiveEvaluations(group);
  const gradeGroups = getActiveGradeGroups(group);
  const units = [];
  evals.filter(e=> !e.gradeGroupId).forEach(e=>{
    units.push({ type:'eval', evals:[e], weightType: e.weightType, weightPercent: e.weightPercent });
  });
  gradeGroups.forEach(gg=>{
    const members = evals.filter(e=> e.gradeGroupId === gg.id);
    if(members.length > 0){
      units.push({ type:'group', gradeGroup: gg, evals: members, weightType: gg.weightType, weightPercent: gg.weightPercent });
    }
  });
  return units;
}

function computeUnitGrade(unit, studentId){
  const notas = unit.evals.map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  if(notas.length === 0) return null;
  return Math.round((notas.reduce((a,b)=>a+b,0)/notas.length) * 10) / 10;
}

function computeStudentEvalGrade(evaluation, studentId){
  const score = evaluation.scores ? evaluation.scores[studentId] : null;
  if(score === null || score === undefined) return null;
  const params = getEvalParamsForStudent(evaluation, studentId);
  return computeChileGrade(score, params.totalScore, params.exigencia);
}

function getEvalParamsForStudent(evaluation, studentId){
  const override = evaluation.overrides && evaluation.overrides[studentId];
  return {
    totalScore: (override && override.totalScore !== undefined && override.totalScore !== null) ? override.totalScore : evaluation.totalScore,
    exigencia: (override && override.exigencia !== undefined && override.exigencia !== null) ? override.exigencia : evaluation.exigencia,
  };
}

function computeStudentFinalGrade(group, studentId){
  const units = getGradingUnits(group);
  const weighted = units.filter(u=> u.weightType === 'weighted');
  const simple = units.filter(u=> u.weightType !== 'weighted');

  let weightedSum = 0, weightTotal = 0;
  weighted.forEach(u=>{
    const nota = computeUnitGrade(u, studentId);
    if(nota !== null){
      weightedSum += nota * ((u.weightPercent || 0) / 100);
      weightTotal += (u.weightPercent || 0) / 100;
    }
  });

  const simpleNotas = simple.map(u=> computeUnitGrade(u, studentId)).filter(n=> n !== null);
  const simpleAvg = simpleNotas.length ? simpleNotas.reduce((a,b)=>a+b,0)/simpleNotas.length : null;
  const remainingWeight = Math.max(0, 1 - weightTotal);

  let finalGrade = null;
  if(weightTotal > 0 && simpleAvg !== null && remainingWeight > 0){
    finalGrade = weightedSum + simpleAvg * remainingWeight;
  } else if(weightTotal > 0){
    finalGrade = weightTotal >= 1 ? weightedSum : (simpleAvg !== null ? weightedSum + simpleAvg * remainingWeight : weightedSum / weightTotal);
  } else if(simpleAvg !== null){
    finalGrade = simpleAvg;
  }
  if(finalGrade !== null) finalGrade = Math.round(Math.min(7, Math.max(1, finalGrade)) * 10) / 10;

  const allNotas = getActiveEvaluations(group).map(e=> computeStudentEvalGrade(e, studentId)).filter(n=> n !== null);
  const promedioSimple = allNotas.length ? Math.round((allNotas.reduce((a,b)=>a+b,0)/allNotas.length) * 10) / 10 : null;

  return { finalGrade, promedioSimple, count: allNotas.length };
}

function totalWeightAssigned(group){
  return getGradingUnits(group).filter(u=> u.weightType === 'weighted')
    .reduce((sum,u)=> sum + (u.weightPercent || 0), 0);
}

function ensureDefaultGroup(){
  if(state.groups.length === 0){
    const g = { id: uid(), name: 'Grupo 1', students: [], indicators: [], sessions: [], evaluations: [], decimas: [], gradeGroups: [], processes: [], activeProcessId: null, bitacora: [], entregas: [] };
    state.groups.push(g);
    state.activeGroupId = g.id;
    saveState();
  } else if(!getActiveGroup()){
    state.activeGroupId = state.groups[0].id;
    saveState();
  }
  state.groups.forEach(g=>{
    if(!g.evaluations) g.evaluations = [];
    if(!g.decimas) g.decimas = [];
    if(!g.gradeGroups) g.gradeGroups = [];
    if(!g.indicators) g.indicators = [];
    if(!g.sessions) g.sessions = [];
    if(!g.students) g.students = [];
    if(!g.processes) g.processes = [];
    if(!g.bitacora) g.bitacora = [];
    if(!g.entregas) g.entregas = [];
    if(g.activeProcessId === undefined) g.activeProcessId = null;
  });
  if(!state.periods) state.periods = [];
  if(state.activePeriodId === undefined) state.activePeriodId = null;
}

function convertProcessToGrade(){
  const group = getActiveGroup();
  if(!group.activeProcessId){ showToast('Selecciona un proceso específico primero'); return; }
  const proc = group.processes.find(p=>p.id===group.activeProcessId);

  if(sessions.length === 0){ showToast('Este proceso todavía no tiene clases registradas'); return; }

  const overlay = document.createElement('div');

function closeConvertProcessForm(){
  const overlay = document.getElementById('convertProcessFormOverlay');
  if(overlay) overlay.remove();
}
function saveConvertProcessForm(){
  const group = getActiveGroup();
  const proc = group.processes.find(p=>p.id===group.activeProcessId);
  const sessions = getActiveProcessSessions(group);
  const name = document.getElementById('convFormName').value.trim();
  if(!name){ showToast('Ingresa un nombre para la evaluación'); return; }
  const exigencia = Number(document.getElementById('convFormExigencia').value) || 60;
  const weightType = document.getElementById('convFormWeightType').value;
  const weightPercent = weightType === 'weighted' ? (Number(document.getElementById('convFormWeightPercent').value) || 0) : 0;

  const scores = {};
  group.students.forEach(s=>{
    const stats = computeStudentStatsForSessions(group, s.id, sessions);
    scores[s.id] = stats.percent === null ? null : stats.percent;
  });

  group.evaluations.push({
    id: uid(), name, totalScore: 100, exigencia,
    gradeGroupId: null, weightType, weightPercent,
    scores, overrides: {}, periodId: state.activePeriodId
  });
  saveState();
  closeConvertProcessForm();
  showToast('Nota creada a partir de "' + (proc ? proc.name : name) + '"');
  goToTab('calificaciones');
}

function closePeriodForm(){
  const overlay = document.getElementById('periodFormOverlay');
  if(overlay) overlay.remove();
}
function savePeriodForm(periodId){
  const name = document.getElementById('periodFormName').value.trim();
  const startDate = document.getElementById('periodFormStart').value;
  const endDate = document.getElementById('periodFormEnd').value;
  if(!name){ showToast('Ingresa un nombre para el periodo'); return; }

  if(periodId){
    const period = state.periods.find(p=>p.id===periodId);
    if(period){
      period.name = name;
      period.startDate = startDate;
      period.endDate = endDate;
    }
    showToast('Periodo actualizado');
  } else {
    const isFirstPeriod = state.periods.length === 0;
    const period = { id: uid(), name, startDate, endDate };
    state.periods.push(period);
    if(isFirstPeriod){
      // Los registros creados antes de que existieran periodos quedan asociados a este primer periodo
      state.groups.forEach(g=>{
        (g.sessions || []).forEach(s=>{ if(!s.periodId) s.periodId = period.id; });
        (g.evaluations || []).forEach(e=>{ if(!e.periodId) e.periodId = period.id; });
        (g.decimas || []).forEach(d=>{ if(!d.periodId) d.periodId = period.id; });
        (g.gradeGroups || []).forEach(gg=>{ if(!gg.periodId) gg.periodId = period.id; });
      });
    }
    state.activePeriodId = period.id;
    showToast('Periodo creado: ' + period.name);
  }
  saveState();
  closePeriodForm();
  renderPeriodSelect();
  renderAll();
}
function createPeriod(){ openPeriodForm(null); }
function editPeriod(){
  if(!state.activePeriodId){ showToast('Selecciona un periodo específico para editarlo'); return; }
  openPeriodForm(state.activePeriodId);
}

function deletePeriod(){
  const period = state.periods.find(p=>p.id===state.activePeriodId);
  if(!period){ showToast('Selecciona un periodo específico para eliminarlo'); return; }
  if(!confirm(`¿Eliminar el periodo "${period.name}"? Sus registros no se borran, pero dejarán de estar asociados a un periodo (podrás verlos en "Todos los periodos").`)) return;
  state.periods = state.periods.filter(p=>p.id!==period.id);
  state.activePeriodId = null;
  saveState();
  renderPeriodSelect();
  renderAll();
  showToast('Periodo eliminado');
}

/* ============ MÓDULOS Y PESTAÑAS ============ */
const MODULE_TABS = {
  inicio: ['inicio'],
  horario: ['horario'],
  cursos: ['estudiantes'],
  trabajo: ['indicadores','registrar','entregas','historial','decimas'],
  calificaciones: ['calificaciones'],
  bitacora: ['bitacora'],
};
const SUBTAB_LABELS = {
  indicadores: 'Indicadores',
  registrar: 'Registrar clase',
  historial: 'Historial',
  decimas: 'Décimas',
  entregas: 'Entregas',
};
function moduleForTab(tab){
  for(const m in MODULE_TABS){ if(MODULE_TABS[m].includes(tab)) return m; }
  return 'inicio';
}
let currentModule = 'inicio';
let currentTab = 'inicio';

function renderNav(){
  document.querySelectorAll('#modulesNav button').forEach(b=> b.classList.toggle('active', b.dataset.module === currentModule));
  const subNav = document.getElementById('subTabsNav');
  const tabs = MODULE_TABS[currentModule] || [];
  if(tabs.length > 1){
    subNav.style.display = 'flex';
    subNav.innerHTML = tabs.map(t=> `<button data-tab="${t}" class="${t===currentTab?'active':''}">${SUBTAB_LABELS[t] || t}</button>`).join('');
  } else {
    subNav.style.display = 'none';
    subNav.innerHTML = '';
  }
}
function goToTab(tab){
  currentTab = tab;
  currentModule = moduleForTab(tab);
  if(tab === 'registrar'){ registrarIndicatorSelection = null; registrarAttendanceOnly = null; }
  renderNav();
  renderMain();
}
function goToModule(mod){
  currentModule = mod;
  currentTab = (MODULE_TABS[mod] || ['horario'])[0];
  if(currentTab === 'registrar'){ registrarIndicatorSelection = null; registrarAttendanceOnly = null; }
  renderNav();
  renderMain();
}
document.getElementById('modulesNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-module]');
  if(!btn) return;
  goToModule(btn.dataset.module);
});
document.getElementById('subTabsNav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  goToTab(btn.dataset.tab);
});

function renderMain(){
  const main = document.getElementById('main');

  if(currentTab === 'inicio') return renderInicio();

  if(currentTab === 'indicadores') return renderIndicadores(group);
  if(currentTab === 'horario') return renderHorario();

  if(currentTab === 'historial') return renderHistorial(group);

function importStudentsFromText(group, text){
  if(!text || !text.trim()){ showToast('No hay texto para importar'); return; }
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let count = 0;
  lines.forEach(line=>{
    const firstField = line.split(',')[0].trim();
    const name = firstField.replace(/^"|"$/g,'').trim();
    if(!name) return;
    const exists = group.students.some(s=> s.name.toLowerCase() === name.toLowerCase());
    if(!exists){
      group.students.push({id: uid(), name});
      count++;
    }
  });
  saveState();
  renderEstudiantes(group);
  showToast(count + ' estudiante(s) importado(s)');
}

const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let calendarMonthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedCalendarDate = toISODate(new Date());

function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function jsWeekdayToOurDay(jsDay){ return jsDay === 0 ? 7 : jsDay; }
function buildMonthCells(cursor){
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const firstWeekday = jsWeekdayToOurDay(firstOfMonth.getDay());
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=1; i<firstWeekday; i++){
    cells.push({ date: new Date(year, month, 1 - (firstWeekday - i)), otherMonth: true });
  }
  for(let day=1; day<=daysInMonth; day++){
    cells.push({ date: new Date(year, month, day), otherMonth: false });
  }
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1].date;
    const next = new Date(last);
    next.setDate(next.getDate()+1);
    cells.push({ date: next, otherMonth: true });
  }
  return cells;
}
function changeCalendarMonth(delta){
  calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth()+delta, 1);
  renderHorario();
}
function selectCalendarDate(iso){

  } else {

  }
}

function findCurrentOrNextClass(){
  const now = new Date();
  const todayWeekday = jsWeekdayToOurDay(now.getDay());
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const todayEntries = state.schedule.filter(e=> e.day === todayWeekday);

  const toMinutes = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };

  const current = todayEntries.find(e=>{
    const startMin = toMinutes(e.startTime);
    const endMin = e.endTime ? toMinutes(e.endTime) : startMin + 60;
    return nowMinutes >= startMin && nowMinutes < endMin;
  });
  if(current) return { entry: current, status: 'now' };

  const upcoming = todayEntries.filter(e=> toMinutes(e.startTime) > nowMinutes)
    .sort((a,b)=> a.startTime.localeCompare(b.startTime));
  if(upcoming[0]) return { entry: upcoming[0], status: 'next' };

  return null;
}

function computeDateForWeekday(day){
  // day: 1=Lunes ... 7=Domingo. Devuelve la fecha (YYYY-MM-DD) de ese día en la semana actual.
  const today = new Date();
  const jsDay = today.getDay(); // 0=Domingo ... 6=Sábado
  const todayIso = jsDay === 0 ? 7 : jsDay; // convertir a 1=Lunes ... 7=Domingo
  const diff = day - todayIso;
  const target = new Date(today);
  target.setDate(today.getDate() + diff);
  return target.toISOString().slice(0,10);
}

function goToClass(entryId){
  const entry = state.schedule.find(e=>e.id===entryId);
  if(!entry) return;
  const group = state.groups.find(g=>g.id===entry.groupId);
  if(!group){ showToast('El grupo de esta clase ya no existe'); return; }
  state.activeGroupId = group.id;
  saveState();
  renderGroupSelect();
  currentTab = 'registrar';
  currentModule = moduleForTab('registrar');
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  renderNav();
  const targetDate = computeDateForWeekday(entry.day);
  const existingSession = getActiveSessions(group).find(s=> s.date === targetDate && s.time === entry.startTime);
  if(existingSession){
    renderRegistrar(group, existingSession);
  } else {
    renderRegistrar(group, null, { date: targetDate, time: entry.startTime });
  }
}

function markAllMaxScores(){

      if(sel) sel.value = String(ind.levels || 5);
    });

  showToast('Todos marcados con la nota máxima. Ajusta las excepciones.');

function repeatLastClass(){
  const group = getActiveGroup();
  const excludeId = registrarCurrentSessionToEdit ? registrarCurrentSessionToEdit.id : null;
  const sessions = getActiveSessions(group)
    .filter(s=> s.id !== excludeId)
    .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  const last = sessions[0];
  if(!last){ showToast('No hay una clase anterior para repetir'); return; }

  const lastIndIds = (last.indicatorSnapshot || []).map(i=>i.id).filter(id=> group.indicators.some(ind=>ind.id===id));
  if(lastIndIds.length){
    registrarIndicatorSelection = lastIndIds;
    renderRegistrar(group, registrarCurrentSessionToEdit, registrarCurrentPrefill);
  }

  setTimeout(()=>{
    group.students.forEach(s=>{
      const prevEntry = last.entries.find(e=>e.studentId===s.id);
      if(!prevEntry) return;
      registrarIndicatorSelection.forEach(indId=>{
        const sel = document.querySelector(`select[data-student="${s.id}"][data-indicator="${indId}"]`);
        if(sel && prevEntry.cotejo[indId] !== undefined && prevEntry.cotejo[indId] !== null){
          sel.value = String(prevEntry.cotejo[indId]);
        }
      });
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      if(obsEl && prevEntry.observaciones) obsEl.value = prevEntry.observaciones;
    });
    showToast('Se copiaron los valores de la clase anterior (' + formatDate(last.date) + ')');
  }, 30);
}

function handleSaveSession(){
  const group = getActiveGroup();
  const sessionToEdit = registrarCurrentSessionToEdit;
  const isEdit = !!sessionToEdit;
  const selectedIndicators = group.indicators.filter(i=> registrarIndicatorSelection.includes(i.id));

  const date = document.getElementById('sessionDate').value;
  const time = document.getElementById('sessionTime').value;
  const selectedProcessId = document.getElementById('sessionProcess').value || null;
  if(!date || !time){ showToast('Indica fecha y horario'); return; }
  if(!registrarAttendanceOnly && selectedIndicators.length === 0){
    showToast('Selecciona al menos un indicador, o activa "Registrar solo asistencia"');
    return;
  }

  const currentStudentIds = new Set(group.students.map(s=>s.id));
  let newEntries, indicatorSnapshot;

  if(registrarAttendanceOnly){
    newEntries = group.students.map(s=>{
      const checkbox = document.querySelector(`input[type="checkbox"][data-attendance-student="${s.id}"]`);
      const presente = checkbox ? checkbox.checked : true;
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      return { studentId: s.id, cotejo: {}, presente, observaciones: obsEl ? obsEl.value.trim() : '' };
    });
    indicatorSnapshot = [];
  } else {
    newEntries = group.students.map(s=>{
      const cotejo = {};
      selectedIndicators.forEach(ind=>{
        const sel = document.querySelector(`select[data-student="${s.id}"][data-indicator="${ind.id}"]`);
        cotejo[ind.id] = sel && sel.value ? Number(sel.value) : null;
      });
      const obsEl = document.querySelector(`textarea[data-student="${s.id}"][data-obs="1"]`);
      return { studentId: s.id, cotejo, observaciones: obsEl ? obsEl.value.trim() : '' };
    });
    indicatorSnapshot = selectedIndicators.map(i=>({id:i.id, name:i.name, levels:i.levels || 5}));
  }

  // Conservar datos de estudiantes que ya no están en el grupo pero tenían registro previo
  const preservedEntries = isEdit ? sessionToEdit.entries.filter(e=> !currentStudentIds.has(e.studentId)) : [];
  const entries = [...newEntries, ...preservedEntries];

  if(isEdit){
    const idx = group.sessions.findIndex(s=>s.id===sessionToEdit.id);
    if(idx !== -1){
      group.sessions[idx] = { ...group.sessions[idx], date, time, entries, indicatorSnapshot, processId: selectedProcessId };
    }
    showToast('Registro actualizado correctamente');
  } else {
    group.sessions.push({ id: uid(), date, time, entries, indicatorSnapshot, periodId: state.activePeriodId, processId: selectedProcessId });
    showToast('Clase registrada correctamente');
  }
  if(!registrarAttendanceOnly) group.lastUsedIndicatorIds = registrarIndicatorSelection.slice();
  saveState();
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  goToTab('historial');
}

function editSession(sessionId){
  const group = getActiveGroup();
  const session = group.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  currentTab = 'registrar';
  currentModule = moduleForTab('registrar');
  registrarIndicatorSelection = null;
  registrarAttendanceOnly = null;
  renderNav();
  renderRegistrar(group, session);
}

                    : `<td colspan="${inds.length + 1}"><span class="pill pill-danger">Ausente</span></td>`
                  }
                  <td>${escapeHtml(e.observaciones || '')}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
        </div>
        ` : ''}
      </div>
    `;}).join('')}
  `;

  document.getElementById('exportBtn').addEventListener('click', ()=> exportGroupToExcel(group));
}

/* ============ TAB: DÉCIMAS (puntos extra) ============ */
function computeStudentDecimasTotal(group, studentId){
  const entries = getActiveDecimas(group);
  let total = 0;
  entries.forEach(d=>{
    if(d.values){
      total += (d.values[studentId] || 0);
    } else if(d.studentId === studentId){
      total += (d.value || 0);
    }
  });
  return Math.round(total * 10) / 10;
}

function renderDecimaValues(group, session){

function applyDecimaToAll(sessionId){
  const group = getActiveGroup();
  const session = group.decimas.find(d=>d.id===sessionId);
  if(!session) return;
  const raw = document.getElementById('decimaBulkValue').value;
  const value = raw === '' ? null : Number(raw);
  if(value === null || isNaN(value)){ showToast('Ingresa un valor primero'); return; }
  if(!session.values) session.values = {};
  group.students.forEach(s=>{ session.values[s.id] = value; });
  saveState();
  renderDecimaValues(group, session);
  showToast('Se asignó ' + value + ' a todo el curso');
}

function saveDecimaValue(sessionId, studentId, value){
  const group = getActiveGroup();
  const session = group.decimas.find(d=>d.id===sessionId);
  if(!session) return;
  if(!session.values) session.values = {};
  const num = value === '' ? null : Number(value);
  session.values[studentId] = (num === null || isNaN(num)) ? null : num;
  saveState();
}

function deleteDecima(id){
  const group = getActiveGroup();

  group.decimas = group.decimas.filter(d=>d.id!==id);

const ENTREGA_ESTADOS = {

  fuera_plazo: { label:'Fuera de plazo', color:{bg:'#FDF3DE', text:'#C6871A', border:'#F5DFA8'} },
  no_entregada: { label:'No entregada', color:{bg:'#FDECEA', text:'#D8493E', border:'#F5C4BE'} },
};

function getActiveEntregas(group){
  return (group.entregas || []).filter(e=> !state.activePeriodId || e.periodId === state.activePeriodId);
}

// Devuelve {fecha, hora} del plazo de una entrega, o null si no tiene uno configurado.
// Compatible con entregas antiguas que solo guardaban "horaLimite" (implícitamente en la fecha de la guía).
function getEntregaDeadline(entrega){
  const fecha = entrega.plazoFecha || (entrega.horaLimite ? entrega.date : null);
  const hora = entrega.plazoHora || entrega.horaLimite || null;
  if(!fecha || !hora) return null;
  return { fecha, hora };
}

// Cruza con el registro de "Trabajo en clases": ¿estuvo el estudiante presente el día indicado?
// Devuelve true/false si hay clase registrada ese día, o null si no hay ningún registro de clase en esa fecha.
function wasStudentPresentOnDate(group, studentId, dateISO){
  const sessionsOnDate = getActiveSessions(group).filter(s=> s.date === dateISO);
  if(sessionsOnDate.length === 0) return null;
  return sessionsOnDate.some(s=>{
    const entry = s.entries.find(e=> e.studentId === studentId);
    return entry && isEntryPresent(entry);
  });
}

function computeStudentEntregaStats(group, studentId){
  const stats = { en_plazo:0, fuera_plazo:0, no_entregada:0 };
  getActiveEntregas(group).forEach(e=>{
    const estado = e.estados ? e.estados[studentId] : null;
    if(estado && stats[estado] !== undefined) stats[estado]++;
  });
  return stats;
}

function openEntregaValues(id){
  entregaActiveId = id;
  renderEntregas(getActiveGroup());
}
function closeEntregaValues(){
  entregaActiveId = null;
  renderEntregas(getActiveGroup());
}

function renderEntregaValues(group, entrega){
  const main = document.getElementById('main');
  const todayISO = toISODate(new Date());
  const willBeLate = todayISO > entrega.date;
  main.innerHTML = `
    ${groupHeaderCard(group)}
    <div class="card app-font">
      <div class="flex-between">
        <h2 style="border:none; margin-bottom:0; padding-bottom:0;">${escapeHtml(entrega.name)} · ${formatDate(entrega.date)}</h2>
        <button class="btn btn-outline btn-sm" onclick="closeEntregaValues()">← Volver</button>
      </div>
      <p class="muted">Toca "Marcar entregada" cuando un estudiante te entregue el trabajo — la app compara la fecha de hoy con la fecha de la guía y marca automáticamente "En plazo" o "Fuera de plazo". Vuelve a tocar el botón para deshacer.</p>
      ${willBeLate ? `<p class="muted" style="color:${ENTREGA_ESTADOS.fuera_plazo.color.text};">⚠️ Hoy (${formatDate(todayISO)}) es después de la fecha de esta guía — lo que marques hoy quedará como "Fuera de plazo", a menos que uses la opción de excepción.</p>` : ''}
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-accent btn-sm" onclick="markAllEntregaDelivered('${entrega.id}')">✅ Marcar todos entregada (hoy)</button>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Estudiante</th><th>Estado</th><th>Excepción</th><th>Asistencia ese día</th></tr></thead>
        <tbody>
          ${group.students.map(s=>{
            const estado = entrega.estados ? entrega.estados[s.id] : null;
            const fecha = entrega.fechas ? entrega.fechas[s.id] : null;
            const isException = entrega.excepciones ? !!entrega.excepciones[s.id] : false;
            const info = estado ? ENTREGA_ESTADOS[estado] : null;
            const presente = wasStudentPresentOnDate(group, s.id, entrega.date);
            const asistenciaLabel = presente === null ? '<span class="muted">Sin clase registrada</span>' :
              (presente ? '<span style="color:var(--success); font-weight:700;">🟢 Presente</span>' : '<span style="color:var(--danger); font-weight:700;">🔴 Ausente</span>');
            return `
              <tr>
                <td>${escapeHtml(s.name)}</td>
                <td>
                  <button class="btn btn-sm" style="${info ? `background:${info.color.bg}; color:${info.color.text}; border:1px solid ${info.color.border};` : ''}" onclick="toggleEntregaDelivered('${entrega.id}','${s.id}')">
                    ${info ? `${info.label}${isException ? ' ⭐' : ''}${fecha ? ' · ' + formatDate(fecha) : ''} (deshacer)` : '⬜ Marcar entregada'}
                  </button>
                </td>
                <td>
                  ${estado !== 'en_plazo' ? `<button class="btn btn-outline btn-sm" onclick="markEntregaException('${entrega.id}','${s.id}')" title="Marcar como en plazo aunque se haya pasado la fecha">🔓 En plazo (excepción)</button>` : (isException ? '<span class="muted">⭐ Excepción aplicada</span>' : '')}

function toggleEntregaDelivered(entregaId, studentId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  if(!entrega.excepciones) entrega.excepciones = {};

  if(entrega.estados[studentId]){
    delete entrega.estados[studentId];
    delete entrega.fechas[studentId];
    delete entrega.excepciones[studentId];
  } else {
    const todayISO = toISODate(new Date());
    entrega.estados[studentId] = todayISO > entrega.date ? 'fuera_plazo' : 'en_plazo';
    entrega.fechas[studentId] = todayISO;
  }
  saveState();
  renderEntregaValues(group, entrega);
}
function markEntregaException(entregaId, studentId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  if(!entrega.excepciones) entrega.excepciones = {};
  const todayISO = toISODate(new Date());
  entrega.estados[studentId] = 'en_plazo';
  entrega.fechas[studentId] = entrega.fechas[studentId] || todayISO;
  entrega.excepciones[studentId] = true;
  saveState();
  renderEntregaValues(group, entrega);
  showToast('Marcado como en plazo (excepción)');
}
function markAllEntregaDelivered(entregaId){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===entregaId);
  if(!entrega) return;
  if(!entrega.estados) entrega.estados = {};
  if(!entrega.fechas) entrega.fechas = {};
  const todayISO = toISODate(new Date());
  const estado = todayISO > entrega.date ? 'fuera_plazo' : 'en_plazo';
  group.students.forEach(s=>{ entrega.estados[s.id] = estado; entrega.fechas[s.id] = todayISO; });
  saveState();
  renderEntregaValues(group, entrega);
  showToast('Se marcó a todos como "' + ENTREGA_ESTADOS[estado].label + '"');
}
function deleteEntrega(id){
  const group = getActiveGroup();
  if(!confirm('¿Eliminar este registro de entrega?')) return;
  group.entregas = group.entregas.filter(e=>e.id!==id);
  if(entregaActiveId === id) entregaActiveId = null;
  saveState();
  renderEntregas(group);
}

function saveEntregaDeadlineForm(id){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===id);
  if(!entrega) return;
  const fecha = document.getElementById('entregaDeadlineDateInput').value || null;
  const hora = document.getElementById('entregaDeadlineTimeInput').value || null;
  entrega.plazoFecha = fecha;
  entrega.plazoHora = hora;
  entrega.horaLimite = null; // limpiar formato antiguo si existía
  saveState();
  closeEntregaDeadlineForm();
  renderEntregas(group);
  showToast((fecha && hora) ? 'Plazo y recordatorio guardado' : 'Sin plazo configurado');
}
function clearEntregaDeadline(id){
  const group = getActiveGroup();
  const entrega = group.entregas.find(e=>e.id===id);
  if(!entrega) return;
  entrega.plazoFecha = null;
  entrega.plazoHora = null;
  entrega.horaLimite = null;
  saveState();
  closeEntregaDeadlineForm();
  renderEntregas(group);
  showToast('Plazo eliminado');
}

/* ============ TAB: BITÁCORA ============ */
const BITACORA_CATEGORIAS = {
  '': 'Sin categoría',
  conducta: 'Conducta',
  salud: 'Salud',
  accidente: 'Accidente',
  otro: 'Otro',
};
const BITACORA_CATEGORIA_COLORS = {
  '': { bg:'#F1ECFC', text:'#6C4EE3', border:'#D4C4F5' },
  conducta: { bg:'#FDF3DE', text:'#C6871A', border:'#F5DFA8' },
  salud: { bg:'#FDECEA', text:'#D8493E', border:'#F5C4BE' },
  accidente: { bg:'#FDECEA', text:'#D8493E', border:'#F5C4BE' },
  otro: { bg:'#E7F1FC', text:'#2C72C7', border:'#BEDBF7' },
};

function getActiveBitacora(group){
  return (group.bitacora || []).filter(b=> !state.activePeriodId || b.periodId === state.activePeriodId);
}

let bitacoraStudentFilter = '';
let bitacoraExpandedIds = new Set();

function toggleBitacoraEntry(id){
  if(bitacoraExpandedIds.has(id)) bitacoraExpandedIds.delete(id);
  else bitacoraExpandedIds.add(id);
  renderBitacora(getActiveGroup());
}

function renderBitacora(group){
  if(!group.bitacora) group.bitacora = [];

    entries = entries.filter(e=> (e.studentIds||[]).length === 0 || e.studentIds.includes(bitacoraStudentFilter));
  }

  main.innerHTML = `
    ${groupHeaderCard(group)}
    <div class="card app-font">
      <h2>Nuevo registro de bitácora</h2>
      <div class="grid-2">

          <label>Fecha</label>

      </div>
      <div style="margin-top:10px;">
        <label>Alcance del registro</label>
        <select id="bitScope" onchange="document.getElementById('bitStudentsWrap').style.display = this.value === 'estudiantes' ? 'block' : 'none';">

          <option value="estudiantes">Estudiante(s) específico(s)</option>
        </select>
      </div>
      <div id="bitStudentsWrap" style="display:none; margin-top:10px;">
        <label>Estudiantes involucrados</label>
        <div>
          ${group.students.map(s=>`
            <label style="display:inline-flex; align-items:center; gap:6px; margin:4px 10px 4px 0; font-family:'Inter',sans-serif; font-size:0.88rem;">
              <input type="checkbox" class="bit-student-check" value="${s.id}"> ${escapeHtml(s.name)}
            </label>
          `).join('')}

      </div>
      <label style="margin-top:10px;">Actividad pedagógica realizada</label>
      <textarea id="bitActividad" placeholder="Ej. Repaso de fracciones, trabajo grupal, salida a terreno..."></textarea>
      <label style="margin-top:10px;">Observaciones / incidentes (opcional)</label>
      <textarea id="bitObservaciones" placeholder="Ej. Conducta, salud, accidentes, u otras observaciones..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-accent" id="addBitacoraBtn">+ Guardar registro</button>
      </div>
    </div>

    <div class="card app-font">
      <div class="flex-between">
        <h2 style="border:none; margin-bottom:0; padding-bottom:0;">Registros (${entries.length})</h2>
        <div class="row" style="gap:6px;">
          <button class="btn btn-outline btn-sm" onclick="exportBitacoraToExcel(getActiveGroup())">⬇️ Excel</button>
          <button class="btn btn-outline btn-sm" onclick="exportBitacoraToWord(getActiveGroup())">⬇️ Word</button>
        </div>
      </div>
      <label style="margin-top:6px;">Filtrar por estudiante</label>
      <select onchange="changeBitacoraFilter(this.value)">
        <option value="">Todos (general + individuales)</option>
        ${group.students.map(s=>`<option value="${s.id}" ${bitacoraStudentFilter===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>
      <hr class="divider">
      ${entries.length === 0 ? '<div class="empty-state">Aún no hay registros en la bitácora.</div>' :
        entries.map(e=>{
          const color = BITACORA_CATEGORIA_COLORS[e.categoria || ''];
          const expanded = bitacoraExpandedIds.has(e.id);
          const scopeLabel = (e.studentIds && e.studentIds.length > 0)
            ? '👤 ' + e.studentIds.map(id=>{ const s=group.students.find(s=>s.id===id); return s ? s.name : ''; }).filter(Boolean).join(', ')
            : '🏫 Curso completo';
          return `
            <div class="card app-font" style="border-left:4px solid ${color.border}; margin-bottom:10px;">
              <div class="flex-between accordion-header" onclick="toggleBitacoraEntry('${e.id}')">
                <div>
                  <span class="accordion-chevron">${expanded ? '▾' : '▸'}</span>
                  <span class="pill">${formatDate(e.date)}</span>
                  ${e.categoria ? `<span class="pill" style="background:${color.bg}; color:${color.text}; border-color:${color.border};">${BITACORA_CATEGORIAS[e.categoria]}</span>` : ''}

              </div>
              ${expanded ? `

    const actividadPedagogica = document.getElementById('bitActividad').value.trim();
    const observaciones = document.getElementById('bitObservaciones').value.trim();

    let studentIds = [];
    if(scope === 'estudiantes'){
      studentIds = [...document.querySelectorAll('.bit-student-check:checked')].map(el=>el.value);
      if(studentIds.length === 0){ showToast('Selecciona al menos un estudiante, o cambia el alcance a "General del curso"'); return; }
    }
    group.bitacora.push({
      id: uid(), date, categoria, studentIds, actividadPedagogica, observaciones,
      periodId: state.activePeriodId
    });
    saveState();
    renderBitacora(group);
    showToast('Registro de bitácora guardado');
  });
}

function changeBitacoraFilter(studentId){
  bitacoraStudentFilter = studentId || '';
  renderBitacora(getActiveGroup());
}

function openBitacoraEditForm(id){

function closeBitacoraEditForm(){
  const overlay = document.getElementById('bitacoraFormOverlay');
  if(overlay) overlay.remove();
}
function saveBitacoraEditForm(id){
  const group = getActiveGroup();
  const entry = group.bitacora.find(e=>e.id===id);
  if(!entry) return;
  entry.date = document.getElementById('bitEditDate').value || entry.date;
  entry.categoria = document.getElementById('bitEditCategoria').value;
  const scope = document.getElementById('bitEditScope').value;
  entry.studentIds = scope === 'estudiantes'
    ? [...document.querySelectorAll('.bit-edit-student-check:checked')].map(el=>el.value)
    : [];
  entry.actividadPedagogica = document.getElementById('bitEditActividad').value.trim();
  entry.observaciones = document.getElementById('bitEditObservaciones').value.trim();
  saveState();
  closeBitacoraEditForm();
  renderBitacora(group);
  showToast('Registro actualizado');
}
function editBitacoraEntry(id){ openBitacoraEditForm(id); }
function deleteBitacoraEntry(id){
  const group = getActiveGroup();
  if(!confirm('¿Eliminar este registro de bitácora?')) return;
  group.bitacora = group.bitacora.filter(e=>e.id!==id);
  saveState();
  renderBitacora(group);
}

/* ============ TAB: CALIFICACIONES ============ */
let calActiveEvalId = null;

function renderCalificaciones(group){
  if(!group.evaluations) group.evaluations = [];
  if(!group.gradeGroups) group.gradeGroups = [];
  const evaluations = getActiveEvaluations(group);
  const gradeGroups = getActiveGradeGroups(group);
  if(calActiveEvalId){

    if(evaluation) return renderEvalScores(group, evaluation);
    calActiveEvalId = null;
  }

  const main = document.getElementById('main');
  const weightSum = totalWeightAssigned(group);
  const units = getGradingUnits(group);

  main.innerHTML = `
    ${groupHeaderCard(group)}

    <div class="card app-font">
      <h2>Grupos de notas (para notas sumativas)</h2>

        <input type="number" id="ggWeightPercent" min="1" max="100" value="20">
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-accent" id="addGradeGroupBtn">+ Crear grupo de notas</button>
      </div>
      <hr class="divider">
      ${gradeGroups.length === 0 ? '<div class="empty-state">No has creado grupos de notas.</div>' :
        gradeGroups.map(gg=>{
          const color = gradeGroupColor(gg.id);
          const memberCount = evaluations.filter(e=>e.gradeGroupId===gg.id).length;
          return `
            <div class="student-list-item" style="align-items:flex-start; border-left:4px solid ${color.text}; padding-left:8px;">
              <div>
                <strong style="color:${color.text};">${escapeHtml(gg.name)}</strong>
                <div class="muted">${memberCount} evaluación(es) · ${gg.weightType === 'weighted' ? 'Pondera ' + gg.weightPercent + '%' : 'Promedio simple'}</div>
              </div>
              <div class="row" style="gap:6px;">
                <button class="btn btn-outline btn-sm" onclick="editGradeGroup('${gg.id}')">Editar</button>
                <button class="btn btn-danger btn-sm" onclick="deleteGradeGroup('${gg.id}')">Eliminar</button>
              </div>
            </div>
          `;
        }).join('')
      }
    </div>

    <div class="card app-font">
      <h2>Agregar evaluación</h2>
      <div class="grid-2">
        <div>
          <label>Nombre</label>
          <input type="text" id="evalName" placeholder="Ej. Prueba 1">
        </div>
        <div>
          <label>Puntaje total</label>
          <input type="number" id="evalTotalScore" min="1" value="100">
        </div>
        <div>
          <label>% de exigencia (aprobación = 4.0)</label>
          <input type="number" id="evalExigencia" min="1" max="99" value="60">
        </div>
        <div>
          <label>Grupo de notas (opcional)</label>
          <select id="evalGradeGroup">
            <option value="">Ninguno (evaluación suelta)</option>
            ${gradeGroups.map(gg=>`<option value="${gg.id}">${escapeHtml(gg.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="evalStandaloneWeight">
        <div class="grid-2" style="margin-top:10px;">
          <div>
            <label>Tipo</label>
            <select id="evalWeightType">
              <option value="simple">Promedio simple</option>
              <option value="weighted">Ponderada (%)</option>
            </select>
          </div>
          <div id="evalWeightPercentWrap" style="display:none;">
            <label>% que pondera en la nota final</label>
            <input type="number" id="evalWeightPercent" min="1" max="100" value="20">

      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>

            }).join('')}
            ${gradeGroups.map(gg=>{
              const color = gradeGroupColor(gg.id);
              return `<th style="background:${color.bg}; color:${color.text};">${escapeHtml(gg.name)} (sumativa)</th>`;

            <th>Nota final</th>
          </tr>
        </thead>

            const result = computeStudentFinalGrade(group, s.id);

              <tr>
                <td><button class="student-name-link" onclick="openStudentDetail('${s.id}')">${escapeHtml(s.name)}</button></td>

                ${groupUnits.map(u=>{
                  const color = gradeGroupColor(u.gradeGroup.id);
                  const nota = computeUnitGrade(u, s.id);
                  return `<td style="background:${color.bg}; color:${color.text}; font-weight:700;">${nota !== null ? nota.toFixed(1) : '-'}</td>`;
                }).join('')}
                <td>${result.promedioSimple !== null ? result.promedioSimple.toFixed(1) : '-'}</td>
                <td class="avg-badge">${result.finalGrade !== null ? result.finalGrade.toFixed(1) : '-'}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
    ` : ''}
  `;

  const weightTypeSelect = document.getElementById('evalWeightType');
  weightTypeSelect.addEventListener('change', ()=>{
    document.getElementById('evalWeightPercentWrap').style.display = weightTypeSelect.value === 'weighted' ? 'block' : 'none';
  });

  const evalGradeGroupSelect = document.getElementById('evalGradeGroup');
  evalGradeGroupSelect.addEventListener('change', ()=>{
    const grouped = !!evalGradeGroupSelect.value;
    document.getElementById('evalStandaloneWeight').style.display = grouped ? 'none' : 'block';
    document.getElementById('evalGroupedNotice').style.display = grouped ? 'block' : 'none';
  });

  const ggWeightTypeSelect = document.getElementById('ggWeightType');
  ggWeightTypeSelect.addEventListener('change', ()=>{
    document.getElementById('ggWeightPercentWrap').style.display = ggWeightTypeSelect.value === 'weighted' ? 'block' : 'none';
  });

  document.getElementById('addGradeGroupBtn').addEventListener('click', ()=>{
    const name = document.getElementById('ggName').value.trim();
    const weightType = document.getElementById('ggWeightType').value;

    const weightPercent = weightType === 'weighted' ? Number(document.getElementById('evalWeightPercent').value) : null;
    if(!name || !totalScore || totalScore <= 0){ showToast('Completa el nombre y un puntaje total válido'); return; }
    group.evaluations.push({
      id: uid(), name, totalScore, exigencia: exigencia || 60,
      gradeGroupId,
      weightType, weightPercent: weightPercent || 0,
      scores: {}, overrides: {}, periodId: state.activePeriodId
    });
    saveState();
    renderCalificaciones(group);
    showToast('Evaluación agregada');
  });

  const exportGradesBtn = document.getElementById('exportGradesBtn');
  if(exportGradesBtn){
    exportGradesBtn.addEventListener('click', ()=> exportCalificacionesToExcel(group));
  }
}
